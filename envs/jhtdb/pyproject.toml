[project]
name = "blturb-jhtdb"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Querying the JHTDB with its current Python client, givernylocal. Used only
# by the token-gated scripts in scripts/standalone/, which are deliberately
# not pipeline stages: they need an access token at
# ~/.config/JHTDB/auth_token.txt, and what they fetch is committed as a
# dataset the pipeline reads, so `calkit run` never needs the token.
#
# The previous client, pyjhtdb, spoke the JHTDB's legacy SOAP service, which
# stopped working in 2025 (the service now answers with an HTTP 308), and it
# pinned this environment to numpy < 1.24. Nothing in the pipeline uses this
# environment, so no stage depends on its lock.
dependencies = [
  "givernylocal",
  "numpy",
  "h5py",
  "tqdm",
]
