stages:
  fetch-dns-data:
    cmd: calkit xenv -n py-compute --no-check -- python
      scripts/fetch-dns-data.py
    deps:
      - scripts/fetch-dns-data.py
      - envs/compute/uv.lock
      - envs/compute/.python-version
    outs:
      - data/lee-moser-channel:
          cache: false
          persist: false
      - data/kth-wing-sections:
          cache: false
          persist: false
    desc: Automatically generated from the 'fetch-dns-data' stage in
      calkit.yaml. Changes made here will be overwritten.
  make-dns-stats-table:
    cmd: calkit xenv -n py-compute --no-check -- python
      scripts/make-dns-stats-table.py
    deps:
      - scripts/make-dns-stats-table.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - pypkg/dns_stats.py
      - envs/compute/uv.lock
      - envs/compute/.python-version
    outs:
      - data/jhtdb-transitional-bl/all-stats.h5
    desc: Automatically generated from the 'make-dns-stats-table'
      stage in calkit.yaml. Changes made here will be overwritten.
  mesh-independence:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-mesh-independence.sh ${item.ny}
      ${item.turbulence}"
    deps:
      - sim/run-mesh-independence.sh
      - sim/system/blockMeshDict.template
      - sim/run.py
      - sim/system/sample
      - sim/system/controlDict
      - sim/system/fvSolution
      - sim/system/fvSchemes
      - .calkit/env-locks/blsim
    outs:
      - sim/cases/${item.turbulence}-ny-${item.ny}/postProcessing
      - sim/cases/${item.turbulence}-ny-${item.ny}/constant/polyMesh
    matrix:
      ny:
        - 15
        - 20
        - 30
        - 40
        - 60
      turbulence:
        - k-epsilon
    desc: Automatically generated from the 'mesh-independence' stage
      in calkit.yaml. Changes made here will be overwritten.
  laminar-sim:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-laminar.sh"
    deps:
      - sim/run-laminar.sh
      - sim/system/blockMeshDict.template
      - sim/run.py
      - sim/system/sample
      - sim/system/controlDict
      - sim/system/fvSolution
      - sim/system/fvSchemes
      - .calkit/env-locks/blsim
    outs:
      - sim/cases/laminar-ny-40/postProcessing
    desc: Automatically generated from the 'laminar-sim' stage in
      calkit.yaml. Changes made here will be overwritten.
  save-mesh-snapshot-isometric:
    cmd: bash --noprofile --norc -c "bash
      scripts/save-mesh-snapshot.sh"
    deps:
      - sim/cases/k-epsilon-ny-40/constant/polyMesh
      - scripts/save-mesh-snapshot.sh
    outs:
      - figures/rans-mesh-snapshot-isometric.png
    desc: Automatically generated from the
      'save-mesh-snapshot-isometric' stage in calkit.yaml. Changes
      made here will be overwritten.
  run-notebook:
    cmd: calkit nb execute --environment py-notebook --no-check --to
      html "notebooks/main.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebooks/main.ipynb
      - sim/cases/k-epsilon-ny-15/postProcessing
      - sim/cases/k-epsilon-ny-20/postProcessing
      - sim/cases/k-epsilon-ny-30/postProcessing
      - sim/cases/k-epsilon-ny-40/postProcessing
      - sim/cases/k-epsilon-ny-60/postProcessing
      - sim/cases/laminar-ny-40/postProcessing
      - envs/notebook/uv.lock
      - envs/notebook/.python-version
    outs:
      - .calkit/notebooks/executed/notebooks/main.ipynb:
          cache: true
      - .calkit/notebooks/html/notebooks/main.html:
          cache: true
    desc: Automatically generated from the 'run-notebook' stage in
      calkit.yaml. Changes made here will be overwritten.
  plot-bl-dns:
    cmd: calkit xenv -n py-viz --no-check -- python
      scripts/plot-bl-dns.py
    deps:
      - scripts/plot-bl-dns.py
      - data/jhtdb-transitional-bl/all-stats.h5
      - envs/viz/uv.lock
      - envs/viz/.python-version
    outs:
      - figures/bl-profile-dns.pdf
    desc: Automatically generated from the 'plot-bl-dns' stage in
      calkit.yaml. Changes made here will be overwritten.
  validate-bl-solver:
    cmd: calkit xenv -n py-compute --no-check -- python
      scripts/validate-bl-solver.py
    deps:
      - scripts/validate-bl-solver.py
      - pypkg/bl_solver.py
      - pypkg/closures.py
      - envs/compute/uv.lock
      - envs/compute/.python-version
    outs:
      - results/blasius-validation.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'validate-bl-solver' stage
      in calkit.yaml. Changes made here will be overwritten.
  discover-closure:
    cmd: calkit xenv -n py-compute --no-check -- python
      scripts/discover-closure.py --n-random 300 --n-refine 150
      --x-stride 8
    deps:
      - scripts/discover-closure.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - pypkg/bl_solver.py
      - pypkg/dns_case.py
      - pypkg/closures.py
      - pypkg/search.py
      - envs/compute/uv.lock
      - envs/compute/.python-version
    outs:
      - results/closure-search.json:
          cache: false
          persist: false
      - results/closure-params.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'discover-closure' stage in
      calkit.yaml. Changes made here will be overwritten.
  evolve-closure:
    cmd: calkit xenv -n py-compute --no-check -- python
      scripts/evolve-closure.py --generations 6 --population 14
      --x-stride 12
    deps:
      - scripts/evolve-closure.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - pypkg/bl_solver.py
      - pypkg/dns_case.py
      - pypkg/closures.py
      - pypkg/grammar.py
      - pypkg/evolve.py
      - envs/compute/uv.lock
