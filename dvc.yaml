stages:
  extract-jhtdb-stats:
    cmd: calkit xenv -n main-python --no-check -- bash --noprofile 
      --norc -c "python scripts/setup-dns.py"
    deps:
      - scripts/setup-dns.py
      - py_package/jhtdb.py
      - environment.yml
      - .calkit/env-locks/main-python
    outs:
      - data/jhtdb-transitional-bl/all-stats.h5
    desc: Automatically generated from the 'extract-jhtdb-stats' stage
      in calkit.yaml. Changes made here will be overwritten.
  compute-coeffs:
    cmd: bash --noprofile --norc -c "mkdir -p results && echo \"{}\" >
      results/coeffs.json"
    deps:
      - data/jhtdb-transitional-bl/all-stats.h5
    outs:
      - results/coeffs.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'compute-coeffs' stage in 
      calkit.yaml. Changes made here will be overwritten.
  mesh-independence:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-mesh-independence.sh ${item.ny} 
      ${item.turbulence}"
    deps:
      - sim/run-mesh-independence.sh
      - sim/system/blockMeshDict.template
      - sim/run.py
      - sim/system/sample
      - sim/system/controlDict
      - sim/system/fvSolution
      - sim/system/fvSchemes
      - .calkit/env-locks/blsim
    outs:
      - sim/cases/${item.turbulence}-ny-${item.ny}/postProcessing
    matrix:
      ny:
        - 15
        - 20
        - 30
        - 40
        - 60
      turbulence:
        - k-epsilon
    desc: Automatically generated from the 'mesh-independence' stage 
      in calkit.yaml. Changes made here will be overwritten.
  laminar-sim:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-laminar.sh"
    deps:
      - sim/run-laminar.sh
      - sim/system/blockMeshDict.template
      - sim/run.py
      - sim/system/sample
      - sim/system/controlDict
      - sim/system/fvSolution
      - sim/system/fvSchemes
      - .calkit/env-locks/blsim
    outs:
      - sim/cases/laminar-ny-40/postProcessing
    desc: Automatically generated from the 'laminar-sim' stage in 
      calkit.yaml. Changes made here will be overwritten.
  save-mesh-snapshot-isometric:
    cmd: bash --noprofile --norc -c "bash 
      scripts/save-mesh-snapshot.sh"
    deps:
      - sim/cases/k-epsilon-ny-40/constant/polyMesh
      - scripts/save-mesh-snapshot.sh
    outs:
      - figures/rans-mesh-snapshot-isometric.png
    desc: Automatically generated from the 
      'save-mesh-snapshot-isometric' stage in calkit.yaml. Changes 
      made here will be overwritten.
  run-notebook:
    cmd: calkit nb execute --environment main-python --no-check --to 
      html "notebook.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebook.ipynb
      - sim/cases/k-epsilon-ny-15/postProcessing
      - sim/cases/k-epsilon-ny-20/postProcessing
      - sim/cases/k-epsilon-ny-30/postProcessing
      - sim/cases/k-epsilon-ny-40/postProcessing
      - sim/cases/k-epsilon-ny-60/postProcessing
      - sim/cases/laminar-ny-40/postProcessing
      - .calkit/env-locks/main-python
    outs:
      - .calkit/notebooks/executed/notebook.ipynb:
          cache: true
      - .calkit/notebooks/html/notebook.html:
          cache: true
    desc: Automatically generated from the 'run-notebook' stage in 
      calkit.yaml. Changes made here will be overwritten.
  plot-bl-dns:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/plot-bl-dns.py
    deps:
      - scripts/plot-bl-dns.py
      - data/jhtdb-transitional-bl/all-stats.h5
      - .calkit/env-locks/main-python
    outs:
      - figures/bl-profile-dns.pdf
    desc: Automatically generated from the 'plot-bl-dns' stage in 
      calkit.yaml. Changes made here will be overwritten.
  build-paper:
    cmd: calkit latex build -e texlive --no-check paper/paper.tex
    deps:
      - paper/paper.tex
      - paper/paper.tex
      - figures/bl-profile-dns.pdf
      - references.bib
      - .calkit/env-locks/texlive
    outs:
      - paper/paper.pdf
    desc: Automatically generated from the 'build-paper' stage in 
      calkit.yaml. Changes made here will be overwritten.
  validate-bl-solver:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/validate-bl-solver.py
    deps:
      - scripts/validate-bl-solver.py
      - py_package/bl_solver.py
      - py_package/closures.py
      - .calkit/env-locks/main-python
    outs:
      - results/blasius-validation.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'validate-bl-solver' stage 
      in calkit.yaml. Changes made here will be overwritten.
  discover-closure:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/discover-closure.py --n-random 300 --n-refine 150 
      --x-stride 8
    deps:
      - scripts/discover-closure.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - py_package/bl_solver.py
      - py_package/dns_case.py
      - py_package/closures.py
      - py_package/search.py
      - .calkit/env-locks/main-python
    outs:
      - results/closure-search.json:
          cache: false
          persist: false
      - results/closure-params.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'discover-closure' stage in
      calkit.yaml. Changes made here will be overwritten.
  evolve-closure:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/evolve-closure.py --generations 6 --population 14 
      --x-stride 12
    deps:
      - scripts/evolve-closure.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - py_package/bl_solver.py
      - py_package/dns_case.py
      - py_package/closures.py
      - py_package/grammar.py
      - py_package/evolve.py
      - .calkit/env-locks/main-python
    outs:
      - results/closure-evolution.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'evolve-closure' stage in 
      calkit.yaml. Changes made here will be overwritten.
  fit-openfoam-coeffs:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/fit-openfoam-coeffs.py --n-random 500 --n-refine 250 
      --x-stride 8
    deps:
      - scripts/fit-openfoam-coeffs.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - py_package/bl_solver.py
      - py_package/dns_case.py
      - py_package/closures.py
      - py_package/search.py
      - .calkit/env-locks/main-python
    outs:
      - results/clip-k-gamma-coeffs.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'fit-openfoam-coeffs' stage
      in calkit.yaml. Changes made here will be overwritten.
  summarize-findings:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/summarize-findings.py
    deps:
      - scripts/summarize-findings.py
      - results/closure-search.json
      - results/closure-ablation.json
      - results/clip-k-gamma-coeffs.json
      - results/openfoam-vs-dns.json
      - results/exergy-budget.json
      - results/blasius-validation.json
      - results/closure-evolution.json
      - .calkit/env-locks/main-python
    outs:
      - results/findings.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'summarize-findings' stage 
      in calkit.yaml. Changes made here will be overwritten.
  analyze-exergy-budget:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/analyze-exergy-budget.py
    deps:
      - scripts/analyze-exergy-budget.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - py_package/dns_case.py
      - .calkit/env-locks/main-python
    outs:
      - results/exergy-budget.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'analyze-exergy-budget' 
      stage in calkit.yaml. Changes made here will be overwritten.
  ablate-closure:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/ablate-closure.py
    deps:
      - scripts/ablate-closure.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - results/clip-k-gamma-coeffs.json
      - py_package/bl_solver.py
      - py_package/dns_case.py
      - py_package/closures.py
      - .calkit/env-locks/main-python
    outs:
      - results/closure-ablation.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'ablate-closure' stage in 
      calkit.yaml. Changes made here will be overwritten.
  plot-closure-comparison:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/plot-closure-comparison.py
    deps:
      - scripts/plot-closure-comparison.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - results/closure-params.json
      - py_package/bl_solver.py
      - py_package/dns_case.py
      - py_package/closures.py
      - .calkit/env-locks/main-python
    outs:
      - figures/closure-comparison.pdf
    desc: Automatically generated from the 'plot-closure-comparison' 
      stage in calkit.yaml. Changes made here will be overwritten.
  build-turbulence-lib:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/build-model.sh"
    deps:
      - sim/build-model.sh
      - sim/newModel/src
      - .calkit/env-locks/blsim
    outs:
      - sim/newModel/platforms
    desc: Automatically generated from the 'build-turbulence-lib' 
      stage in calkit.yaml. Changes made here will be overwritten.
  baseline-wall-resolved-sims:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-baseline-wall-resolved.sh ${item.turbulence} 80 
      500"
    deps:
      - sim/run-baseline-wall-resolved.sh
      - sim/run.py
      - sim/system/blockMeshDict.template
      - sim/system/sample
      - sim/system/controlDict
      - sim/system/fvSolution
      - sim/system/fvSchemes
      - sim/constant/turbulenceProperties.template
      - .calkit/env-locks/blsim
    outs:
      - sim/cases/${item.turbulence}-wall-resolved/postProcessing
    matrix:
      turbulence:
        - k-epsilon
        - laminar
    desc: Automatically generated from the 
      'baseline-wall-resolved-sims' stage in calkit.yaml. Changes made
      here will be overwritten.
  clip-k-gamma-sim:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-clip-k-gamma.sh 80 500"
    deps:
      - results/clip-k-gamma-coeffs.json
      - sim/newModel/platforms
      - sim/run-clip-k-gamma.sh
      - sim/foam-env.sh
      - sim/run.py
      - sim/system/blockMeshDict.template
      - sim/system/sample
      - sim/system/controlDict
      - sim/system/fvSolution
      - sim/system/fvSchemes
      - sim/constant/turbulenceProperties.template
      - sim/fields-low-re
      - .calkit/env-locks/blsim
    outs:
      - sim/cases/clip-k-gamma-ny-80/postProcessing
    desc: Automatically generated from the 'clip-k-gamma-sim' stage in
      calkit.yaml. Changes made here will be overwritten.
  compare-openfoam-dns:
    cmd: calkit xenv -n main-python --no-check -- python 
      scripts/compare-openfoam-dns.py --cases 
      sim/cases/clip-k-gamma-ny-80 sim/cases/k-epsilon-wall-resolved 
      sim/cases/laminar-wall-resolved --labels clip-k-gamma k-epsilon 
      laminar
    deps:
      - scripts/compare-openfoam-dns.py
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
      - sim/cases/clip-k-gamma-ny-80/postProcessing
      - sim/cases/k-epsilon-wall-resolved/postProcessing
      - sim/cases/laminar-wall-resolved/postProcessing
      - py_package/dns_case.py
      - .calkit/env-locks/main-python
    outs:
      - results/openfoam-vs-dns.json:
          cache: false
          persist: false
      - figures/openfoam-vs-dns.pdf
    desc: Automatically generated from the 'compare-openfoam-dns' 
      stage in calkit.yaml. Changes made here will be overwritten.
  evolve-model:
    cmd: calkit xenv -n blsim --no-check -- bash --noprofile --norc -c
      "bash sim/run-evolve-model.sh"
    deps:
      - sim/run-evolve-model.sh
      - data/jhtdb-transitional-bl/all-stats.h5
      - sim/evolve-model.py
      - sim/run.py
      - sim/constant/turbulenceProperties.template
      - sim/newModel/src/ransFromDns/ransFromDns.C
      - sim/newModel/src/ransFromDns/ransFromDns.H
      - .calkit/env-locks/blsim
    outs:
      - results/model-evolution.json:
          cache: false
          persist: false
      - results/model-params.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'evolve-model' stage in 
      calkit.yaml. Changes made here will be overwritten.
