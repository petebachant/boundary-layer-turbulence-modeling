    desc: Automatically generated from the 'plot-bl-dns' stage in calkit.yaml.
      Changes made here will be overwritten.
  validate-bl-solver:
    cmd: calkit xenv -n py-compute --no-check -- python
      scripts/validate-bl-solver.py
    deps:
