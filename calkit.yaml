  - question: >-
      Does bypass transition begin at a fixed streak amplitude, whatever the
      free-stream intensity?
    hypothesis: >-
      Yes. If onset is a disturbance reaching a fixed headroom, the peak
      $u_\mathrm{{rms}}$ in the layer at onset is the same within 20 percent across
