# Answers are claims about pipeline outputs. Numbers in them are
# {placeholders} filled from `value` evidence when the questions are shown
# (`calkit list questions`), never retyped, and `calkit check questions`
# (also in `calkit status`) reports an answer as stale when any evidence it
# cites changed after the commit that last edited it. Reasoning lives in
# the paper, pointed at by `publication` evidence; dead ends are in
# docs/ideas-log.md and docs/clipping-closure.md.
questions:
  - question: >-
      Can new terms in the steady RANS equations make the mean flow match the
      DNS?
    hypothesis: >-
      A threshold, not extra smooth terms, is needed, because no k-epsilon
      coefficient set makes the laminar state a fixed point of the model.
    answer: >-
      Yes. A transported activation fraction with a rectified (clipping)
      source added to k-omega cuts the mean-velocity error against the DNS by
      {improvement:.1f}x relative to k-epsilon, in the elliptic OpenFOAM
      solver on a wall-resolved mesh.
    evidence:
      - kind: value
        path: results/findings.json
        key: openfoam_improvement_over_k_epsilon
        name: improvement
      - kind: result
        path: results/openfoam-vs-dns.json
      - kind: figure
        path: figures/openfoam-vs-dns.pdf
      - kind: publication
        path: paper/main.pdf
        section: Case setup sensitivity
        label: sec:bench
  - question: Can the Reynolds stress be modeled as a function of the mean flow?
    hypothesis: >-
      A scalar eddy viscosity relating the Reynolds stress to the mean strain
      is sufficient.
    answer: >-
      Only partly, and we can say where it fails. The eigenframes of the
      stress anisotropy and the mean strain are misaligned by
      {misalignment_pre:.0f} degrees before transition and still by
      {misalignment_turb:.0f} degrees in equilibrium turbulence, so an eddy
      viscosity is structurally wrong before transition and imperfect
      everywhere. That bounds any eddy-viscosity closure, ours included.
    evidence:
      - kind: value
        path: results/findings.json
        key: misalignment_deg_pretransition
        name: misalignment_pre
      - kind: value
        path: results/findings.json
        key: misalignment_deg_turbulent
        name: misalignment_turb
      - kind: result
        path: results/flow-structure.json
  - question: >-
      Is the clipping analogy - a flow holding more energy than smooth waves
      can carry, so it clips and redistributes into higher harmonics -
      load-bearing, or decorative?
    hypothesis: Decorative; the model works because of its other terms.
    answer: >-
      Load-bearing, so the hypothesis is refuted. Removing the rectifier
      raises the skin-friction error from {cf_reference:.1%} to
      {cf_no_clip:.0%}, worse than k-epsilon. The lift-up term is load-bearing
      too, at {cf_no_liftup:.0%} without it, while the streak viscous-decay
      term and the gate on omega production change the total score by
      {delta_no_decay:.3f} and {delta_ungated:.3f} and can be deleted
      outright.
    evidence:
      - kind: value
        path: results/findings.json
        key: ablation_reference_cf_rel_rms
        name: cf_reference
      - kind: value
        path: results/findings.json
        key: ablation_no_clip_cf_rel_rms
        name: cf_no_clip
      - kind: value
        path: results/findings.json
        key: ablation_no_liftup_cf_rel_rms
        name: cf_no_liftup
      - kind: value
        path: results/findings.json
        key: ablation_no_streak_decay_delta
        name: delta_no_decay
      - kind: value
        path: results/findings.json
        key: ablation_ungated_omega_delta
        name: delta_ungated
      - kind: result
        path: results/closure-ablation.json
  - question: Which local quantity should carry the transition threshold?
    answer: >-
      The vorticity Reynolds number Re_v = y^2 Omega / nu. Every Re_v variant
      beats every other driver tested, and the best structure is
      {best_structure}. The fitted threshold is {Lambda_c:.0f} against the
      classical value of 440, but the model is sensitive to it - using 440
      itself raises the skin-friction error from {cf_reference:.1%} to
      {cf_classical:.1%} - and the fit wanders within search noise, which the
      paper quantifies, so the constant is not settled.
    evidence:
      - kind: value
        path: results/findings.json
        key: best_structure
      - kind: value
        path: results/findings.json
        key: fitted_threshold_Lambda_c
        name: Lambda_c
      - kind: value
        path: results/findings.json
        key: ablation_reference_cf_rel_rms
        name: cf_reference
      - kind: value
        path: results/findings.json
        key: ablation_classical_threshold_cf_rel_rms
        name: cf_classical
      - kind: result
        path: results/closure-search.json
      - kind: publication
        path: paper/main.pdf
        section: What does not transfer
        label: sec:fails
  - question: >-
      Does transition redistribute energy between velocity components, or
      create correlation between them?
    hypothesis: >-
      Transition redistributes energy from the streamwise into the wall-normal
      and spanwise components.
    answer: >-
      Correlation, not redistribution. Through transition the u-v correlation
      coefficient grows {coherence_ratio:.1f}x while the energy partition
      changes by only {anisotropy_ratio:.1f}x; equivalently, the information
      shared between velocity components grows {total_correlation_ratio:.0f}x.
    evidence:
      - kind: value
        path: results/findings.json
        key: coherence_ratio
      - kind: value
        path: results/findings.json
        key: anisotropy_ratio
      - kind: value
        path: results/findings.json
        key: total_correlation_ratio
      - kind: result
        path: results/flow-structure.json
  - question: Can entropy alone serve as the closure variable?
    hypothesis: >-
      Transition can be modeled as entropy production in the fluctuation
      field, so a transported entropy would close the system.
    answer: >-
      No. The component entropy is non-monotone through transition, falling to
      {entropy_min:.2f} at x = {entropy_min_x:.0f} before recovering, so the
      constitutive relation is hysteretic rather than single-valued.
      Implemented as a closure it scores {entropy_closure_score:.1f} on the
      calibration case against {clip_closure_score:.2f} for the clipping
      closure, because a smooth relaxation balance cannot hold the laminar
      state. Entropy is a good diagnostic and a poor substitute for the
      threshold.
    evidence:
      - kind: value
        path: results/findings.json
        key: entropy_min
      - kind: value
        path: results/findings.json
        key: entropy_min_x
      - kind: value
        path: results/benchmark.json
        key: results.jhtdb-transitional-bl.entropy-k-omega-h.normalized
        name: entropy_closure_score
      - kind: value
        path: results/benchmark.json
        key: results.jhtdb-transitional-bl.clip-k-omega-gamma.normalized
        name: clip_closure_score
      - kind: result
        path: results/flow-structure.json
  - question: >-
      If entropy cannot be rejected as fast as the wall injects exergy, is the
      excess stored in the turbulence?
    hypothesis: >-
      Turbulence buffers exergy injection against entropy rejection, and the
      buffering matters most where the two are most out of balance.
    answer: >-
      Yes, as a transient of transition rather than a standing inventory.
      Storage peaks at {peak_storage:.0%} of the energy routed into turbulence
      at x = {peak_storage_x:.0f}, then collapses to a few percent. The
      turbulent share of entropy rejection rises from {rejection_low:.3f} to
      {rejection_high:.3f} with Reynolds number.
    evidence:
      - kind: value
        path: results/findings.json
        key: peak_turbulent_storage_fraction
        name: peak_storage
      - kind: value
        path: results/findings.json
        key: peak_turbulent_storage_x
        name: peak_storage_x
      - kind: value
        path: results/findings.json
        key: turbulent_rejection_fraction_low_Re
        name: rejection_low
      - kind: value
        path: results/findings.json
        key: turbulent_rejection_fraction_high_Re
        name: rejection_high
      - kind: result
        path: results/exergy-budget.json
      - kind: publication
        path: paper/main.pdf
        section: What transfers
        label: sec:transfers
  - question: >-
      Can a search discover the closure structure rather than have us impose
      it?
    answer: >-
      Not yet. {n_rectifier} of the top eight evolved structures use the
      rectifier - an earlier answer that all eight did was falsified when the
      pipeline was re-run - and the stage does not reproduce from run to run,
      so the {n_evaluated} structures evaluated are evidence of nothing either
      way until the search is reproducible and properly powered.
    notes: >-
      The non-reproducibility is roadmap.md section 4, the highest-priority
      bug.
    evidence:
      - kind: value
        path: results/findings.json
        key: evolved_top8_using_rectifier
        name: n_rectifier
      - kind: value
        path: results/findings.json
        key: evolved_structures_evaluated
        name: n_evaluated
      - kind: result
        path: results/closure-evolution.json
    reviewed: 2026-08-31 00:30:07
  - question: >-
      Is the parabolic screening solver accurate enough to rank closures
      against each other?
    answer: >-
      Yes. It reproduces the Blasius skin friction to within
      {cf_error_max:.1%}, well below the differences between the models it
      ranks, and the bias is systematic so comparisons stay fair.
    evidence:
      - kind: value
        path: results/findings.json
        key: screening_solver_cf_error_max
        name: cf_error_max
      - kind: result
        path: results/blasius-validation.json
      - kind: publication
        path: paper/main.pdf
        section: Closures tested and simulation setup
        label: sec:method
  - question: Does the closure survive a flow with no wall?
    hypothesis: >-
      A closure whose length scale and transition gate are built from wall
      distance produces nothing in a free shear layer; the transported-omega
      variant, whose length scale is k/omega, does not need the wall.
    answer: >-
      Confirmed, and it splits the closure family. On the temporally evolving
      mixing layer of Lusher et al. (2026), the three mixing-length clip
      closures are indistinguishable from laminar, because their van Driest
      damping is keyed to a wall shear that does not exist, while
      {best_closure} is the best model on the case at {best_score:.2f}, ahead
      of Launder-Sharma at {ls_score:.2f}. Everything downstream of the plate
      needs a length scale made of transported quantities.
    evidence:
      - kind: value
        path: results/findings.json
        key: mixing_layer_closures_identical_to_laminar
        name: laminar_like
      - kind: value
        path: results/findings.json
        key: mixing_layer_best_closure
        name: best_closure
      - kind: value
        path: results/findings.json
        key: mixing_layer_best_normalized
        name: best_score
      - kind: value
        path: results/findings.json
        key: mixing_layer_launder_sharma_normalized
        name: ls_score
      - kind: result
        path: results/benchmark.json
      - kind: publication
        path: paper/main.pdf
        section: Scoring across cases
        label: sec:scoring
    reviewed: 2026-08-31 00:30:09
  - question: Do coefficients fitted on one flow transfer to others?
    hypothesis: >-
      A closure that matches the calibration DNS closely has learned something
      general about transition.
    answer: >-
      No. Across {n_cases} cases in five geometries, the closure with the best
      in-sample score, clip-k-omega-gamma at {kog_in:.2f}, is the
      worst-transferring of the models that run, at {kog_out:.2f} out of
      sample, a penalty of {kog_penalty:.1f}x. Textbook Launder-Sharma, with
      no coefficient fitted here, is the best model out of sample at
      {ls_out:.2f} and the only one that runs on every case. The simpler
      clip-k-gamma transfers better than the elaborate one, at a penalty of
      {kg_penalty:.1f}x.
    evidence:
      - kind: value
        path: results/findings.json
        key: benchmark_n_cases
        name: n_cases
      - kind: value
        path: results/findings.json
        key: benchmark_best_out_of_sample_closure
        name: best_out
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_omega_gamma_in_sample_mean
        name: kog_in
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_omega_gamma_out_of_sample_mean
        name: kog_out
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_omega_gamma_transfer_penalty
        name: kog_penalty
      - kind: value
        path: results/findings.json
        key: benchmark_launder_sharma_out_of_sample_mean
        name: ls_out
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_gamma_transfer_penalty
        name: kg_penalty
      - kind: result
        path: results/benchmark.json
      - kind: publication
        path: paper/main.pdf
        section: Across the suite
        label: sec:generality
    reviewed: 2026-08-31 00:30:10
  - question: Which quantities transfer between flows?
    answer: >-
      The structure parameter a_1 and the dissipation coefficient C_eps in
      equilibrium turbulence, and nothing else tested. a_1 is
      {a1_transitional} at the downstream end of the transitional case and
      {a1_jimenez} across Re_theta 4000-6500 in the independent DNS, a
      difference of {a1_diff}%. C_eps is {ceps_turb} over the turbulent region
      and {ceps_jimenez} in the independent DNS, but varies by a factor of
      {ceps_ratio} through transition, so the cascade there is not in
      equilibrium.
    evidence:
      - kind: value
        path: results/paper-numbers.json
        key: aOneTransitional
        name: a1_transitional
      - kind: value
        path: results/paper-numbers.json
        key: aOneJimenez
        name: a1_jimenez
      - kind: value
        path: results/paper-numbers.json
        key: aOneRelDiff
        name: a1_diff
      - kind: value
        path: results/paper-numbers.json
        key: CepsTurb
        name: ceps_turb
      - kind: value
        path: results/paper-numbers.json
        key: CepsJimenez
        name: ceps_jimenez
      - kind: value
        path: results/paper-numbers.json
        key: CepsRatio
        name: ceps_ratio
      - kind: result
        path: results/energy-flux.json
      - kind: publication
        path: paper/main.pdf
        section: What transfers
        label: sec:transfers
  - question: Does a-priori regression on DNS features identify a constitutive law?
    hypothesis: >-
      A library fit with high in-sample R^2 has found the functional form of
      the Reynolds shear stress.
    answer: >-
      No. Regressing the shear stress on {n_terms} dimensionless groups gives
      R^2 = {stress_in} in sample, but coefficients fitted downstream and
      applied upstream give R^2 = {stress_down_up}, and fitted here and
      applied to the independent DNS give R^2 = {stress_to_jimenez}, although
      that DNS fits itself to {jimenez_self}. In-sample agreement does not
      distinguish a constitutive law from a curve fit.
    evidence:
      - kind: value
        path: results/paper-numbers.json
        key: NTerms
        name: n_terms
      - kind: value
        path: results/paper-numbers.json
        key: StressInSample
        name: stress_in
      - kind: value
        path: results/paper-numbers.json
        key: StressDownToUp
        name: stress_down_up
      - kind: value
        path: results/paper-numbers.json
        key: StressToJimenez
        name: stress_to_jimenez
      - kind: value
        path: results/paper-numbers.json
        key: JimenezSelfFit
        name: jimenez_self
      - kind: result
        path: results/pde-term-regression.json
      - kind: publication
        path: paper/main.pdf
        section: What does not transfer
        label: sec:fails
  - question: How much does case setup alone move a transition-model comparison?
    answer: >-
      More than the models differ. The Langtry-Menter model on the same mesh
      with no coefficient changed goes from a skin-friction error of
      {lm_old_cf} with the inlet 127 units upstream and an arbitrary
      Re_theta_t to {lm_new_cf} with the inlet at the DNS station and
      Re_theta_t from its own correlation. Every comparison in this project
      therefore places the inlet at the DNS station and fits inlet conditions
      per model to the same measured free-stream decay.
    evidence:
      - kind: value
        path: results/paper-numbers.json
        key: LMOldCf
        name: lm_old_cf
      - kind: value
        path: results/paper-numbers.json
        key: LMNewCf
        name: lm_new_cf
      - kind: value
        path: results/paper-numbers.json
        key: LMOldU
        name: lm_old_u
      - kind: value
        path: results/paper-numbers.json
        key: LMNewU
        name: lm_new_u
      - kind: result
        path: results/dns-domain-vs-dns.json
      - kind: publication
        path: paper/main.pdf
        section: Case setup sensitivity
        label: sec:bench
  - question: >-
      Does closing the momentum equation with terms beyond an eddy viscosity
      help, and does it transfer?
    hypothesis: >-
      The 44-degree misalignment between stress and strain means an eddy
      viscosity cannot represent the pre-transitional flow, so extra force
      terms built from k, omega and the mean gradients should improve the fit
      and, being dimensionless and Galilean invariant, should transfer.
    answer: >-
      It helps in sample and does not transfer. Fitted on the plate alone by
      Bayesian optimization of the a-posteriori score, six such terms on
      Launder-Sharma cut its error there from {ls_plate:.2f} to
      {single_best:.2f} with coefficients of order 0.03, and raise its
      out-of-sample mean from {single_base_out:.2f} to {single_out:.2f}.
      Fitted jointly on four cases in four geometries, the optimum found over
      {multi_n} evaluations ({multi_div} diverged) is the base closure itself,
      coefficients zero, so the data prefer no extra term to any one term at
      the same coefficient everywhere.
    notes: >-
      Fast tier only, terms with wall-normal derivatives; a small optimization
      budget in six dimensions; near-best intervals rather than posteriors.
      See docs/ideas-log.md section 7.1.
    evidence:
      - kind: value
        path: results/findings.json
        key: momentum_library_single_best_objective
        name: single_best
      - kind: value
        path: results/findings.json
        key: baseline_ls_plate
        name: ls_plate
      - kind: value
        path: results/findings.json
        key: momentum_library_single_out_of_sample_mean
        name: single_out
      - kind: value
        path: results/findings.json
        key: momentum_library_single_base_out_of_sample_mean
        name: single_base_out
      - kind: value
        path: results/findings.json
        key: momentum_library_multi_best_objective
        name: multi_best
      - kind: value
        path: results/findings.json
        key: momentum_library_multi_n_evaluations
        name: multi_n
      - kind: value
        path: results/findings.json
        key: momentum_library_multi_n_diverged
        name: multi_div
      - kind: value
        path: results/findings.json
        key: momentum_library_multi_coeffs
        name: multi_coeffs
      - kind: result
        path: results/momentum-library.json
      - kind: result
        path: results/momentum-library-multi.json
      - kind: publication
        path: paper/main.pdf
        section: Beyond eddy viscosity
        label: sec:momentum-library
    reviewed: 2026-08-31 00:30:14
  - question: >-
      Do the fast-tier rankings hold when the same closures are run in OpenFOAM on
      separated and secondary flows?
    hypothesis: >-
      The parabolic screening tier orders closures the way the elliptic tier does,
      so a fast-tier optimum can be promoted without a Tier-2 check.
    answer: >-
      No. On the {n_cases} Closure Challenge DNS cases run in OpenFOAM - four parameterized
      periodic hills and four ducts - the published transition models lead ({best}
      at {best_mean:.2f} out of sample, SST at {sst:.2f}, kkL-omega at {kkl:.2f});
      the clipping closure relaminarizes every duct ({clip_duct:.1f} against laminar's
      {lam_duct:.1f}) and scores {clip_hill:.1f} on the hills; and Launder-Sharma,
      the fast tier's best model out of sample, diverges on {ls_div} hills and blows
      up finitely on a third. The two tiers rank the models differently, so the screening
      tier is for optimization and the elliptic tier is the benchmark of record.
    notes: >-
      One convergence criterion, one set of derived fields and no per-model tuning
      on any case; see docs/rans-gym.md section 4 and pypkg/cases/openfoam.py.
    evidence:
      - kind: value
        path: results/findings.json
        key: tier2_n_cases
        name: n_cases
      - kind: value
        path: results/findings.json
        key: tier2_best_closure
        name: best
      - kind: value
        path: results/findings.json
        key: tier2_k_omega_sst_lm_out_of_sample_mean
        name: best_mean
      - kind: value
        path: results/findings.json
        key: tier2_k_omega_sst_out_of_sample_mean
        name: sst
      - kind: value
        path: results/findings.json
        key: tier2_kkl_omega_out_of_sample_mean
        name: kkl
      - kind: value
        path: results/findings.json
        key: tier2_clip_k_omega_gamma_duct_mean
        name: clip_duct
      - kind: value
        path: results/findings.json
        key: tier2_laminar_duct_mean
        name: lam_duct
      - kind: value
        path: results/findings.json
        key: tier2_clip_k_omega_gamma_hill_mean
        name: clip_hill
      - kind: value
        path: results/findings.json
        key: tier2_launder_sharma_n_diverged
        name: ls_div
      - kind: value
        path: results/findings.json
        key: tier_rankings_agree
        name: agree
      - kind: result
        path: results/benchmark-openfoam.json
      - kind: result
        path: results/tier-discrepancy.json
      - kind: publication
        path: paper/main.pdf
        section: Across the suite
        label: sec:generality
  - question: >-
      Does the transition threshold depend on the free-stream turbulence
      level, as it physically must?
    hypothesis: Higher free-stream turbulence lowers the critical Reynolds number.
    notes: >-
      Open, and the most important gap. Everything here is calibrated on one
      DNS at one turbulence level, so the dependence cannot be seen at all.
      The fitted omega destruction coefficient beta = {beta:.3f}, against the
      standard 0.072, is a single-case compensation not to be trusted until a
      second flow tests it.
    evidence:
      - kind: value
        path: results/clip-k-gamma-coeffs.json
        key: internal_coeffs.beta
        name: beta
  - question: >-
      Can we write an evolution equation for a structure variable such as Q or
      lambda_2, rather than for an energy, from an advection-diffusion
      skeleton plus coupling terms from the mean momentum and continuity
      equations?
    notes: >-
      Open. Needs fluctuating velocity gradients, which means a new JHTDB
      pull. See docs/ideas-log.md section 3.
  - question: >-
      Do the Reynolds stress transport terms proposed in notebooks/main.ipynb
      outperform the activation approach?
    notes: >-
      Open as posed. They were written down but never tested in a forward
      solve. Two of them, a*grad(K) and b*(grad(U) dot grad(P)), were
      hard-coded into sim/newModel/solver/UEqn.H with fixed coefficients; that
      solver is used only by the evolve-model stage, so no result in the paper
      depended on them, and they now default to zero. Neither is Galilean
      invariant (|U|^2 is frame-dependent), so they are not carried into the
      momentum-term library, which is the successor to this idea; see the
      fit-momentum-library stages.


datasets:
  # This section declares what this project IMPORTS from elsewhere and what it
  # EXPORTS for others to reuse. It is not a listing of every file the pipeline
  # writes -- those are already declared as stage outputs, which is where a
  # reader should look for them.
  #
  # None of the imports below is published under a data DOI: JHTDB, the
  # Sillero/Jimenez server, the UT Austin channel database, the KTH/FAU
  # wing-section database, the NASA TMR and the JAXA DNS database all
  # distribute their data as plain files. Each `imported_from.doi` is
  # therefore the DOI of the paper that describes the data, which is the
  # citable, resolvable record the files can be traced back to; the download
  # URL is in scripts/fetch-dns-data.py (or, for the two datasets fetched by
  # hand, in the description), and the paper is in references.bib under the
  # key named in each description. If a dataset is ever minted its own DOI,
  # point the entry at that instead.

  # ---- imported ---------------------------------------------------------
  - path: data/jhtdb-transitional-bl/time-ave-profiles.h5
    title: JHTDB transitional boundary layer, time-averaged profiles
    description: >
      Time- and spanwise-averaged profiles for the JHTDB transition_bl
      dataset, from https://turbulence.pha.jhu.edu/datasets.aspx. The
      calibration case for every closure in this project. Cite Zaki2013.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2024-08-22
  - path: data/jiminez
    title: Sillero/Jimenez ZPG turbulent boundary layer profiles
    description: >
      Six stations at Re_theta 4000-6500, in wall units, from
      https://torroja.dmt.upm.es/turbdata/blayers/. Used both for the a-priori
      term regression and as the jimenez-zpg-tbl benchmark case. Cite
      Sillero2013.
    imported_from:
      doi: 10.1063/1.4823831
      date: 2024-09-04
  - path: data/lee-moser-channel
    title: Lee & Moser turbulent channel profiles, Re_tau 180-5200
    description: >
      Mean and fluctuation profiles at five Reynolds numbers. Fetched by the
      fetch-dns-data stage, which pins each file by url, retrieval date and
      SHA-256. Cite LeeMoser2015.
    imported_from:
      doi: 10.1017/jfm.2015.268
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/crs-separation-bubble
    title: Coleman, Rumsey & Spalart DNS of 2-D turbulent separation bubbles
    description: >
      Flat-plate boundary layers driven to genuine separation and reattachment
      by top-wall transpiration, at Re_theta up to 10,700. True DNS, published
      through the NASA Turbulence Modeling Resource specifically for
      turbulence-model validation, and therefore the case a claim about
      separation should rest on rather than the wing-section LES below. The
      wall-normal profiles are 110 MB of ASCII per case upstream; the
      fetch-dns-data stage subsamples them in x and stores ~1 MB of npz. Cite
      Coleman2018.
    imported_from:
      doi: 10.1017/jfm.2018.257
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/kth-wing-sections
    title: KTH well-resolved LES of NACA 4412 and NACA 0012 wing sections
    description: >
      Fifty boundary-layer stations along each wing section at Re_c up to
      1,000,000, with c_f, the Clauser parameter and the Reynolds stresses.
      NOTE: well-resolved LES, not DNS -- the only non-DNS reference in the
      suite. A sub-grid model is itself a turbulence model, so this case
      compares a closure against a model rather than against the equations.
      The suction side reaches beta = 112 with c_f falling to 1.8e-4 without
      separating, which is the near-separation test the closures most need.
      Fetched by the fetch-dns-data stage. Cite Vinuesa2018.
    imported_from:
      doi: 10.1016/j.ijheatfluidflow.2018.04.017
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/jaxa-shear-layer-vortex
    title: >-
      Lusher et al. DNS of a temporally evolving shear layer rolling up into
      vortices
    description: >
      Time histories (t_hat = 0 to 6, 301 instants) of peak and integral
      quantities -- peak vorticity of both signs, minimum pressure, peak
      velocity, peak eddy viscosity, momentum and vorticity thickness, peak
      shear stress and TKE, integrated TKE, production and kinetic energy --
      from a 12.7-billion-point OpenSBLI DNS at dU Lx/nu = 250,000, ensemble
      averaged over five realizations. This is the only published form of the
      DNS: no profiles, no fields. The pre-roll-up phase (t_hat < 0.4) is the
      temporal-mixing-layer benchmark case, the suite's first flow without a
      wall; the vortex phase is the target for a Tier-2 unsteady 2-D case.
      Fetched by the fetch-dns-data stage. Cite Lusher2026 for the DNS and
      Sansica2026 for the RANS comparison; JAXA reserves rights to the data
      and asks that the source be quoted.
    imported_from:
      doi: 10.1007/s00162-026-00788-y
      date: 2026-08-29

    stage: fetch-dns-data
  - path: data/closure-challenge
    title: >-
      Closure Challenge DNS cases as OpenFOAM setups with the DNS on the RANS
      mesh
    description: >
      The DNS cases of the Closure Challenge benchmark, taken as the complete
      OpenFOAM case directories the challenge ships (mesh, boundary
      conditions, schemes) with the DNS mean velocity, kinetic energy and
      Reynolds stresses interpolated onto the RANS mesh: four parameterized
      periodic hills (the DNS of Xiao et al. 2020, cite Xiao2020) and four
      square/rectangular ducts (the DNS of Vinuesa et al. 2014, cite
      Vinuesa2014), all from the challenge's own test set so scores are
      comparable with its leaderboard. The challenge's LES and experimental
      cases are excluded because this suite scores against DNS only, and its
      k-omega SST solutions are excluded because nothing here is trained
      against a RANS solution. Fetched by the fetch-dns-data stage from a
      pinned commit of the challenge repository
      (github.com/rmcconke/closure-challenge-benchmark). Cite McConkey2026.
    imported_from:
      git:
        repo_url: https://github.com/rmcconke/closure-challenge-benchmark.git
        rev: d572d40c87f6f56ebbaf9a10c463ee330aa32514
        path: data
      date: '2026-08-30'
    stage: fetch-dns-data
  - path: data/jhtdb-transitional-bl/sampled-gradients.h5
    title: JHTDB exact gradients and Hessians at 100 sampled points
    description: >
      Velocity and pressure gradients and Hessians queried from the JHTDB web
      service at 100 points, including the spanwise derivatives that cannot be
      obtained from the 2-D time-averaged profiles at all. Kept as their own
      small file rather than merged into all-stats.h5, because fetching them
      requires a JHTDB access token and so must not sit on the pipeline's
      critical path; regenerate with
      scripts/standalone/fetch-jhtdb-gradients.py. The notebook's continuity
      check is the only consumer. Queried from
      https://turbulence.pha.jhu.edu/datasets.aspx.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2024-08-22

  # ---- exported ---------------------------------------------------------
  - path: data/jhtdb-transitional-bl/all-stats.h5
    title: DNS statistics table
    description: >
      The JHTDB profiles flattened onto an (x, y) index with finite-difference
      gradients, derived from the imported profiles above.
    tabular: true
    stage: make-dns-stats-table
  - path: results/benchmark.json
    title: RANS gym leaderboard
    description: >
      Every registered closure scored against every registered case, with
      in-sample and out-of-sample results separated by each closure's declared
      calibration case. The reusable product of the benchmarking harness.
    stage: run-benchmark

figures:
  - path: figures/streak-reservoir.pdf
    title: Streak reservoir against the DNS
    description: >
      Peak fluctuation energy, vorticity Reynolds number and eddy viscosity
      along the plate, DNS against the closure.
    stage: analyze-streak-reservoir
  - path: figures/bl-profile-dns.pdf
    title: The boundary layer profile from DNS data
    description: The mean boundary layer profile computed from the DNS data.
    stage: plot-bl-dns
    data:
      - data/jhtdb-transitional-bl/all-stats.h5
  - path: figures/rans-mesh-snapshot-isometric.png
    title: RANS simulation mesh snapshot
    description: A snapshot of the RANS simulation mesh.
    stage: save-mesh-snapshot-isometric
  - path: figures/openfoam-vs-dns.pdf
    title: OpenFOAM profiles against DNS
    description: >
      Velocity profiles from the elliptic OpenFOAM solution compared with the
      DNS across the laminar, transitional and turbulent regions.
    stage: compare-openfoam-dns
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
  - path: figures/closure-comparison.pdf
    title: Closure comparison against DNS
    description: >
      Skin friction and shape factor over the whole plate for the laminar,
      k-epsilon and clipping k-gamma closures, with the activation field.
    stage: plot-closure-comparison
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5

publications:
  - path: paper/main.pdf
    title: Deriving a new RANS model from DNS data
    description: The primary publication from this project.
    stage: build-paper
    kind: journal-article

environments:
  py-compute:
    kind: uv
    path: envs/compute/pyproject.toml
    description: >
      Numerics only, on Python 3.14. Every closure search, fit, ablation and
      benchmark run depends on this environment's lock, so a package added
      here invalidates results that are expensive to reproduce. Plotting
      packages belong in py-viz. pypkg is installed editable, so stages depend
      on the specific modules they use rather than on the whole package.
  py-viz:
    kind: uv
    path: envs/viz/pyproject.toml
    description: >
      Figures and reporting, layered on the same numerics. Split from
      py-compute so that adding a plotting package does not invalidate a week
      of coefficient fitting. The dependency runs one way on purpose: bumping
      numpy correctly invalidates the figures drawn from it, but not the
      reverse.
  py-jhtdb:
    kind: uv
    path: envs/jhtdb/pyproject.toml
    description: >
      Querying the JHTDB web service, pinned to Python 3.11 and numpy < 1.24
      because pyjhtdb builds from source against APIs removed in numpy 1.24
      and imports pkg_resources in its setup.py. Used only by
      scripts/standalone/fetch-jhtdb-gradients.py, which is deliberately not a
      pipeline stage: it needs a JHTDB access token and nothing consumes its
      output. Declared so that the token-gated path is reproducible rather
      than folklore; because no stage uses it, no stage depends on its lock
      and it cannot invalidate any result.
  py-notebook:
    kind: uv
    path: envs/notebook/pyproject.toml
    description: >
      The exploratory notebook, which needs Jupyter and calkit itself. Kept
      separate so Jupyter's large and fast-moving dependency tree cannot
      invalidate a figure or a fit. Resolves GitHub issue #18.
  blsim:
    kind: docker
    path: sim/Dockerfile
    wdir: /sim
    description: >
      OpenFOAM v2412 toolchain with foamPy. The custom turbulence models are
      deliberately not built into this image: they are compiled into the
      working tree by the build-turbulence-lib stage so that editing a model
      invalidates only the stages that use it, rather than changing this
      environment lock and invalidating every result produced with it.
    registry: ghcr.io
  texlive:
    kind: docker
    image: texlive/texlive:latest-full

pipeline:
  stages:
    fetch-dns-data:
      kind: python-script
      environment: py-compute
      script_path: scripts/fetch-dns-data.py
      outputs:
        - path: data/lee-moser-channel
          storage: git
        - path: data/kth-wing-sections
          storage: git
        - path: data/crs-separation-bubble
          storage: git
        - path: data/jaxa-shear-layer-vortex
          storage: git
        - data/closure-challenge
      description: >
        Fetch the external DNS/LES reference datasets the benchmark cases
        need, with the retrieving code under version control rather than
        trusting that someone once ran curl. Source URLs are in the script;
        the citation and retrieval date for each dataset are declared once
        under `datasets`. No checksum file: DVC and git already hash the
        content, and the commit that added the files records when they were
        fetched. Idempotent -- a file already present is not re-downloaded, so
        an ordinary run does no network I/O.
    make-dns-stats-table:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-dns-stats-table.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_stats.py
      outputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      description: >
        Flatten the time-averaged DNS profiles into the (x, y) statistics
        table. Replaces extract-jhtdb-stats, which called setup-dns.py and, if
        the file happened to be missing, downloaded a prebuilt copy from
        Google Drive -- an opaque fetch rather than a derivation, and it put
        pyJHTDB (token-gated, and unbuildable against numpy >= 1.24) on the
        critical path of a pipeline that never used it. This stage is a pure
        function of a tracked input and reproduces the old table bit-for-bit
        on all 23 columns that have a consumer. The 36 JHTDB web-service
        columns are dropped: they were populated at 100 of 743,680 rows and
        nothing read them. Fetching those now lives outside the pipeline, in
        scripts/standalone/fetch-jhtdb-gradients.py.
    mesh-independence:
      kind: shell-command
      environment: blsim
      command: bash sim/run-mesh-independence.sh {ny} {turbulence}
      iterate_over:
        - arg_name: ny
          values: [15, 20, 30, 40, 60]
        - arg_name: turbulence
          values: [k-epsilon]
      inputs:
        - sim/run-mesh-independence.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/{turbulence}-ny-{ny}/postProcessing
        # The mesh is a real product of this stage: blockMesh writes it, and
        # save-mesh-snapshot-isometric consumes it. Leaving it undeclared made
        # that stage depend on a file no stage produced, so it could not run
        # at all on a fresh clone.
        - sim/cases/{turbulence}-ny-{ny}/constant/polyMesh
    laminar-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-laminar.sh
      inputs:
        - sim/run-laminar.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/laminar-ny-40/postProcessing
    save-mesh-snapshot-isometric:
      kind: shell-command
      environment: _system
      command: bash scripts/save-mesh-snapshot.sh
      inputs:
        - sim/cases/k-epsilon-ny-40/constant/polyMesh
        - scripts/save-mesh-snapshot.sh
      outputs:
        - figures/rans-mesh-snapshot-isometric.png
    run-notebook:
      kind: jupyter-notebook
      environment: py-notebook
      notebook_path: notebooks/main.ipynb
      executed_ipynb_storage: dvc
      html_storage: dvc
      inputs:
        - sim/cases/k-epsilon-ny-15/postProcessing
        - sim/cases/k-epsilon-ny-20/postProcessing
        - sim/cases/k-epsilon-ny-30/postProcessing
        - sim/cases/k-epsilon-ny-40/postProcessing
        - sim/cases/k-epsilon-ny-60/postProcessing
        - sim/cases/laminar-ny-40/postProcessing
    plot-bl-dns:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot-bl-dns.py
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - figures/bl-profile-dns.pdf
    validate-bl-solver:
      kind: python-script
      environment: py-compute
      script_path: scripts/validate-bl-solver.py
      inputs:
        - pypkg/bl_solver.py
        - pypkg/closures.py
      outputs:
        - path: results/blasius-validation.json
          storage: git
      description: >
        Check the parabolic screening solver against the Blasius similarity
        solution, so its discretization error is known to be smaller than the
        model differences it is used to judge.
    discover-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/discover-closure.py
      args:
        - --n-random
        - "300"
        - --n-refine
        - "150"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/closure-search.json
          storage: git
        - path: results/closure-params.json
          storage: git
      description: >
        Search structural variants of the clipping closure and fit each one's
        coefficients against the DNS using the fast parabolic solver. This is
        the cheap screening fidelity; promising models are then run in
        OpenFOAM.
    evolve-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/evolve-closure.py
      args:
        - --generations
        - "6"
        - --population
        - "14"
        - --x-stride
        - "12"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/grammar.py
        - pypkg/evolve.py
      outputs:
        - path: results/closure-evolution.json
          storage: git
      description: >
        Evolve the structure of the activation source term, varying which
        operators and derived quantities appear rather than only the
        coefficients on a fixed set of terms. Reports a Pareto front of error
        against term count.
    fit-openfoam-coeffs:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-openfoam-coeffs.py
      args:
        - --n-random
        - "500"
        - --n-refine
        - "250"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/clip-k-gamma-coeffs.json
          storage: git
      description: >
        Fit the transported-omega form of the closure, which is what the
        OpenFOAM model implements. Coefficients fitted for the mixing-length
        form are not transferable to it.
    analyze-flow-structure:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-flow-structure.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/flow-structure.json
          storage: git
      description: >
        Structural diagnostics: coherence versus energy partition, total
        correlation in bits, component entropy, Lumley invariants, and the
        misalignment between the stress anisotropy and the mean strain. These
        measure how much structure the flow carries rather than how much
        energy, which is what distinguishes transition from mere loudness.
    analyze-exergy-budget:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-exergy-budget.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/exergy-budget.json
          storage: git
      description: >
        Thermodynamic budget of the transitional boundary layer: exergy input,
        immediate (direct viscous) entropy rejection, rejection buffered
        through the turbulent reservoir, and the storage that results when
        rejection cannot keep up with injection.
    analyze-streak-reservoir:
      kind: python-script
      environment: py-viz
      script_path: scripts/analyze-streak-reservoir.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - path: results/streak-reservoir.json
          storage: git
        - path: figures/streak-reservoir.pdf
      description: >
        Measure the pre-transitional streak reservoir a priori from the DNS --
        the fluctuation-energy budget, the implied eddy viscosity and
        structure parameter, and the vorticity Reynolds number the clip fires
        on -- and compare it with what the closure actually produces. The
        mean-field objective cannot see this, so a model can lose the
        reservoir the closure is built on and still score well on skin
        friction.
    analyze-energy-flux:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-energy-flux.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - pypkg/dns_case.py
      outputs:
        - path: results/energy-flux.json
          storage: git
      description: >
        Integral energy-flux budget. The integrated dissipation is measured
        from the exact steady k balance rather than modeled, since transport
        terms are internal and cancel. Reports the dissipation coefficient
        C_eps = eps*L/u'^3, which every equilibrium closure treats as a
        constant: it holds to 1.5 percent in the turbulent region and in an
        independent turbulent DNS, but varies roughly sevenfold through
        transition, so the cascade there is not in equilibrium.
    regress-pde-terms:
      kind: python-script
      environment: py-compute
      script_path: scripts/regress-pde-terms.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - pypkg/dns_case.py
      outputs:
        - path: results/pde-term-regression.json
          storage: git
      description: >
        A-priori least squares over a library of closure terms computed
        directly from the DNS, for both the Reynolds shear stress and the
        unclosed residual of the k budget. Reports in-sample fit against
        transfer across flow regions and across an independent DNS, plus a
        guard against the trivial solution where a library column is itself
        essentially the target. In-sample R^2 near 0.95 is easy and means
        nothing; only the transfer tests distinguish a constitutive law from a
        curve fit.
    measure-fit-noise:
      kind: python-script
      environment: py-compute
      script_path: scripts/measure-fit-noise.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/fit-noise.json
          storage: git
      description: >
        Fit each structural variant several times under an identical protocol,
        varying only the random seed, and compare the spread of the resulting
        scores with the gaps between structures. Ranking structures by their
        inner coefficient fit is only evidence if that fit is converged; this
        stage measures whether it is.
    ablate-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/ablate-closure.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - path: results/closure-ablation.json
          storage: git
      description: >
        Remove one ingredient at a time from the fitted closure and re-score,
        to establish which terms are load-bearing and which are decorative.
    fit-momentum-library:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-momentum-library.py
      args:
        - --fit-cases
        - jhtdb-transitional-bl
        - --n-init
        - "12"
        - --n-iter
        - "60"
        - --out
        - results/momentum-library.json
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/jaxa-shear-layer-vortex
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/momentum_library.py
        - pypkg/bayesopt.py
        - pypkg/dns_case.py
        - pypkg/cases
      outputs:
        - path: results/momentum-library.json
          storage: git
      description: >
        Fit the six momentum-library coefficients on the calibration plate
        alone by Bayesian optimization of the a-posteriori benchmark score,
        then score the result on every case. This is the single-case fit whose
        transfer penalty the multi-case fit below is compared with.
    fit-momentum-library-multi:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-momentum-library.py
      args:
        - --fit-cases
        - jhtdb-transitional-bl,jimenez-zpg-tbl,channel-retau-1000,temporal-mixing-layer
        - --n-init
        - "12"
        - --n-iter
        - "48"
        - --out
        - results/momentum-library-multi.json
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/jaxa-shear-layer-vortex
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/momentum_library.py
        - pypkg/bayesopt.py
        - pypkg/dns_case.py
        - pypkg/cases
      outputs:
        - path: results/momentum-library-multi.json
          storage: git
      description: >
        The same library fitted jointly on four cases in four geometries,
        which is the experiment the benchmark exists to make routine: one
        coefficient set, several flows, and the in-sample accuracy it costs
        reported next to the out-of-sample gain.
    run-benchmark:
      kind: python-script
      environment: py-compute
      script_path: scripts/run-benchmark.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/jaxa-shear-layer-vortex
        - results/closure-params.json
        - results/clip-k-gamma-coeffs.json
        - results/momentum-library.json
        - results/momentum-library-multi.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/momentum_library.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/benchmark.json
          storage: git
      description: >
        The benchmarking harness. Runs every registered closure against every
        registered case and writes a leaderboard that separates in-sample from
        out-of-sample scores, using each closure's declared calibration case.
        The separation is the point: this project's own finding is that
        in-sample agreement did not distinguish a constitutive law from a
        curve fit, so a single aggregate score would rebuild the trap. Adding
        a new closure or case means registering it, not editing this stage.
    measure-tier-discrepancy:
      kind: python-script
      environment: py-compute
      script_path: scripts/measure-tier-discrepancy.py
      inputs:
        - results/benchmark.json
        - results/dns-domain-vs-dns.json
        - results/openfoam-vs-dns.json
      outputs:
        - path: results/tier-discrepancy.json
          storage: git
      description: >
        Pair every closure that ran on the plate in both tiers and
        characterize the screening bias of the parabolic solver against the
        elliptic one, which is the ingredient a multi-fidelity coefficient
        optimization needs (ideas-log 7.4). A characterization, not a
        surrogate: the tiers report slightly different skin-friction
        metrics and only a few closures exist in both.
    run-benchmark-openfoam:
      kind: python-script
      environment: py-compute
      script_path: scripts/run-benchmark.py
      args:
        - --tier
        - openfoam
        - --out
        - results/benchmark-openfoam.json
        - --parallel
        - "8"
      inputs:
        - data/closure-challenge
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
        - pypkg/closures.py
        - pypkg/registry.py
        - pypkg/cases/openfoam.py
        - pypkg/cases/base.py
      outputs:
        - path: results/benchmark-openfoam.json
          storage: git
      description: >
        The Tier-2 benchmark: every closure with an OpenFOAM model run with
        simpleFoam on the Closure Challenge's DNS cases -- four parameterized
        periodic hills and four ducts -- and scored against the DNS at the
        challenge's evaluation points. Separate from the fast tier because a
        run is minutes rather than seconds, and because the published
        baselines (SST, gamma-Re_theta, kkL-omega) exist only here. The solver
        runs through calkit xenv in the blsim environment, so the Docker
        toolchain is the environment of record even though the stage itself is
        a Python script.
    plot-closure-comparison:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot-closure-comparison.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/closure-params.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - figures/closure-comparison.pdf
    build-turbulence-lib:
      kind: shell-command
      environment: blsim
      command: bash sim/build-model.sh
      inputs:
        - sim/build-model.sh
        - sim/newModel/src
        - sim/newModel/solver
      outputs:
        - sim/newModel/platforms
      description: >
        Compile the custom turbulence models into the working tree. Kept out
        of the Docker image on purpose: baking them in would make every model
        edit change the environment lock and invalidate unrelated results.
    make-inlet-profiles:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-inlet-profiles.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/inlet-profiles.json
          storage: git
      description: >
        Inlet U and k profiles taken from the DNS inlet station itself, plus
        the inlet omega fitted per model destruction coefficient and the
        Langtry-Menter ReThetat from its own correlation. Prescribing the DNS
        inlet is what makes the RANS solve the same problem the DNS solved.
    dns-domain-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-dns-domain.sh {model} 80 79
      iterate_over:
        - arg_name: model
          values:
            - clip-k-gamma
            - k-omega-sst-lm
            - kkl-omega
            - k-omega-sst
            - laminar
      inputs:
        - sim/run-dns-domain.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict-dns.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
        - results/inlet-profiles.json
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
      outputs:
        - sim/cases/{model}-dns-domain/postProcessing
      description: >
        Every model on the domain matched to the DNS, with the measured inlet
        profile. This is the like-for-like comparison: the previous domain
        gave the free stream 127 units of decay the DNS never had, which
        forced a 20 percent inlet turbulence intensity and tripped the
        transition baselines at the leading edge.
    compare-dns-domain:
      kind: python-script
      environment: py-viz
      script_path: scripts/compare-openfoam-dns.py
      args:
        - --cases
        - sim/cases/clip-k-gamma-dns-domain
        - sim/cases/k-omega-sst-lm-dns-domain
        - sim/cases/kkl-omega-dns-domain
        - sim/cases/k-omega-sst-dns-domain
        - sim/cases/laminar-dns-domain
        - --labels
        - clip-k-gamma
        - k-omega-sst-lm
        - kkl-omega
        - k-omega-sst
        - laminar
        - --out-json
        - results/dns-domain-vs-dns.json
        - --out-fig
        - figures/dns-domain-vs-dns.pdf
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - scripts/compare-openfoam-dns.py
        - sim/cases/clip-k-gamma-dns-domain/postProcessing
        - sim/cases/k-omega-sst-lm-dns-domain/postProcessing
        - sim/cases/kkl-omega-dns-domain/postProcessing
        - sim/cases/k-omega-sst-dns-domain/postProcessing
        - sim/cases/laminar-dns-domain/postProcessing
        - pypkg/dns_case.py
      outputs:
        - path: results/dns-domain-vs-dns.json
          storage: git
        - figures/dns-domain-vs-dns.pdf
      description: >
        Score every model against the DNS on the DNS-matched domain. This is
        the comparison that decides whether the closure is an improvement on
        the state of the art.
    plot:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot.py
      inputs:
        - results/energy-flux.json
        - results/pde-term-regression.json
        - results/fit-noise.json
        - results/dns-domain-vs-dns.json
      outputs:
        - figures/dissipation.pdf
        - figures/transfer.pdf
        - figures/collapse.pdf
        - figures/fit-noise.pdf
        - figures/model-comparison.pdf
      description: >
        Figures backing each claim in the paper, drawn from the same results
        files the text quotes so a figure cannot drift from the number beside
        it.
    fit-baseline-freestream:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-baseline-freestream.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/baseline-freestream-bcs.json
          storage: git
      description: >
        Fit inlet k and omega for each baseline model to the same measured DNS
        free-stream decay our own closure was fitted to. Bypass transition is
        driven by the free-stream turbulence, so leaving the baselines at
        arbitrary defaults while ours are tuned would decide the comparison
        before it started.
    baseline-transition-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-baseline-transition.sh {model} 80 500
      iterate_over:
        - arg_name: model
          values:
            - k-omega-sst
            - k-omega-sst-lm
            - kkl-omega
      inputs:
        - sim/run-baseline-transition.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
        - results/baseline-freestream-bcs.json
      outputs:
        - sim/cases/{model}-wall-resolved/postProcessing
      description: >
        State-of-the-art baselines on the same wall-resolved mesh: k-omega SST
        (the standard workhorse), the Langtry-Menter gamma-Re_theta transition
        model, and Walters-Cokljat kkLOmega, whose laminar kinetic energy is
        the closest published relative of our streak reservoir.
    baseline-wall-resolved-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-baseline-wall-resolved.sh {turbulence} 80 500
      iterate_over:
        - arg_name: turbulence
          values: [k-epsilon, laminar]
      inputs:
        - sim/run-baseline-wall-resolved.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
      outputs:
        - sim/cases/{turbulence}-wall-resolved/postProcessing
      description: >
        Baselines on the same wall-resolved mesh as the clipping closure, so
        the DNS comparison is like for like.
    clip-k-gamma-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-clip-k-gamma.sh 80 500
      inputs:
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
        - sim/run-clip-k-gamma.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
      outputs:
        - sim/cases/clip-k-gamma-ny-80/postProcessing
      description: >
        Run the discovered clipping closure in OpenFOAM on a wall-resolved
        mesh (first cell y+ < 1), which the default grading of 8 does not
        provide.
    compare-openfoam-dns:
      kind: python-script
      environment: py-viz
      script_path: scripts/compare-openfoam-dns.py
      args:
        - --cases
        - sim/cases/clip-k-gamma-ny-80
        - sim/cases/k-omega-sst-lm-wall-resolved
        - sim/cases/kkl-omega-wall-resolved
        - sim/cases/k-omega-sst-wall-resolved
        - sim/cases/k-epsilon-wall-resolved
        - sim/cases/laminar-wall-resolved
        - --labels
        - clip-k-gamma
        - k-omega-sst-lm
        - kkl-omega
        - k-omega-sst
        - k-epsilon
        - laminar
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - sim/cases/clip-k-gamma-ny-80/postProcessing
        - sim/cases/k-omega-sst-lm-wall-resolved/postProcessing
        - sim/cases/kkl-omega-wall-resolved/postProcessing
        - sim/cases/k-omega-sst-wall-resolved/postProcessing
        - sim/cases/k-epsilon-wall-resolved/postProcessing
        - sim/cases/laminar-wall-resolved/postProcessing
        - pypkg/dns_case.py
      outputs:
        - path: results/openfoam-vs-dns.json
          storage: git
        - figures/openfoam-vs-dns.pdf
      description: >
        Score the elliptic OpenFOAM solution against the DNS at every sampled
        station. This is the a-posteriori test that counts; the parabolic
        solver is only the screening fidelity.
    make-paper-numbers:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-paper-numbers.py
      inputs:
        - results/energy-flux.json
        - results/pde-term-regression.json
        - results/fit-noise.json
        - results/dns-domain-vs-dns.json
        - results/openfoam-vs-dns.json
        - results/inlet-profiles.json
      outputs:
        - path: results/paper-numbers.json
          storage: git
      description: >
        Select and flatten the leaf values the manuscript quotes out of the
        nested results files. Flattening is needed because json-to-latex
        resolves top-level keys only.
    paper-numbers-to-latex:
      kind: json-to-latex
      environment: _system
      command_name: result
      inputs:
        - results/paper-numbers.json
      outputs:
        - path: paper/generated-numbers.tex
          storage: git
      description: >
        Turn the flat results JSON into a single keyed LaTeX command, so the
        manuscript refers to values as \result[key] and re-running the
        pipeline updates every number in the text automatically.
    findings-to-latex:
      kind: json-to-latex
      environment: _system
      command_name: finding
      inputs:
        - results/findings.json
      outputs:
        - path: paper/generated-findings.tex
          storage: git
      format:
        misalignment_deg_pretransition: "{misalignment_deg_pretransition:.0f}"
        misalignment_deg_turbulent: "{misalignment_deg_turbulent:.0f}"
        coherence_ratio: "{coherence_ratio:.1f}"
        anisotropy_ratio: "{anisotropy_ratio:.1f}"
        total_correlation_ratio: "{total_correlation_ratio:.0f}"
        total_correlation_bits_laminar: "{total_correlation_bits_laminar:.3f}"
        total_correlation_bits_turbulent: "{total_correlation_bits_turbulent:.3f}"
        entropy_min: "{entropy_min:.2f}"
        entropy_min_x: "{entropy_min_x:.0f}"
        peak_turbulent_storage_pct: "{peak_turbulent_storage_fraction * 100:.0f}"
        peak_turbulent_storage_x: "{peak_turbulent_storage_x:.0f}"
        turbulent_rejection_fraction_low_Re: "{turbulent_rejection_fraction_low_Re:.3f}"
        turbulent_rejection_fraction_high_Re: "{turbulent_rejection_fraction_high_Re:.3f}"
        ablation_reference_cf_pct: "{ablation_reference_cf_rel_rms * 100:.1f}"
        ablation_no_clip_cf_pct: "{ablation_no_clip_cf_rel_rms * 100:.0f}"
        ablation_no_liftup_cf_pct: "{ablation_no_liftup_cf_rel_rms * 100:.0f}"
        ablation_classical_threshold_cf_pct: "{ablation_classical_threshold_cf_rel_rms
          * 100:.1f}"
        baseline_k_epsilon_cf_pct: "{baseline_k_epsilon_cf_rel_rms * 100:.0f}"
        fitted_threshold_Lambda_c: "{fitted_threshold_Lambda_c:.0f}"
        screening_solver_cf_error_pct: "{screening_solver_cf_error_max * 100:.1f}"
        mixing_layer_best_normalized: "{mixing_layer_best_normalized:.2f}"
        mixing_layer_launder_sharma_normalized: "{mixing_layer_launder_sharma_normalized:.2f}"
        mixing_layer_clip_k_omega_gamma_dtheta_pct: "{mixing_layer_clip_k_omega_gamma_dtheta_rel_rms
          * 100:.0f}"
        benchmark_launder_sharma_out_of_sample_mean: "{benchmark_launder_sharma_out_of_sample_mean:.2f}"
        benchmark_clip_k_gamma_in_sample_mean: "{benchmark_clip_k_gamma_in_sample_mean:.2f}"
        benchmark_clip_k_gamma_out_of_sample_mean: "{benchmark_clip_k_gamma_out_of_sample_mean:.2f}"
        benchmark_clip_k_gamma_transfer_penalty: "{benchmark_clip_k_gamma_transfer_penalty:.2f}"
        benchmark_clip_k_omega_gamma_in_sample_mean: "{benchmark_clip_k_omega_gamma_in_sample_mean:.2f}"
        benchmark_clip_k_omega_gamma_out_of_sample_mean: "{benchmark_clip_k_omega_gamma_out_of_sample_mean:.2f}"
        benchmark_clip_k_omega_gamma_transfer_penalty: "{benchmark_clip_k_omega_gamma_transfer_penalty:.2f}"
        momentum_library_single_best_objective: "{momentum_library_single_best_objective:.2f}"
        momentum_library_single_base_in_sample: "{baseline_ls_plate:.2f}"
        momentum_library_single_out_of_sample_mean: "{momentum_library_single_out_of_sample_mean:.2f}"
        momentum_library_single_base_out_of_sample_mean: "{momentum_library_single_base_out_of_sample_mean:.2f}"
        momentum_library_single_n_evaluations: "{momentum_library_single_n_evaluations}"
        momentum_library_multi_best_objective: "{momentum_library_multi_best_objective:.2f}"
        momentum_library_multi_n_evaluations: "{momentum_library_multi_n_evaluations}"
        momentum_library_multi_n_diverged: "{momentum_library_multi_n_diverged}"
        tier2_k_omega_sst_lm_out_of_sample_mean: '{tier2_k_omega_sst_lm_out_of_sample_mean:.2f}'
        tier2_k_omega_sst_out_of_sample_mean: '{tier2_k_omega_sst_out_of_sample_mean:.2f}'
        tier2_kkl_omega_out_of_sample_mean: '{tier2_kkl_omega_out_of_sample_mean:.2f}'
        tier2_clip_k_omega_gamma_out_of_sample_mean: '{tier2_clip_k_omega_gamma_out_of_sample_mean:.2f}'
        tier2_laminar_out_of_sample_mean: '{tier2_laminar_out_of_sample_mean:.2f}'
        tier2_launder_sharma_n_diverged: '{tier2_launder_sharma_n_diverged}'
        tier2_clip_k_omega_gamma_duct_mean: '{tier2_clip_k_omega_gamma_duct_mean:.1f}'
        tier2_clip_k_omega_gamma_hill_mean: '{tier2_clip_k_omega_gamma_hill_mean:.1f}'
        tier2_n_cases: '{tier2_n_cases}'
        tier2_laminar_duct_mean: '{tier2_laminar_duct_mean:.1f}'
        tier_cf_bias_geometric_mean: '{tier_cf_bias_geometric_mean:.1f}'
      description: >
        Every headline number from findings.json as a \finding[key] command
        for the paper, rounded here so the manuscript quotes the same
        precision everywhere. Complements paper-numbers-to-latex, which
        carries the numbers selected by make-paper-numbers.
    make-benchmark-tables:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-benchmark-tables.py
      inputs:
        - results/benchmark.json
        - results/benchmark-openfoam.json
        - pypkg/registry.py
        - pypkg/closures.py
        - pypkg/cases
      outputs:
        - path: paper/generated-tables.tex
          storage: git
      description: Write the paper's case, closure and score tables from the registries
        and the two benchmark files, so the manuscript covers every case and closure
        by construction and cannot fall behind the suite.
    build-paper:
      kind: latex
      environment: texlive
      target_path: paper/main.tex
      provenance: true
      inputs:
        - paper/generated-tables.tex
        - paper/generated-findings.tex
        - figures/dissipation.pdf
        - figures/transfer.pdf
        - figures/collapse.pdf
        - figures/fit-noise.pdf
        - figures/model-comparison.pdf
        - paper/generated-numbers.tex
        - paper/main.tex
        - figures/bl-profile-dns.pdf
        - references.bib
      outputs:
        - paper/main.pdf
      description: >
        Build the paper with provenance markers: every injected value, figure
        and question block is colored and linked to its source, and
        paper/main.provenance.json records where each one came from.
    summarize-findings:
      kind: python-script
      environment: py-compute
      script_path: scripts/summarize-findings.py
      inputs:
        - results/closure-search.json
        - results/flow-structure.json
        - results/closure-ablation.json
        - results/clip-k-gamma-coeffs.json
        - results/openfoam-vs-dns.json
        - results/exergy-budget.json
        - results/blasius-validation.json
        - results/closure-evolution.json
        - results/benchmark.json
        - results/momentum-library.json
        - results/momentum-library-multi.json
        - results/benchmark-openfoam.json
        - results/tier-discrepancy.json
      outputs:
        - path: results/findings.json
          storage: git
      description: >
        Aggregate the headline numbers from every other stage into one flat
        file, so the answers recorded against the project questions are backed
        by pipeline output rather than by hand-typed values.
    evolve-model:
      kind: shell-command
      environment: blsim
      command: bash sim/run-evolve-model.sh
      inputs:
        - sim/run-evolve-model.sh
        - data/jhtdb-transitional-bl/all-stats.h5
        - sim/evolve-model.py
        - sim/run.py
        - sim/constant/turbulenceProperties.template
        - sim/newModel/src/ransFromDns/ransFromDns.C
        - sim/newModel/src/ransFromDns/ransFromDns.H
      outputs:
        - path: results/model-evolution.json
          storage: git
        - path: results/model-params.json
          storage: git

references:
  - path: references.bib
    kind: bibtex
    files:
      - path: references/README-transition_bl.pdf
        key: JHTDBDescription
      - path: references/SLWCS_TCFD_Vortex_Part2_2026.pdf
        key: Sansica2026

software:
  - title: OpenFOAM RANS model
    path: sim/newModel
    description: >
      A new RANS model extracted from the DNS results, written in the

      OpenFOAM framework.
    repo_url: # TODO: Define this so it can be reused?

notebooks:
  - path: notebooks/main.ipynb
    stage: run-notebook
    title: Main
    description: >
      This is the main notebook used to explore the data, develop scripts,

      etc.
