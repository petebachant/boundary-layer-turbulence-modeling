          pu: plate_unnormalized
          pr: plate_rev_normalized
          mn: mean_norm
          mu: mean_unnormalized
          mr: mean_rev
          wins: n_wins
          wi: n_wins_vs_inlet_scaled
          n075: cases.wu-bypass-tu075.norm_normalized
          i075: cases.wu-bypass-tu075.inlet_scaled_normalized
          n225: cases.wu-bypass-tu225.norm_normalized
