questions:
  - Can we add some new terms to the steady RANS equations to make the mean
    flow match DNS data?
  - Can we model what happens at a finer scale (Reynolds stress) as a function
    of what happens at a coarser scale (the mean flow?)

datasets:
  # This is an imported dataset, and currently it's virtual since it doesn't
  # actually exist in the system
  - path: data/jhtdb-transitional-bl/raw
    imported_from: jhtdb/transitional-boundary-layer-dns/data
  - path: data/jhtdb-transitional-bl/time-ave-profiles.h5
    title: Time-averaged data
    description: Time-averaged data downloaded from the JHTDB website.
  # This dataset is an output of a stage in the DVC pipeline
  # We will need to DVC pull it to read
  # Could we just detect this automatically, or is the point to register it in
  # the database so it is declared as a dataset, which could be reused?
  - path: data/jhtdb-transitional-bl/all-stats.h5
    title: All stats
    description: Stats computed at many points in the flow over all time.
    derived_from:
      - jhtdb/transitional-boundary-layer-dns/data
    tabular: true
    stage: extract-jhtdb-stats
  - path: data/jiminez
    imported_from: jiminez/boundary-layer-dns
  - path: sim/results/time-ave-profile.csv
    title: Boundary layer computed with RANS
    stage: run-rans-sim
  - path: results/coeffs.json
    title: Derived coefficients
    description: These coefficients are those for the new RANS terms.
    stage: compute-coeffs
  - path: results/model-evolution.json
    title: Turbulence model evolution history
    description: Iteration history while evolving RANS model coefficients.
    stage: evolve-model
  - path: results/model-params.json
    title: Best-fit turbulence model coefficients
    description: Best coefficients discovered for the ransFromDns model.
    stage: evolve-model
  - path: sim/postProcessing
    title: Mean profiles from RANS simulation
    stage: sample-rans-sim
  - path: results/blasius-validation.json
    title: Screening solver validation
    description: >
      Parabolic solver skin friction against the Blasius similarity solution.
    stage: validate-bl-solver
  - path: results/closure-search.json
    title: Closure structural search results
    description: >
      Ranked structural variants of the clipping closure with their best-fit
      coefficients and errors against the DNS, plus laminar and k-epsilon
      baselines for reference.
    stage: discover-closure
  - path: results/closure-params.json
    title: Best discovered closure
    description: The winning closure structure and its fitted coefficients.
    stage: discover-closure
  - path: results/openfoam-vs-dns.json
    title: OpenFOAM versus DNS errors
    description: Per-station velocity and pressure errors for each OpenFOAM case.
    stage: compare-openfoam-dns
  - path: results/clip-k-gamma-coeffs.json
    title: OpenFOAM closure coefficients
    description: >
      Coefficients for the transported-omega form of the closure, named as
      the OpenFOAM turbulenceProperties dictionary expects them.
    stage: fit-openfoam-coeffs
  - path: results/closure-evolution.json
    title: Evolved closure structures
    description: >
      Archive of every PDE structure tried by the evolutionary search, with a
      Pareto front of error against number of terms.
    stage: evolve-closure

figures:
  - path: figures/bl-profile-dns.pdf
    title: The boundary layer profile from DNS data
    description: The mean boundary layer profile computed from the DNS data.
    stage: plot-bl-dns
    data:
      - data/jhtdb-transitional-bl/all-stats.h5
  - path: figures/rans-mesh-snapshot-isometric.png
    title: RANS simulation mesh snapshot
    description: A snapshot of the RANS simulation mesh.
    stage: save-mesh-snapshot-isometric
  - path: figures/openfoam-vs-dns.pdf
    title: OpenFOAM profiles against DNS
    description: >
      Velocity profiles from the elliptic OpenFOAM solution compared with the
      DNS across the laminar, transitional and turbulent regions.
    stage: compare-openfoam-dns
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
  - path: figures/closure-comparison.pdf
    title: Closure comparison against DNS
    description: >
      Skin friction and shape factor over the whole plate for the laminar,
      k-epsilon and clipping k-gamma closures, with the activation field.
    stage: plot-closure-comparison
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
publications:
  - path: paper/paper.pdf
    title: Deriving a new RANS model from DNS data
    description: The primary publication from this project.
    stage: build-paper
    kind: journal-article

environments:
  main-python:
    kind: conda
    path: environment.yml
    stage: check-conda-env
  blsim:
    kind: docker
    path: sim/Dockerfile
    image: blsim
    wdir: /sim
    description: OpenFOAM v2406 with foamPy and a custom solver.
    deps:
      - sim/newModel
  texlive:
    kind: docker
    image: texlive/texlive:latest-full

pipeline:
  stages:
    extract-jhtdb-stats:
      kind: shell-command
      environment: main-python
      command: python scripts/setup-dns.py
      inputs:
        - scripts/setup-dns.py
        - py_package/jhtdb.py
        - environment.yml
      outputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      description: >
        Download statistics at various points in the flowfield. Note that this
        has already been run with make_stats(), so we don't rerun it here to
        avoid this expensive step, which requires an access token for the JHTDB.
        The setup-dns.py script checks if data already exists before downloading.
    compute-coeffs:
      kind: shell-command
      environment: _system
      command: mkdir -p results && echo "{}" > results/coeffs.json
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - results/coeffs.json
    mesh-independence:
      kind: shell-command
      environment: blsim
      command: bash sim/run-mesh-independence.sh {ny} {turbulence}
      iterate_over:
        - arg_name: ny
          values: [15, 20, 30, 40, 60]
        - arg_name: turbulence
          values: [k-epsilon]
      inputs:
        - sim/run-mesh-independence.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/Dockerfile
      outputs:
        - sim/cases/{turbulence}-ny-{ny}/postProcessing
    laminar-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-laminar.sh
      inputs:
        - sim/run-laminar.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/laminar-ny-40/postProcessing
    save-mesh-snapshot-isometric:
      kind: shell-command
      environment: _system
      command: bash scripts/save-mesh-snapshot.sh
      inputs:
        - sim/cases/k-epsilon-ny-40/constant/polyMesh
        - scripts/save-mesh-snapshot.sh
      outputs:
        - figures/rans-mesh-snapshot-isometric.png
    run-notebook:
      kind: jupyter-notebook
      environment: main-python
      notebook_path: notebook.ipynb
      executed_ipynb_storage: dvc
      html_storage: dvc
      inputs:
        - sim/cases/k-epsilon-ny-15/postProcessing
        - sim/cases/k-epsilon-ny-20/postProcessing
        - sim/cases/k-epsilon-ny-30/postProcessing
        - sim/cases/k-epsilon-ny-40/postProcessing
        - sim/cases/k-epsilon-ny-60/postProcessing
        - sim/cases/laminar-ny-40/postProcessing
    plot-bl-dns:
      kind: python-script
      environment: main-python
      script_path: scripts/plot-bl-dns.py
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - figures/bl-profile-dns.pdf
    build-paper:
      kind: latex
      environment: texlive
      target_path: paper/paper.tex
      inputs:
        - paper/paper.tex
        - figures/bl-profile-dns.pdf
        - references.bib
      outputs:
        - paper/paper.pdf
    validate-bl-solver:
      kind: python-script
      environment: main-python
      script_path: scripts/validate-bl-solver.py
      inputs:
        - py_package/bl_solver.py
        - py_package/closures.py
      outputs:
        - results/blasius-validation.json
      description: >
        Check the parabolic screening solver against the Blasius similarity
        solution, so its discretisation error is known to be smaller than the
        model differences it is used to judge.
    discover-closure:
      kind: python-script
      environment: main-python
      script_path: scripts/discover-closure.py
      args:
        - --n-random
        - "300"
        - --n-refine
        - "150"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
        - py_package/search.py
      outputs:
        - results/closure-search.json
        - results/closure-params.json
      description: >
        Search structural variants of the clipping closure and fit each one's
        coefficients against the DNS using the fast parabolic solver. This is
        the cheap screening fidelity; promising models are then run in
        OpenFOAM.
    evolve-closure:
      kind: python-script
      environment: main-python
      script_path: scripts/evolve-closure.py
      args:
        - --generations
        - "6"
        - --population
        - "14"
        - --x-stride
        - "12"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
        - py_package/grammar.py
        - py_package/evolve.py
      outputs:
        - results/closure-evolution.json
      description: >
        Evolve the structure of the activation source term, varying which
        operators and derived quantities appear rather than only the
        coefficients on a fixed set of terms. Reports a Pareto front of error
        against term count.
    fit-openfoam-coeffs:
      kind: python-script
      environment: main-python
      script_path: scripts/fit-openfoam-coeffs.py
      args:
        - --n-random
        - "500"
        - --n-refine
        - "250"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
        - py_package/search.py
      outputs:
        - results/clip-k-gamma-coeffs.json
      description: >
        Fit the transported-omega form of the closure, which is what the
        OpenFOAM model implements. Coefficients fitted for the mixing-length
        form are not transferable to it.
    plot-closure-comparison:
      kind: python-script
      environment: main-python
      script_path: scripts/plot-closure-comparison.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/closure-params.json
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
      outputs:
        - figures/closure-comparison.pdf
    clip-k-gamma-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-clip-k-gamma.sh 80 500
      inputs:
        - results/clip-k-gamma-coeffs.json
        - sim/run-clip-k-gamma.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
        - sim/newModel/src/clipKGamma
        - sim/Dockerfile
      outputs:
        - sim/cases/clip-k-gamma-ny-80/postProcessing
      description: >
        Run the discovered clipping closure in OpenFOAM on a wall-resolved
        mesh (first cell y+ < 1), which the default grading of 8 does not
        provide.
    compare-openfoam-dns:
      kind: python-script
      environment: main-python
      script_path: scripts/compare-openfoam-dns.py
      args:
        - --cases
        - sim/cases/clip-k-gamma-ny-80
        - --labels
        - clip-k-gamma
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - sim/cases/clip-k-gamma-ny-80/postProcessing
        - py_package/dns_case.py
      outputs:
        - results/openfoam-vs-dns.json
        - figures/openfoam-vs-dns.pdf
      description: >
        Score the elliptic OpenFOAM solution against the DNS at every sampled
        station. This is the a-posteriori test that counts; the parabolic
        solver is only the screening fidelity.
    evolve-model:
      kind: shell-command
      environment: blsim
      command: bash sim/run-evolve-model.sh
      inputs:
        - sim/run-evolve-model.sh
        - data/jhtdb-transitional-bl/all-stats.h5
        - sim/evolve-model.py
        - sim/run.py
        - sim/constant/turbulenceProperties.template
        - sim/newModel/src/ransFromDns/ransFromDns.C
        - sim/newModel/src/ransFromDns/ransFromDns.H
      outputs:
        - results/model-evolution.json
        - results/model-params.json

references:
  - path: references.bib
    kind: bibtex
    files:
      - path: references/README-transition_bl.pdf
        key: JHTDBDescription

software:
  - title: OpenFOAM RANS model
    path: sim/newModel
    description: |
      A new RANS model extracted from the DNS results, written in the
      OpenFOAM framework.
    repo_url: # TODO: Define this so it can be reused?

notebooks:
  - path: notebook.ipynb
    stage: run-notebook
    title: Main
    description: |
      This is the main notebook used to explore the data, develop scripts,
      etc.
