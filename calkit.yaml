        path: results/streak-threshold.json
        values:
          passes: passes
          ms: mean_streak
          mr: mean_rev
          wins: n_wins
          uw: unseen_wins
          serr: streak_mean_error
          ps: plate_streak_normalized
          pr: plate_rev_normalized
          thr: amp_threshold
          scaled: inlet_scaled_mean
      - kind: result
