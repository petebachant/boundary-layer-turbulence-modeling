        apparently in the inlet intensity. Fitted on Wu et al.'s DNS as
        $\Lambda_c = {A:.0f}\, Tu^{{-{m:.2f}}}$, the law in the local intensity at
        onset predicts {law:.0f} for the plate, which reaches only
        {actual:.0f}: the plate transitions at a local intensity of
        {tu_local:.2f} percent, where Wu et al.'s flows would not. In the
        intensity at the inlet instead, an exploratory fit defined after that
        failure predicts {law_in:.0f}, within {err_in:.0%}. Onset appears to
        depend on how long the streaks have been forced, not on the
        free-stream intensity where they break down, which is the history
