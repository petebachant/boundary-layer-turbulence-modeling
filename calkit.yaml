  - question: >-
      Does dividing the streak amplitude by $Re_{v,\max}$, to take out the
      distance the streaks have grown over, recover the plate without losing
      the transfer?
    hypothesis: >-
      Yes. Lift-up grows streaks like $Tu\, Re_x^{{1/2}}$ and $Re_{{v,\max}}$ grows like
      $Re_x^{{1/2}}$, so $A / Re_{{v,\max}}$ measures the free stream's intensity.
      Scaling the $Re_v$ threshold by it beats the fixed threshold on the mean
      over Wu et al.'s five flows and on at least three, and beats the
      unnormalized streak scaling both on the plate and on that mean.
    answer:
      if passes: >-
        On the pre-set measures, yes, but it moves the gains rather than
        adding to them. The plate recovers to {pn:.2f} (unnormalized
        {pu:.2f}, calibrated {pr:.2f}), and the mean over the five flows
        falls to {mn:.2f} (unnormalized {mu:.2f}, fixed {mr:.2f}), winning
        {wins} of five against the fixed threshold and {wi} against the
        inlet-scaled one, at 0.75 percent ({n075:.2f} against {i075:.2f}).
        But on the three flows whose streaks were not fitted it scores
        {un:.2f}, against {uu:.2f} unnormalized and {ur:.2f} fixed: the
        normalization helps the lowest intensity, whose streaks it was fitted
        on, and costs the 2.25 percent flow ({n225:.2f}). Neither streak
        scaling is uniformly better. Both recover much of what the inlet
        intensity was worth on the mean over the five flows; only the
        unnormalized one does so on the flows it never saw.
      else: >-
        No. The plate scores {pn:.2f} against {pu:.2f} unnormalized, and the
        mean over the five flows {mn:.2f} against {mu:.2f}.
    notes: >-
      In the DNS, the peak $\sqrt k$ over $Re_\theta$ per unit inlet intensity
      stays within about 6-10 $\times 10^{{-3}}$ across Wu et al.'s flows and stations
      before onset, where the amplitude alone varies more than fivefold,
      which motivated the normalization; the JHTDB plate sits at 11-14 and
      drifts down as its free stream decays. $Re_{{v,\max}}$ is about 2.19
      $Re_\theta$ in a Blasius layer.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds, though the plate's recovery
      is now small.
    evidence:
      - kind: result
        path: results/streak-norm-threshold.json
        values:
          passes: passes
