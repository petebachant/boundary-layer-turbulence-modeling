  - question: >-
      With the streaks carried as their own energy beside the calibrated
      turbulence, does a transition threshold on streak amplitude predict
      bypass transition across free-stream intensity?
    hypothesis: >-
      Yes. Keeping the turbulence as calibrated and carrying the forcing and
      the streaks as two more energies removes the conflict in $C_d$, so a
      threshold on the streaks' amplitude, calibrated on the JHTDB plate
      with the activation rate, beats the clipping closure's $Re_v$ threshold
      on the mean score over Wu et al.'s five flows and on at least three
      of them.
    answer:
      if passes: >-
        As tested, yes, but not for the reason it should. The split closure
        fits the three flows' pre-onset streaks to a mean error of
        {serr:.3f} and scores a mean of {ms:.2f} on Wu et al.'s flows against
        {mr:.2f} with $Re_v$, winning {wins} of five. The mean is carried by
        the two lowest intensities, where $Re_v$ fails worst ({r075:.1f} and
        {r150:.1f}, against {s075:.2f} and {s150:.2f}), and those are the
        flows whose streaks were in the fit. On the three it never saw it
        scores {us:.2f} against {ur:.2f}, winning {uw}. And it costs the
        plate: {ps:.2f} against {pr:.2f} at the best of its thresholds and
        activation rates. The streak amplitude carries the free stream's
        intensity, but as the trigger itself it places transition poorly.
      else: >-
        No. It scores a mean of {ms:.2f} on Wu et al.'s flows against
        {mr:.2f} with $Re_v$, winning {wins} of five, and {ps:.2f} on the
        plate against {pr:.2f}.
    notes: >-
      SplitStreakKOmegaGamma. The first run of the stage was invalid: the
      closure took param="Rev" from the calibrated coefficients, so its
      threshold was a $Re_v$ threshold of order 0.1 and every flow turned
      turbulent at its inlet. That was fixed before the recorded run.
      Checking the plate in between showed that no activation rate brings
      an amplitude trigger near the calibrated plate score; the scan was
      left as registered.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
