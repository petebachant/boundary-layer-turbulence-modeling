  - question: >-
      Does the free-stream length scale explain why streak growth fitted on
      one bypass-transition flow does not carry to the others?
    hypothesis: >-
      It could. Bypass onset depends on the free-stream integral length
      scale as well as the intensity, so if the plate and Wu et al.'s flows
      differ in length scale in the direction that makes the plate's streaks
      grow faster, that would explain the mismatch.
    answer: >-
      Not as measured. The flows do differ: at the start of each domain the
      free-stream dissipation length scale is {wmin:.0f} to {wmax:.0f} inlet
      momentum thicknesses in Wu et al.'s flows and {j0:.0f} on the plate. But
      the plate needs the faster streak growth despite having the smaller
      eddies, and larger scales are the ones that bring transition forward.
      Against $\delta_{{99}}$ at onset, the plate ({jon:.2f}) and the two Wu et al.
      flows with profiles before onset ({w075:.2f} and {w150:.2f}) are comparable.
    notes: >-
      $\varepsilon = -U\, dk/dx$ from a power-law fit to each free stream's decay, so
      $L = \sqrt k / (-d \ln k / dx)$ depends only on the local decay rate. Wu et
      al.'s k is $1.5\, u_\mathrm{{rms}}^2$, and their $v_\mathrm{{rms}}$ and $w_\mathrm{{rms}}$ are within about 10
      percent of $u_\mathrm{{rms}}$ a few $\delta_{{99}}$ above the layer, so the isotropy
      holds. The dissipation scale is a proxy for the integral scale, not the
      integral scale itself. Larger integral scales bring bypass transition
      forward at a fixed intensity (BrandtSchlatterHenningson2004). The plate's free
      stream also decays faster before onset than Wu et al.'s, so the
      forcing histories differ, which is the next thing to check.
