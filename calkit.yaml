      - kind: result
        path: results/wu-openfoam.json
        values:
          lm: mean.k-omega-sst-lm
          kkl: mean.kkl-omega
          sst: mean.k-omega-sst
          clip: mean.clip-k-gamma
          lm075: cases.wu-bypass-tu075.k-omega-sst-lm.normalized
          lm600: cases.wu-bypass-tu600.k-omega-sst-lm.normalized
          lm150: cases.wu-bypass-tu150.k-omega-sst-lm.normalized
          clip075: cases.wu-bypass-tu075.clip-k-gamma.normalized
      - kind: result
