      - kind: result
        path: results/freestream-length-scale.json
        values:
          wmin: wu_L_over_theta0_start_min
          wmax: wu_L_over_theta0_start_max
          j0: jhtdb_L_over_theta0_start
          jon: jhtdb_L_over_delta99_onset
          w075: wu.WM075.onset.L_over_delta99
          w150: wu.WM150.onset.L_over_delta99
  - question: >-
      Is the streak amplitude at bypass onset the one at which streaks are
      known to break down?
    hypothesis: >-
      Yes. If onset is streaks crossing a fixed threshold, the DNS's peak
      $u_\mathrm{{rms}}$ at onset matches the averaged streak amplitude measured before
      breakdown in experiments under grid turbulence, and sits below the
      critical amplitude of a single idealized streak, since averages
      include the weaker streaks alongside the ones that break down.
    answer:
      if universal: >-
        Yes. The DNS's peak $u_\mathrm{{rms}}$ at onset is {amin:.3f} to {amax:.3f} of
        the free-stream speed across Wu et al.'s intensities, and {jhtdb:.3f}
        on the JHTDB plate: the 11-12 percent Matsubara and Alfredsson
        measured before breakdown under grid turbulence. That is below the
        critical amplitude of about 26 percent that Andersson et al. found
        for the sinuous instability of a single optimal streak, as it should
        be for an average over a population of streaks, only the strongest
        of which break down. Three independent sources, two DNS and one
        experiment, put the threshold in the same place.
      else: >-
        Across Wu et al.'s intensities the peak $u_\mathrm{{rms}}$ at onset is not one
        value ({amin:.3f} to {amax:.3f}), so there is no single amplitude to
        compare.
    notes: >-
      The experimental 11-12 percent is quoted by Brandt and Henningson
      (BrandtHenningson2002) from MatsubaraAlfredsson2001. Andersson2001's
      amplitude is, as far as can be checked from secondary sources, half
      the peak-to-peak spread of U - U_Blasius over the cross-plane, so a
      single sinusoidal streak at the critical amplitude would have a $u_\mathrm{{rms}}$
      near 0.18; averaged values mask the stronger local distortions that
      break down (BrandtHenningson2002).
    evidence:
      - kind: result
        path: results/streak-headroom.json
        values:
          universal: universal
          amin: u_rms_peak_onset_min
          amax: u_rms_peak_onset_max
          jhtdb: jhtdb_u_rms_peak_onset
  - question: >-
      Does free-stream turbulence force streaks and trigger their breakdown
      through different scales, so that a closure needs to carry both?
    hypothesis: >-
      Yes. Low-frequency free-stream eddies penetrate the layer and force
      streaks by lift-up, while high-frequency eddies are sheltered at its
      edge and trigger the secondary instability of the lifted streaks
      (JacobsDurbin2001, ZakiDurbin2005). Flows whose free streams divide
      their energy differently between the two would then need different
      forcing per unit $k_\infty$, as the plate and Wu et al.'s flows do.
    notes: >-
      Open. Testing it needs free-stream spectra: the JHTDB plate's can be
      sampled like its spanwise lines; Wu et al. publish only single-point
      statistics.
  - question: >-
      Does carrying the lift-up forcing as a transported roll energy, a
      second component, let streak growth carry from one flow to another?
    hypothesis: >-
      Yes. Lift-up is a non-normal coupling of two components, so a closure
      that transports the forcing motions separately from the streaks, with
      no feedback from streaks to forcing, feels the free stream upstream
      of a station rather than the one overhead. Leaving each of the three
      flows with DNS streaks before onset out in turn, its mean held-out
      error in the peak $\sqrt k$ is below that of lift-up forced by the local
      $k_\infty$, and below 0.25.
    answer:
      if passes: >-
        Yes, narrowly. Held out, the two-component closure's error is
        {t_p:.3f} on the plate, {t_1:.3f} on Wu et al.'s 0.75 percent flow
        and {t_2:.3f} on the 1.5 percent one, a mean of {t_m:.3f} against
        {o_m:.3f} for the one-component closure ({o_p:.3f}, {o_1:.3f} and
        {o_2:.3f}). Fitted to all three together its mean error is {t_j:.3f} against {o_j:.3f}. But the
        coefficients are not pinned down: across the folds $C_f$ runs from
        {cf_a:g} to {cf_b:g}, $C_d$ from {cd_a:g} to {cd_b:g} and $C_b$ from
        {cb_a:g} to {cb_b:g}, and $C_v$ comes out at {cv:g}, the top of its
        grid, in the plate's fold. Three flows are few, and they support
        the structure more than any one set of numbers.
      else: >-
        No. Held out, the two-component closure's mean error is {t_m:.3f}
        against {o_m:.3f} for the one-component closure, though fitted to all
        three flows together it does better, {t_j:.3f} against {o_j:.3f}: the
        extra component fits more and transfers no better, so carrying the
        forcing as its own energy does not by itself make streak growth carry
        between flows.
    notes: >-
      StreakKOmegaGamma in pypkg/closures.py; transition and the closure's
      own lift-up are off in both closures, so only laminar streaks are
      compared. Four coefficients against two, but every number here is
      held out, so the extra freedom does not buy the result by itself.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds.
      Re-read on 2026-10-08: the cited values changed only in their last digits,
      and the claim holds.
    evidence:
      - kind: result
        path: results/two-component-streaks.json
        values:
          passes: passes
          t_m: two_mean_held_out
          o_m: one_mean_held_out
          t_j: two_joint_mean
          o_j: one_joint_mean
          t_p: two_component.folds.jhtdb-transitional-bl.held_out_error
          t_1: two_component.folds.wu-bypass-tu075.held_out_error
          t_2: two_component.folds.wu-bypass-tu150.held_out_error
          o_p: one_component.folds.jhtdb-transitional-bl.held_out_error
          o_1: one_component.folds.wu-bypass-tu075.held_out_error
          o_2: one_component.folds.wu-bypass-tu150.held_out_error
          cf_a: two_component.folds.jhtdb-transitional-bl.coeffs.Cf
          cf_b: two_component.folds.wu-bypass-tu150.coeffs.Cf
          cd_a: two_component.folds.wu-bypass-tu075.coeffs.Cd
