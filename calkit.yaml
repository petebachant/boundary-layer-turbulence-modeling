          cb_b: two_component.folds.wu-bypass-tu150.coeffs.Cb
          cv: two_component.folds.jhtdb-transitional-bl.coeffs.Cv
  - question: >-
      With the two-component streak closure underneath, does a transition
      threshold on streak amplitude predict bypass transition across
      free-stream intensity without being told the inlet?
    hypothesis: >-
      Yes. Onset happens near one streak amplitude, and this closure's
      streaks grow with intensity and distance, so an amplitude threshold
      calibrated on the JHTDB plate beats the clipping closure's $Re_v$
      threshold on the mean score over Wu et al.'s five flows and on at
      least three of them.
    answer:
      if passes: >-
        Yes. It scores a mean of {ms:.2f} on Wu et al.'s flows against
        {mr:.2f} with $Re_v$, winning {wins} of five.
      else: >-
        No, and not because of the threshold. The streak coefficients fit
        the three flows' pre-onset streaks to a mean error of {serr:.3f},
        but with transition on the closure scores {ps:.2f} on the plate at
        its best threshold, against {pr:.2f} for the clipping closure, and
        a mean of {ms:.2f} on Wu et al.'s flows against {mr:.2f}, winning
        {wins} of five and {uw} of the three it never saw. The plate's best
        threshold, {thr:.3f}, sits where transition barely happens. Stepping
        from the calibrated closure to the streak coefficients with the
        $Re_v$ threshold held fixed finds the cause: the plate scores
        {d_cal:.2f} as calibrated, {d_str:.2f} with the streak coefficients,
        and {d_fix:.2f} with those coefficients but $C_d$ back at its
        calibrated {cd_cal:.0f} instead of {cd_str:.0f}. $C_d$ suppresses
        dissipation where the flow has not activated. The streaks need it
        large, energy that barely dissipates, and the turbulent layer needs
        it small. One k cannot be both the streaks and the turbulence: they
        are two reservoirs, and the closure needs them as two variables, as
        the laminar and turbulent energies of kkL-omega are. For scale, the
        $Re_v$ threshold scaled with each flow's inlet intensity, which is told
        the inlet, scores a mean of {scaled:.2f}.
    notes: >-
      The inlet-scaled figure is copied by the stage from
      results/threshold-closure.json. Two of Wu et al.'s five flows had
      their pre-onset streaks in the streak fit; the other three are unseen.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds, though $C_d$ at its
      calibrated value now recovers most of the plate's score rather than
      nearly all of it.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
