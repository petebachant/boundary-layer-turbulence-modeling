        {prev:.2f}.
      else: >-
        No, and not because the threshold is wrong: the closure's streaks
        do not grow. Calibrated on the plate, the threshold lands at
        {a:.4f}, just under the largest amplitude the closure ever reaches
        there, {platemax:.4f}, so it fires only by grazing it, scoring
