# Answers are claims about pipeline outputs. Numbers in them are
# {placeholders} filled from `value` evidence when the questions are shown
# (`calkit list questions`), never retyped; values from one file are named
# together in a `result` entry's `values`. `calkit check questions` flags an
# answer whose evidence changed after the commit that last edited it, and
# editing the question after re-reading it is how to say it still holds.
# Evidence is only what an answer rests on. Reasoning lives in
# the paper, pointed at by `publication` evidence; dead ends are in
# docs/ideas-log.md and docs/clipping-closure.md.
questions:
  - question: >-
      Can new terms in the steady RANS equations make the mean flow match the
      DNS?
    hypothesis: >-
      A threshold, not extra smooth terms, is needed, because no k-epsilon
      coefficient set makes the laminar state a fixed point of the model.
    answer: >-
      Yes. A transported activation fraction with a rectified (clipping)
      source added to k-omega cuts the mean-velocity error against the DNS by
      {improvement:.1f}x relative to k-epsilon, in the elliptic OpenFOAM
      solver on a wall-resolved mesh.
    evidence:
      - kind: value
        path: results/findings.json
        key: openfoam_improvement_over_k_epsilon
        name: improvement
      - kind: result
        path: results/openfoam-vs-dns.json
      - kind: figure
        path: figures/openfoam-vs-dns.pdf
      - kind: publication
        path: paper/main.pdf
        section: Case setup sensitivity
        label: sec:bench
  - question: Can the Reynolds stress be modeled as a function of the mean flow?
    hypothesis: >-
      A scalar eddy viscosity relating the Reynolds stress to the mean strain
      is sufficient.
    answer: >-
      Only partly, and we can say where it fails. The eigenframes of the
      stress anisotropy and the mean strain are misaligned by
      {misalignment_pre:.0f} degrees before transition and still by
      {misalignment_turb:.0f} degrees in equilibrium turbulence, so an eddy
      viscosity is structurally wrong before transition and imperfect
      everywhere. That bounds any eddy-viscosity closure, ours included.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          misalignment_pre: misalignment_deg_pretransition
          misalignment_turb: misalignment_deg_turbulent
  - question: >-
      Is the clipping analogy - a flow holding more energy than smooth waves
      can carry, so it clips and redistributes into higher harmonics -
      load-bearing, or decorative?
    hypothesis: Decorative; the model works because of its other terms.
    answer: >-
      Load-bearing, so the hypothesis is refuted. Removing the rectifier
      raises the skin-friction error from {cf_reference:.1%} to
      {cf_no_clip:.0%}, worse than k-epsilon's {cf_k_epsilon:.0%}. The lift-up
      term is load-bearing too, at {cf_no_liftup:.0%} without it, while the
      streak viscous-decay term and the gate on omega production change the
      total score by {delta_no_decay:.3f} and {delta_ungated:.3f} and can be
      deleted outright.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          cf_reference: ablation_reference_cf_rel_rms
          cf_no_clip: ablation_no_clip_cf_rel_rms
          cf_k_epsilon: baseline_k_epsilon_cf_rel_rms
          cf_no_liftup: ablation_no_liftup_cf_rel_rms
          delta_no_decay: ablation_no_streak_decay_delta
          delta_ungated: ablation_ungated_omega_delta
  - question: Which local quantity should carry the transition threshold?
    answer: >-
      The vorticity Reynolds number Re_v = y^2 Omega / nu. Every Re_v variant
      beats every other driver tested, and the best structure is
      {best_structure}. The fitted threshold is {Lambda_c:.0f} against the
      classical value of 440, but the model is sensitive to it - using 440
      itself raises the skin-friction error from {cf_reference:.1%} to
      {cf_classical:.1%} - and the fit wanders within search noise, so the
      constant is not settled.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          best_structure: best_structure
          Lambda_c: fitted_threshold_Lambda_c
          cf_reference: ablation_reference_cf_rel_rms
          cf_classical: ablation_classical_threshold_cf_rel_rms
      - kind: result
        path: results/closure-search.json
        explanation: The ranking of every driver and structure tried.
      - kind: result
        path: results/fit-noise.json
        explanation: How far the fitted constants move between repeated fits.
      - kind: publication
        path: paper/main.pdf
        section: What does not transfer
        label: sec:fails
  - question: >-
      Does transition redistribute energy between velocity components, or
      create correlation between them?
    hypothesis: >-
      Transition redistributes energy from the streamwise into the wall-normal
      and spanwise components.
    answer: >-
      Correlation, not redistribution. Through transition the u-v correlation
      coefficient grows {coherence:.1f}x while the energy partition changes by
      only {anisotropy:.1f}x; equivalently, the information shared between
      velocity components grows {total_correlation:.0f}x.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          coherence: coherence_ratio
          anisotropy: anisotropy_ratio
          total_correlation: total_correlation_ratio
  - question: Can entropy alone serve as the closure variable?
    hypothesis: >-
      Transition can be modeled as entropy production in the fluctuation
      field, so a transported entropy would close the system.
    answer: >-
      No. The component entropy is non-monotone through transition, falling to
      {entropy_min:.2f} at x = {entropy_min_x:.0f} before recovering, so the
      constitutive relation is hysteretic rather than single-valued.
      Implemented as a closure it scores {entropy_closure_score:.1f} on the
      calibration case against {clip_closure_score:.2f} for the clipping
      closure, because a smooth relaxation balance cannot hold the laminar
      state. Entropy is a good diagnostic and a poor substitute for the
      threshold.
    evidence:
      - kind: value
        path: results/findings.json
        key: entropy_min
      - kind: value
        path: results/findings.json
        key: entropy_min_x
      - kind: value
        path: results/benchmark.json
        key: results.jhtdb-transitional-bl.entropy-k-omega-h.normalized
        name: entropy_closure_score
      - kind: value
        path: results/benchmark.json
        key: results.jhtdb-transitional-bl.clip-k-omega-gamma.normalized
        name: clip_closure_score
      - kind: result
        path: results/flow-structure.json
  - question: >-
      If entropy cannot be rejected as fast as the wall injects exergy, is the
      excess stored in the turbulence?
    hypothesis: >-
      Turbulence buffers exergy injection against entropy rejection, and the
      buffering matters most where the two are most out of balance.
    answer: >-
      Yes, as a transient of transition rather than a standing inventory.
      Storage peaks at {peak_storage:.0%} of the energy routed into turbulence
      at x = {peak_storage_x:.0f}, then collapses to a few percent. The
      turbulent share of entropy rejection rises from {rejection_low:.3f} to
      {rejection_high:.3f} with Reynolds number.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          peak_storage: peak_turbulent_storage_fraction
          peak_storage_x: peak_turbulent_storage_x
          rejection_low: turbulent_rejection_fraction_low_Re
          rejection_high: turbulent_rejection_fraction_high_Re
      - kind: result
        path: results/exergy-budget.json
        explanation: The storage profile along the plate, for the collapse.
      - kind: publication
        path: paper/main.pdf
        section: What transfers
        label: sec:transfers
  - question: >-
      Can a search discover the closure structure rather than have us impose
      it?
    answer: >-
      Not yet. The evolutionary search does not reproduce from run to run:
      how many of its top eight structures use the rectifier (now
      {n_rectifier}) has changed between runs with the same inputs, so the
      {n_evaluated} structures evaluated are evidence of nothing either way
      until the search is reproducible and properly powered.
    notes: >-
      Rerunning the stage at 22726cd, where the only change to its inputs was
      to comments, moved both the rectifier count and the best total score
      from their values at b293ba4. An earlier answer, that all eight used the
      rectifier, was falsified the same way. The non-reproducibility is
      roadmap.md section 4, the highest-priority bug.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          n_rectifier: evolved_top8_using_rectifier
          n_evaluated: evolved_structures_evaluated
      - kind: result
        path: results/closure-evolution.json
        explanation: The archive of evaluated structures from the latest run.
  - question: >-
      Is the parabolic screening solver accurate enough to rank closures
      against each other?
    answer: >-
      Yes. It reproduces the Blasius skin friction to within
      {cf_error_max:.1%}, well below the differences between the models it
      ranks, and the bias is systematic so comparisons stay fair.
    evidence:
      - kind: value
        path: results/findings.json
        key: screening_solver_cf_error_max
        name: cf_error_max
      - kind: result
        path: results/blasius-validation.json
      - kind: publication
        path: paper/main.pdf
        section: Closures tested and simulation setup
        label: sec:method
  - question: Does the closure survive a flow with no wall?
    hypothesis: >-
      A closure whose length scale and transition gate are built from wall
      distance produces nothing in a free shear layer; the transported-omega
      variant, whose length scale is k/omega, does not need the wall.
    answer: >-
      Confirmed, and it splits the closure family. On the temporally evolving
      mixing layer of Lusher et al. (2026), the three mixing-length clip
      closures are indistinguishable from laminar, because their van Driest
      damping is keyed to a wall shear that does not exist, while
      {best_closure} is the best model on the case at {best_score:.2f}, ahead
      of Launder-Sharma at {ls_score:.2f}. Everything downstream of the plate
      needs a length scale made of transported quantities.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          laminar_like: mixing_layer_closures_identical_to_laminar
          best_closure: mixing_layer_best_closure
          best_score: mixing_layer_best_normalized
          ls_score: mixing_layer_launder_sharma_normalized
      - kind: publication
        path: paper/main.pdf
        section: Scoring across cases
        label: sec:scoring
  - question: Do coefficients fitted on one flow transfer to others?
    hypothesis: >-
      A closure that matches the calibration DNS closely has learned something
      general about transition.
    answer: >-
      No. Across {n_cases} cases in five geometries, the closure with the best
      in-sample score, clip-k-omega-gamma at {kog_in:.2f}, is the
      worst-transferring of the models that run, at {kog_out:.2f} out of
      sample, a penalty of {kog_penalty:.1f}x. Textbook Launder-Sharma, with
      no coefficient fitted here, is the best model out of sample at
      {ls_out:.2f} and the only one that runs on every case. The simpler
      clip-k-gamma transfers better than the elaborate one, at a penalty of
      {kg_penalty:.1f}x.
    evidence:
      - kind: value
        path: results/findings.json
        key: benchmark_n_cases
        name: n_cases
      - kind: value
        path: results/findings.json
        key: benchmark_best_out_of_sample_closure
        name: best_out
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_omega_gamma_in_sample_mean
        name: kog_in
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_omega_gamma_out_of_sample_mean
        name: kog_out
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_omega_gamma_transfer_penalty
        name: kog_penalty
      - kind: value
        path: results/findings.json
        key: benchmark_launder_sharma_out_of_sample_mean
        name: ls_out
      - kind: value
        path: results/findings.json
        key: benchmark_clip_k_gamma_transfer_penalty
        name: kg_penalty
      - kind: result
        path: results/benchmark.json
      - kind: publication
        path: paper/main.pdf
        section: Across the suite
        label: sec:generality
    reviewed: 2026-08-31 00:30:10
  - question: Which quantities transfer between flows?
    answer: >-
      The structure parameter a_1 and the dissipation coefficient C_eps in
      equilibrium turbulence, and nothing else tested. a_1 is
      {a1_transitional:.3f} at the downstream end of the transitional case and
      {a1_jimenez:.3f} across Re_theta 4000-6500 in the independent DNS, a
      difference of {a1_diff:.0f}%. C_eps is {ceps_turb:.1f} over the
      turbulent region and {ceps_jimenez:.1f} in the independent DNS, but
      varies by a factor of {ceps_ratio:.1f} through transition, so the
      cascade there is not in equilibrium.
    evidence:
      - kind: result
        path: results/paper-numbers.json
        values:
          a1_transitional: aOneTransitional
          a1_jimenez: aOneJimenez
          a1_diff: aOneRelDiff
          ceps_turb: CepsTurb
          ceps_jimenez: CepsJimenez
          ceps_ratio: CepsRatio
      - kind: result
        path: results/energy-flux.json
        explanation: The other quantities tested, which do not transfer.
      - kind: publication
        path: paper/main.pdf
        section: What transfers
        label: sec:transfers
  - question: Does a-priori regression on DNS features identify a constitutive law?
    hypothesis: >-
      A library fit with high in-sample R^2 has found the functional form of
      the Reynolds shear stress.
    answer: >-
      No. Regressing the shear stress on {n_terms} dimensionless groups gives
      R^2 = {stress_in:.3f} in sample, but coefficients fitted downstream and
      applied upstream give R^2 = {stress_down_up:.0f}, and fitted here and
      applied to the independent DNS give R^2 = {stress_to_jimenez:.0f},
      although that DNS fits itself to {jimenez_self:.3f}. In-sample agreement
      does not distinguish a constitutive law from a curve fit.
    evidence:
      - kind: result
        path: results/paper-numbers.json
        values:
          n_terms: NTerms
          stress_in: StressInSample
          stress_down_up: StressDownToUp
          stress_to_jimenez: StressToJimenez
          jimenez_self: JimenezSelfFit
      - kind: publication
        path: paper/main.pdf
        section: What does not transfer
        label: sec:fails
  - question: How much does case setup alone move a transition-model comparison?
    answer: >-
      More than the models differ. The Langtry-Menter model on the same mesh
      with no coefficient changed goes from a skin-friction error of
      {lm_old_cf} with the inlet 127 units upstream and an arbitrary
      Re_theta_t to {lm_new_cf} with the inlet at the DNS station and
      Re_theta_t from its own correlation. Every comparison in this project
      therefore places the inlet at the DNS station and fits inlet conditions
      per model to the same measured free-stream decay.
    evidence:
      - kind: value
        path: results/paper-numbers.json
        key: LMOldCf
        name: lm_old_cf
      - kind: value
        path: results/paper-numbers.json
        key: LMNewCf
        name: lm_new_cf
      - kind: value
        path: results/paper-numbers.json
        key: LMOldU
        name: lm_old_u
      - kind: value
        path: results/paper-numbers.json
        key: LMNewU
        name: lm_new_u
      - kind: result
        path: results/dns-domain-vs-dns.json
      - kind: publication
        path: paper/main.pdf
        section: Case setup sensitivity
        label: sec:bench
  - question: >-
      Does closing the momentum equation with terms beyond an eddy viscosity
      help, and does it transfer?
    hypothesis: >-
      The {misalignment_pre:.0f}-degree misalignment between stress and strain
      means an eddy viscosity cannot represent the pre-transitional flow, so
      extra force terms built from k, omega and the mean gradients should
      improve the fit and, being dimensionless and Galilean invariant, should
      transfer.
    answer: >-
      It helps in sample and does not transfer. Fitted on the plate alone by
      Bayesian optimization of the a-posteriori score, six such terms on
      Launder-Sharma cut its error there from {ls_plate:.2f} to
      {single_best:.2f} with small coefficients, and raise its out-of-sample
      mean from {single_base_out:.2f} to {single_out:.2f}. Fitted jointly on
      four cases in four geometries, the optimum found over {multi_n}
      evaluations ({multi_div} diverged) is the base closure itself,
      coefficients zero, so the data prefer no extra term to any one term at
      the same coefficient everywhere.
    notes: >-
      Fast tier only, terms with wall-normal derivatives; a small optimization
      budget in six dimensions; near-best intervals rather than posteriors.
      See docs/ideas-log.md section 7.1.
    evidence:
      - kind: result
        path: results/findings.json
        values:
          misalignment_pre: misalignment_deg_pretransition
          ls_plate: baseline_ls_plate
          single_best: momentum_library_single_best_objective
          single_base_out: momentum_library_single_base_out_of_sample_mean
          single_out: momentum_library_single_out_of_sample_mean
          multi_n: momentum_library_multi_n_evaluations
          multi_div: momentum_library_multi_n_diverged
          multi_coeffs: momentum_library_multi_coeffs
      - kind: publication
        path: paper/main.pdf
        section: Beyond eddy viscosity
        label: sec:momentum-library
  - question: >-
      Do the fast-tier rankings hold when the same closures are run in OpenFOAM on
      separated and secondary flows?
    hypothesis: >-
      The parabolic screening tier orders closures the way the elliptic tier does,
      so a fast-tier optimum can be promoted without a Tier-2 check.
    answer: >-
      No. On the {n_cases} Closure Challenge DNS cases run in OpenFOAM - four parameterized
      periodic hills and four ducts - the published transition models lead ({best}
      at {best_mean:.2f} out of sample, SST at {sst:.2f}, kkL-omega at {kkl:.2f});
      the clipping closure relaminarizes every duct ({clip_duct:.1f} against laminar's
      {lam_duct:.1f}) and scores {clip_hill:.1f} on the hills; and Launder-Sharma,
      the fast tier's best model out of sample, diverges on {ls_div} hills and blows
      up finitely on a third. The two tiers rank the models differently, so the screening
      tier is for optimization and the elliptic tier is the benchmark of record.
    notes: >-
      One convergence criterion, one set of derived fields and no per-model tuning
      on any case; see docs/rans-bench.md section 4 and pypkg/cases/openfoam.py.
    evidence:
      - kind: value
        path: results/findings.json
        key: tier2_n_cases
        name: n_cases
      - kind: value
        path: results/findings.json
        key: tier2_best_closure
        name: best
      - kind: value
        path: results/findings.json
        key: tier2_k_omega_sst_lm_out_of_sample_mean
        name: best_mean
      - kind: value
        path: results/findings.json
        key: tier2_k_omega_sst_out_of_sample_mean
        name: sst
      - kind: value
        path: results/findings.json
        key: tier2_kkl_omega_out_of_sample_mean
        name: kkl
      - kind: value
        path: results/findings.json
        key: tier2_clip_k_omega_gamma_duct_mean
        name: clip_duct
      - kind: value
        path: results/findings.json
        key: tier2_laminar_duct_mean
        name: lam_duct
      - kind: value
        path: results/findings.json
        key: tier2_clip_k_omega_gamma_hill_mean
        name: clip_hill
      - kind: value
        path: results/findings.json
        key: tier2_launder_sharma_n_diverged
        name: ls_div
      - kind: value
        path: results/findings.json
        key: tier_rankings_agree
        name: agree
      - kind: result
        path: results/benchmark-openfoam.json
      - kind: result
        path: results/tier-discrepancy.json
      - kind: publication
        path: paper/main.pdf
        section: Across the suite
        label: sec:generality
  - question: >-
      Does the transition threshold depend on the free-stream turbulence
      level, as it physically must?
    hypothesis: Higher free-stream turbulence lowers the critical Reynolds number.
    answer:
      if re_v_at_3 < 480 and re_v_at_15 > re_v_at_3: >-
        Yes, strongly. Across Wu et al.'s DNS, the peak vorticity Reynolds
        number at onset falls from {re_v_at_15:.0f} at 1.5 percent inlet
        intensity to {re_v_at_3:.0f} at 3 percent and {re_v_at_6:.0f} at 6
        percent. At 3 percent it sits beside the classical 440, and the JHTDB
        plate this project calibrates on has a free stream of
        {tu_jhtdb:.1f} percent at its inlet, which is why the closure's fitted threshold landed near
        the classical value: it is a 3 percent number, not a constant. The
        fitted omega destruction coefficient, beta = {beta:.3f} against the
        standard 0.072, is still a single-case compensation.
      else: >-
        The peak Re_v at onset is {re_v_at_15:.0f} at 1.5 percent,
        {re_v_at_3:.0f} at 3 percent and {re_v_at_6:.0f} at 6 percent.
    notes: >-
      The threshold's dependence is now measured; a closure that uses it
      needs the free-stream intensity as an input, as Langtry-Menter's
      correlation does, or a transported quantity that carries it.
    evidence:
      - kind: value
        path: results/clip-k-gamma-coeffs.json
        key: internal_coeffs.beta
        name: beta
      - kind: result
        path: results/bypass-onset.json
        values:
          re_v_at_15: cases.WM150.re_v_max_onset
          re_v_at_3: cases.WM300.re_v_max_onset
          re_v_at_6: cases.WM600.re_v_max_onset
      - kind: value
        path: results/inlet-profiles.json
        key: Tu_inlet_percent
        name: tu_jhtdb
  - question: >-
      Can we write an evolution equation for a structure variable such as Q or
      lambda_2, rather than for an energy, from an advection-diffusion
      skeleton plus coupling terms from the mean momentum and continuity
      equations?
    notes: >-
      Open. Needs fluctuating velocity gradients, which means a new JHTDB
      pull. See docs/ideas-log.md section 3.
  - question: >-
      Do the Reynolds stress transport terms proposed in notebooks/main.ipynb
      outperform the activation approach?
    notes: >-
      Open as posed. They were written down but never tested in a forward
      solve. Two of them, a*grad(K) and b*(grad(U) dot grad(P)), were
      hard-coded into sim/newModel/solver/UEqn.H with fixed coefficients; that
      solver is used only by the evolve-model stage, so no result in the paper
      depended on them, and they now default to zero. Neither is Galilean
      invariant (|U|^2 is frame-dependent), so they are not carried into the
      momentum-term library, which is the successor to this idea; see the
      fit-momentum-library stages.


  - question: >-
      Is there a sparse transport equation for omega, and for k, that the DNS
      flow families share?
    hypothesis: >-
      Beyond SST's own terms, a small set of added terms, including a
      rectified vorticity-Reynolds-number activation, is selected in every
      fit that leaves one flow family out.
    answer:
      if f_shared > 5 and f_full >= f_a1: >-
        No, not a sparse one, and for the stress-based omega nothing beyond a
        known relation. With the destruction fixed, the fits that leave one
        family out keep {f_shared} of the {n_terms} candidate terms rather
        than a few, and they transfer no better than the two columns that
        depend only on the structure parameter -uv/k: the median held-out
        residual is {f_full:.2f} of the destruction against {f_a1:.2f} for
        those two alone, and on the transitional plate {f_plate:.2f} against
        {f_plate_a1:.2f}. For the dissipation-based omega the extra terms do
        help, from {e_a1:.2f} to {e_full:.2f}, and both beat SST's four terms
        refitted, at {e_sst:.2f}, but with {e_shared} of {n_terms} terms kept
        that is a fit rather than a law.
      else: >-
        Possibly. The fits that leave one family out keep {f_shared} of the
        {n_terms} candidate terms, and their median held-out residual is
        {f_full:.2f} of the destruction against {f_a1:.2f} for the structure
        parameter alone, so the added terms carry information beyond it. The
        next test is the bench.
    notes: >-
      Omega only. The k equation was not fitted separately: in a k-omega
      model its unclosed sink is beta* k omega, which the omega target
      already carries, and the regress-pde-terms stage fits its budget
      residual. A priori only: the fit is to DNS fields, not to solutions of
      the equation it proposes, and nothing it nominated earned promotion to
      the bench. The success bar for that step was fixed in advance, SST-LM's
      {sst_lm:.2f} out of sample on the OpenFOAM tier, or SST's {sst:.2f}
      there in both the boundary-layer and the separated or secondary-flow
      families. See docs/ideas-log.md section 7.5.
    evidence:
      - kind: result
        path: results/transport-equation-fit.json
        values:
          n_terms: targets.omega_frozen.n_terms
          f_shared: targets.omega_frozen.n_shared_terms
          f_full: targets.omega_frozen.median_residual_held_out
          f_a1: targets.omega_frozen.median_residual_held_out_a1_only
          f_plate: targets.omega_frozen.leave_one_family_out.transitional-bl.residual_held_out
          f_plate_a1: targets.omega_frozen.leave_one_family_out.transitional-bl.residual_held_out_a1_only
          e_shared: targets.omega_eps.n_shared_terms
          e_full: targets.omega_eps.median_residual_held_out
          e_a1: targets.omega_eps.median_residual_held_out_a1_only
          e_sst: targets.omega_eps.median_residual_held_out_sst_terms
      - kind: result
        path: results/findings.json
        values:
          sst_lm: tier2_k_omega_sst_lm_out_of_sample_mean
          sst: tier2_k_omega_sst_out_of_sample_mean
  - question: >-
      Does one omega close both the dissipation and the shear stress, as a
      two-equation eddy-viscosity model assumes?
    hypothesis: >-
      Yes in the log layer, where the effective C_mu = nu_t eps / k^2 takes
      the standard value 0.09, so eps/(beta* k) and k/nu_t coincide there.
    answer:
      if cmu_ch550 < 0.09 and cmu_ch5200 < 0.09 and cmu_jimenez < 0.09 and cmu_wing < 0.09: >-
        No, not even in the log layer. There the effective C_mu is
        {cmu_ch550:.3f} in the channel at Re_tau 550, falling to
        {cmu_ch5200:.3f} at 5200, {cmu_jimenez:.3f} in the Jiménez boundary
        layer and {cmu_wing:.3f} on the NACA 4412 suction side at the higher
        Reynolds number, all below 0.09, and the two omegas agree within a
        factor of 1.3 at only {agree_ch5200:.0%} of the channel's points at
        Re_tau 5200 and {agree_wing:.0%} of the wing's. A transported omega
        has to choose which of the two it reproduces.
      else: >-
        In part. The effective C_mu in the log layer is {cmu_ch550:.3f} in
        the channel at Re_tau 550 and {cmu_ch5200:.3f} at 5200,
        {cmu_jimenez:.3f} in the Jiménez boundary layer and {cmu_wing:.3f} on
        the wing, not uniformly below 0.09.
    notes: >-
      The Jiménez dissipation is the pseudo-dissipation nu <omega'^2> from the
      vorticity rms, which differs from the true dissipation mainly near the
      wall; the channel and wing use their published k budgets.
    evidence:
      - kind: result
        path: results/transport-targets-summary.json
        values:
          cmu_ch550: cases.channel-retau-550.cmu_eff_median_log_layer
          cmu_ch5200: cases.channel-retau-5200.cmu_eff_median_log_layer
          cmu_jimenez: cases.jimenez-zpg-tbl.cmu_eff_median_log_layer
          cmu_wing: cases.naca4412-suction-rec-1000000.cmu_eff_median_log_layer
          agree_ch5200: cases.channel-retau-5200.omega_targets_agree_fraction
          agree_wing: cases.naca4412-suction-rec-1000000.omega_targets_agree_fraction
  - question: >-
      Which omega should a discovered equation transport: the one that closes
      the dissipation, eps/(beta* k), or the one that closes the stress,
      k/nu_t?
    hypothesis: >-
      They agree only in the log layer, where the effective C_mu is near
      0.09, and the stress-consistent one transfers better because it is the
      one the momentum equation sees.
    answer:
      if f_full >= f_a1 and e_full < e_a1: >-
        The dissipation-based one, if either, which refutes the hypothesis.
        The stress-based omega is tied to the structure parameter by
        construction, S/omega = -uv/k, so an equation fitted to it transfers
        no better than a constant -uv/k does ({f_full:.2f} of the destruction
        unexplained against {f_a1:.2f}, median over held-out families) and
        says nothing about transport. Only the dissipation-based omega leaves
        anything for the other terms to explain, taking its held-out residual
        from {e_a1:.2f} to {e_full:.2f}.
      else: >-
        Neither clearly. Held out, the stress-based omega's equation leaves
        {f_full:.2f} of the destruction unexplained against {f_a1:.2f} for
        the structure parameter alone, and the dissipation-based one
        {e_full:.2f} against {e_a1:.2f}.
    notes: >-
      A priori, and on the families that have a dissipation: the channel, the
      separation bubble, the wing, and the transitional plate at the 17
      stations where its gradients were pulled from the JHTDB. Not the
      Jiménez boundary layer, whose stations are separate averages rather
      than a streamwise sequence, so advection cannot be formed. Whether the
      dissipation-based equation holds up inside a solver is the bench's
      question, not this one's.
    evidence:
      - kind: result
        path: results/transport-equation-fit.json
        values:
          f_full: targets.omega_frozen.median_residual_held_out
          f_a1: targets.omega_frozen.median_residual_held_out_a1_only
          e_full: targets.omega_eps.median_residual_held_out
          e_a1: targets.omega_eps.median_residual_held_out_a1_only
  - question: >-
      Does the spectral entropy of the velocity fluctuations rise
      monotonically through bypass transition, in step with the swing in the
      dissipation coefficient?
    hypothesis: >-
      Yes. Streaks hold their energy in a few spanwise modes and turbulence
      spreads it over many, so the entropy rises once, where the cascade
      falls out of equilibrium.
    answer:
      if not mono and not in_step: >-
        No, by the test set before the data. The spectral entropy is monotone
        at {n_mono} of the {n_h} sampled heights and not in the layer mean,
        which rises to {s_peak:.2f} and falls back, and its halfway point
        comes {s_lead:.0f} units of x ahead of the dissipation coefficient's.
        Part of that is the measure: over a fixed span, the energetic scales
        hold fewer modes as the layer thickens. Taken instead over bands of
        wavelength scaled by delta_99, an exploratory measure, the entropy
        rises from {b_first:.2f} to {b_peak:.2f} by x = {b_x_peak:.0f} and
        then levels off, failing the monotone test only on a small dip, but
        it still leads C_eps, by {b_lead:.0f}: the spectrum broadens well
        before the dissipation coefficient swings, rather than with it.
      else: >-
        The spectral entropy is monotone at {n_mono} of {n_h} heights, and
        its halfway point is {s_lead:.0f} units of x from C_eps's.
    notes: >-
      From full spanwise lines of the JHTDB transitional boundary layer at 17
      stations, six heights and eight snapshots (the spanwise-lines
      dataset). The delta-scaled measure was added after a first look at
      part of the data showed the fixed-span measure's confound, so it is
      reported as exploratory. See docs/ideas-log.md sections 7.6 and 7.7.
    evidence:
      - kind: result
        path: results/spectral-entropy.json
        values:
          mono: monotone_layer_mean.monotone
          in_step: in_step
          n_mono: n_heights_monotone
          n_h: n_heights
          s_peak: spectral_entropy_peak
          s_lead: spectral_entropy_lead_over_c_eps
          b_first: exploratory.band_entropy_first_station
          b_peak: exploratory.band_entropy_peak
          b_x_peak: exploratory.x_band_entropy_peak
          b_lead: exploratory.band_entropy_lead_over_c_eps

  - question: >-
      Does transporting the spectral entropy as a third variable, alongside k
      and omega, predict transition better than SST-LM?
    hypothesis: >-
      Yes, because it carries the width of the spectrum, which k and omega
      cannot, and transition is where that width changes.
    notes: >-
      Open, and only worth attempting if the entropy passes the
      monotonicity test in the previous question. Its equation would be
      found the same way as omega's, by regression over a term library,
      then scored in the bench.
  - question: >-
      Does the boundary layer clip at a fixed local Reynolds number through
      transition, holding the peak vorticity Reynolds number at a ceiling
      while the excess goes into fluctuations?
    hypothesis: >-
      Yes. The peak of Re_v = y^2 S / nu grows with the laminar layer, stops
      at the transition threshold while the streaks overshoot and saturate,
      and resumes only once the mean profile has flattened.
    answer:
      if not clips and var_half < 0.1: >-
        Not across the transition region as tested. From the minimum of C_f
        to its maximum, the peak Re_v rises {var_full:.0%}, more than the
        laminar trend would have ({grew:.0%}). But over the first half of that
        region it holds within {var_half:.0%}, at {rev_half:.0f}, beside the
        classical threshold of 440, which is the clip and only half of it: the
        ceiling holds while transition starts, then the flattened turbulent
        profile carries the peak past it. The first half was noticed before
        the test was written and was not what it was set to count.
      elif clips: >-
        Yes. Through the transition region the peak Re_v varies by only
        {var_full:.0%} while the laminar trend would have grown {grew:.0%}.
      else: >-
        No. The peak Re_v rises {var_full:.0%} through the transition region,
        and {var_half:.0%} over its first half.
    evidence:
      - kind: result
        path: results/transition-mechanics.json
        values:
          clips: clips
          var_full: re_v_max_variation_transition
          var_half: re_v_max_variation_first_half
          rev_half: re_v_max_mean_first_half
          grew: laminar_trend_growth_over_transition
    notes: >-
      Open. A quick look at the JHTDB plate's mean profiles suggests a
      plateau through the start of transition (docs/ideas-log.md section
      7.7), which a stage has to quantify before it counts. The idea is
      Malkus's marginal stability, that turbulence holds the flow at the
      edge of stability.
  - question: >-
      Is transition onset set by the disturbance amplitude reaching a fixed
      headroom, free-stream intensity times transient-growth gain, rather
      than by a Reynolds number alone?
    hypothesis: >-
      Yes. What clips is the disturbance, not the Reynolds number: onset is
      where streak amplitude, the free-stream input times a gain that grows
      with Reynolds number, reaches the amplitude at which the streaks go
      secondarily unstable, so a threshold on Re_v alone must shift with
      free-stream turbulence.
    answer:
      if supported: >-
        Yes, on the five bypass-transition DNS of Wu et al. at inlet
        intensities from 0.75 to 6 percent. The onset Re_x falls as
        Tu^(-{n:.2f}), near the exponent of 2 that a fixed headroom with
        lift-up gain predicts, and Tu^2 Re_x at onset holds within
        {cv:.0%}, with the 6 percent case, which transitions near the
        inlet, the outlier. The peak vorticity Reynolds number at onset is not
        fixed: it runs from {rev_max:.0f} to {rev_min:.0f} as the intensity
        rises, so no threshold on Re_v alone can place onset in more than one
        flow.
      else: >-
        Not as tested. The onset exponent is {n:.2f}, and the peak Re_v at
        onset runs from {rev_min:.0f} to {rev_max:.0f}.
    notes: >-
      Onset is where the intermittency first reaches 0.1; the tests were
      fixed in scripts/analyze-bypass-onset.py before the data were looked
      at, and Re_v at onset is interpolated between the profile stations the
      dataset gives.
    evidence:
      - kind: result
        path: results/bypass-onset.json
        values:
          supported: headroom_supported
          n: onset_exponent_n
          cv: tu2_re_x_cv
          rev_min: re_v_max_onset_min
          rev_max: re_v_max_onset_max
  - question: >-
      When the streaks saturate, does their energy go first into harmonics of
      the streak wavenumber, before the spanwise spectrum broadens?
    hypothesis: >-
      Yes. The nonlinearity is quadratic, so a saturating streak mode feeds
      its second harmonic and the mean flow first, as a square-law mixer
      would, and broadband content follows from the interactions of those.
    answer:
      if not lead: >-
        No, not by the exploratory test fixed before it was computed. The
        energy at twice and three times the peak spanwise wavenumber,
        relative to the peak, is greatest at x = {x_h:.0f}, after the
        delta-scaled spectral entropy has already passed halfway, at x =
        {x_b:.0f}: the spectrum broadens before, not after, the harmonics
        peak. The measure is noisy, since the peak wavenumber jumps between
        stations.
      else: >-
        Yes. The harmonic ratio peaks at x = {x_h:.0f}, before the
        delta-scaled spectral entropy passes halfway at x = {x_b:.0f}.
    notes: >-
      Exploratory, from the JHTDB spanwise lines at 0.2 delta_99; the test
      was fixed before the measure was computed, but after the
      pre-registered spectral-entropy result was known.
    evidence:
      - kind: result
        path: results/spectral-entropy.json
        values:
          lead: exploratory.harmonics_lead_broadening
          x_h: exploratory.x_harmonic_peak
          x_b: exploratory.x_half_band_entropy

  - question: >-
      Does the mean-flow distortion act as automatic gain control,
      lowering production per unit fluctuation energy as the streaks
      saturate?
    hypothesis: >-
      Yes. The flattened mean profile is the rectified output of the
      fluctuations, and it lowers the shear that feeds them, so
      -<u'v'> dU/dy / k falls through the saturation rather than tracking
      the fluctuation energy.
    answer:
      if gain_control: >-
        Yes. Production per unit fluctuation energy falls from
        {eff_on:.2f} to {eff_end:.2f} through transition while the
        fluctuation energy grows.
      else: >-
        No, the opposite. Production per unit fluctuation energy, over the
        outer time scale, rises from {eff_on:.2f} at the onset of transition
        to {eff_end:.2f} at its end. The pre-transitional streaks hold energy
        but carry little shear stress; turbulence produces far more per unit
        energy, the same shift from redistribution to correlation found for
        the velocity components. Whatever limits the fluctuations, it is not
        the production efficiency falling.
    evidence:
      - kind: result
        path: results/transition-mechanics.json
        values:
          gain_control: gain_control
          eff_on: production_efficiency_at_onset
          eff_end: production_efficiency_at_end
    notes: >-
      Open. Computable from the time-averaged JHTDB profiles alone.
  - question: >-
      Once the flow is turbulent, is its spectral entropy a function of the
      turbulence Reynolds number alone, and is transition a departure from
      that equilibrium that decays over about one eddy turnover?
    hypothesis: >-
      Yes. In equilibrium the spectrum's shape is set by the ratio of the
      energy-containing to the dissipative scale, so the entropy is some
      S*(k^2/(nu eps)); a transported entropy then carries new information
      only as its departure from S*, relaxing toward it on the turnover time.
    answer:
      if not collapses: >-
        No, not on this plate, by the exploratory test fixed before it was
        computed. Downstream of transition, the delta-scaled spectral entropy
        against the logarithm of k^2/(nu eps) fits a line with R^2 of only
        {r2:.2f}, so there is no equilibrium curve for transition to depart
        from, although the upstream points do sit {ratio:.1f} times further
        off that line than the downstream scatter. The turbulent part of the
        plate spans a narrow range of turbulence Reynolds number, which may
        be too little to see a dependence; a collapse needs flows at several.
      else: >-
        Yes. Downstream the entropy follows the logarithm of the turbulence
        Reynolds number with R^2 = {r2:.2f}, and upstream points sit
        {ratio:.1f} times further off it.
    notes: >-
      Exploratory, from the JHTDB spanwise lines, with the true dissipation
      from their gradients; the relaxation over a turnover was not tested,
      since without a collapse there is nothing to relax toward. The exact
      entropy equation and the relaxation closure it suggests are in
      docs/ideas-log.md section 7.7.
    evidence:
      - kind: result
        path: results/spectral-entropy.json
        values:
          collapses: exploratory.collapses
          r2: exploratory.collapse_r2_downstream
          ratio: exploratory.departure_ratio_upstream

  - question: >-
      How does the effective C_mu evolve through transition on the plate,
      now that the plate has a true dissipation?
    hypothesis: >-
      It is near zero before transition, where there is dissipation but
      almost no stress-carrying eddy viscosity, and rises toward the value
      of the other flows' log layers once turbulent.
    answer:
      if cmu_first < 0.01 and cmu_last > 0.05: >-
        As hypothesized. Over 0.1-0.5 delta_99, the effective C_mu = nu_t
        eps / k^2 is {cmu_first:.4f} at the first station, where there is
        dissipation but almost no stress-carrying eddy viscosity, and
        {cmu_last:.3f} at the last, in the range of the other flows' log
        layers. Before transition, a two-equation model's single omega
        cannot represent both.
      else: >-
        The effective C_mu is {cmu_first:.4f} at the first station and
        {cmu_last:.3f} at the last.
    notes: >-
      The dissipation is the true one, from the gradients in the JHTDB
      spanwise lines; nu_t is -<u'v'>/(dU/dy) from the time-averaged
      profiles.
    evidence:
      - kind: result
        path: results/spectral-entropy.json
        values:
          cmu_first: cmu_eff_first_station
          cmu_last: cmu_eff_last_station

  - question: >-
      Where does the plate's integral dissipation coefficient leave its
      laminar value: where the vorticity Reynolds number reaches its
      threshold, or at the energy-stability bound?
    hypothesis: >-
      At the Re_v threshold. Energy stability only says where disturbances
      can grow, and transition is capacity permitted rather than capacity
      forced, so the dissipation coefficient should jump where the
      threshold fires, well past the energy-stability bound.
    answer: >-
      At neither, but between them. The dissipation coefficient leaves its
      laminar trend at x = {x_cd:.0f}, downstream of where the displacement
      thickness Reynolds number reaches the linear critical 520, at x =
      {x_lin:.0f}, and so of the energy-stability bound, which cannot lie
      downstream of that, but upstream of where the peak Re_v reaches 440, at
      x = {x_rev:.0f}. Dissipation rises ahead of the threshold the closure
      switches on, as the pre-transitional streaks grow, so a threshold on
      Re_v alone switches on after the dissipation has already started to
      change.
    evidence:
      - kind: result
        path: results/transition-mechanics.json
        values:
          x_cd: x_cd_departs_laminar
          x_lin: x_re_dstar_linear_critical
          x_rev: x_re_v_reaches_classical
    notes: >-
      Open. The control-volume view: the momentum integral gives C_f/2 =
      dtheta/dx and the kinetic-energy integral gives 2 C_D = d(delta_3)/dx,
      both computable from the time-averaged profiles, with the laminar and
      turbulent parts of C_D separated.
  - question: >-
      Why does kkL-omega score exactly like laminar on the plate?
    hypothesis: >-
      It never transitions in our setup, because its laminar kinetic energy
      is not seeded the way its authors intend at our inlet.
    answer:
      if kkl_u < lam_u: >-
        Because our inlet gave it the wrong free stream, which also refutes
        the hypothesis. Each model's inlet omega is fitted so that its own
        free-stream decay matches the DNS, and kkL-omega had been given a
        k-omega model's constants; far from the wall its kt decays at
        omega*kt and its omega at 0.92 omega^2, so its free stream died an
        order of magnitude too fast and its bypass criterion never fired.
        With its own constants it transitions, and its velocity error falls
        from laminar's {lam_u:.3f} to {kkl_u:.3f}. Its skin-friction error,
        {kkl_cf:.3f} against laminar's {lam_cf:.3f}, is no better, for a
        different reason now: it transitions far too early, with C_f
        {cf_100:.4f} at x = 100 where the DNS has {cf_100_dns:.4f}, and then
        settles near half the DNS's turbulent level, {cf_907:.4f} against
        {cf_907_dns:.4f} at x = 907.
      else: >-
        Its inlet free stream was decaying with a k-omega model's constants
        rather than its own; corrected, its velocity error is {kkl_u:.3f}
        against laminar's {lam_u:.3f}.
    notes: >-
      Handing the inlet's streak energy to kl instead of kt was tested first
      and changed nothing, because the free stream was already too weak for
      the bypass mechanism. The corrected runs stop at the iteration limit
      with a pressure residual above the solver's target while every other
      residual has converged, so a small unsteadiness may remain. The
      Closure Challenge runs do not use the fitted inlet and are unaffected.
    evidence:
      - kind: result
        path: results/dns-domain-vs-dns.json
        values:
          kkl_u: kkl-omega.U_rel_rms_mean
          lam_u: laminar.U_rel_rms_mean
          kkl_cf: kkl-omega.cf_rel_err_mean
          lam_cf: laminar.cf_rel_err_mean
          cf_100: kkl-omega.stations.1.cf
          cf_100_dns: kkl-omega.stations.1.cf_dns
          cf_907: kkl-omega.stations.12.cf
          cf_907_dns: kkl-omega.stations.12.cf_dns
  - question: >-
      With the plate's true dissipation, is there an omega equation shared
      between the transitional plate and the other flows?
    hypothesis: >-
      No more than without it: the earlier fit found no sparse shared
      equation, and adding the flow where the balance changes most should
      make that clearer, not reverse it.
    answer:
      if plate > 1: >-
        No, and the plate is why. With its true dissipation included, the
        fit that holds the transitional plate out leaves {plate:.2f} of its
        destruction unexplained, worse than predicting no source at all;
        SST's four terms refitted do no better, at {plate_sst:.2f}, nor does
        the structure parameter alone, at {plate_a1:.2f}. The other families
        are predicted to between {best:.2f} and {worst:.2f}. The fits still
        keep {shared} of {n_terms} terms. The transitional plate's omega
        balance is unlike the other flows', so an equation fitted to them
        says nothing about it.
      else: >-
        Held out, the plate's residual is {plate:.2f} against {plate_sst:.2f}
        for SST's terms refitted.
    notes: >-
      A priori; the plate's dissipation comes from the gradient profiles
      pulled from the JHTDB at 17 stations, every DNS height up to 1.2
      delta_99, every 8th spanwise node and eight snapshots, with advection
      from neighboring stations 50 units apart.
    evidence:
      - kind: result
        path: results/transport-equation-fit.json
        values:
          plate: targets.omega_eps.leave_one_family_out.transitional-bl.residual_held_out
          plate_sst: targets.omega_eps.leave_one_family_out.transitional-bl.residual_held_out_sst_terms
          plate_a1: targets.omega_eps.leave_one_family_out.transitional-bl.residual_held_out_a1_only
          best: targets.omega_eps.leave_one_family_out.wing-apg.residual_held_out
          worst: targets.omega_eps.leave_one_family_out.separation-bubble.residual_held_out
          shared: targets.omega_eps.n_shared_terms
          n_terms: targets.omega_eps.n_terms
  - question: >-
      Is there an intrinsic Reynolds number below which a boundary layer
      cannot sustain turbulence however it is tripped, distinct from the
      onset threshold that tripping lowers?
    hypothesis: >-
      Yes. Onset is input times gain reaching headroom, so a trip, a larger
      input, lowers it; but turbulence regenerates its own input, streaks
      to vortices to streaks, like an amplifier with positive feedback, and
      that loop has a minimum gain below which it dies whatever started it.
      The two thresholds differ, which is the hysteresis a single activation
      threshold cannot represent.
    notes: >-
      Open. Needs flows tripped at different strengths, or relaminarizing
      ones; none of the DNS in the suite is tripped by design. A closure
      would need two thresholds, one to switch turbulence on that depends on
      the free-stream input, and a lower one to switch it off.
  - question: >-
      Does a transition threshold that depends on free-stream intensity,
      fitted on other bypass-transition DNS, predict where the JHTDB plate
      transitions?
    hypothesis: >-
      Yes. A power law for the onset Re_v in the local free-stream intensity
      at onset, fitted on Wu et al.'s DNS, predicts the plate's onset Re_v
      within 15 percent.
    answer:
      if not transfers and inlet_transfers: >-
        Not in the local intensity, which refutes the hypothesis, but
        apparently in the inlet intensity. Fitted on Wu et al.'s DNS as
        Lambda_c = {A:.0f} Tu^(-{m:.2f}), the law in the local intensity at
        onset predicts {law:.0f} for the plate, which reaches only
        {actual:.0f}: the plate transitions at a local intensity of
        {tu_local:.2f} percent, where Wu et al.'s flows would not. In the
        intensity at the inlet instead, an exploratory fit defined after that
        failure predicts {law_in:.0f}, within {err_in:.0%}. Onset appears to
        depend on how long the streaks have been forced, not on the
        free-stream intensity where they break down, which is the history
        Langtry-Menter carry by transporting Re_theta_t in from the free
        stream.
      elif transfers: >-
        Yes. The law in the local intensity predicts {law:.0f} for the plate
        against its {actual:.0f}.
      else: >-
        No. The law in the local intensity predicts {law:.0f} and the one in
        the inlet intensity {law_in:.0f}, against the plate's {actual:.0f}.
    notes: >-
      The local law is fitted on only the three of Wu et al.'s cases whose
      C_f has a minimum inside the domain and whose profiles reach onset; the
      exploratory law uses the intermittency onset of four. The two datasets'
      onsets are defined differently (intermittency against the C_f
      minimum), which a like-for-like test would remove. The decisive test is
      a closure with the threshold law, scored on Wu et al.'s flows as bench
      cases.
    evidence:
      - kind: result
        path: results/threshold-law.json
        values:
          transfers: transfers
          inlet_transfers: exploratory.inlet_law_transfers
          A: A
          m: m
          law: law_at_jhtdb
          actual: jhtdb.re_v_max_onset
          tu_local: jhtdb.tu_onset_percent
          law_in: exploratory.law_inlet_at_jhtdb
          err_in: exploratory.law_inlet_error_at_jhtdb
datasets:
  # This section declares what this project IMPORTS from elsewhere and what it
  # EXPORTS for others to reuse. It is not a listing of every file the pipeline
  # writes -- those are already declared as stage outputs, which is where a
  # reader should look for them.
  #
  # None of the imports below is published under a data DOI: JHTDB, the
  # Sillero/Jimenez server, the UT Austin channel database, the KTH/FAU
  # wing-section database, the NASA TMR and the JAXA DNS database all
  # distribute their data as plain files. Each `imported_from.doi` is
  # therefore the DOI of the paper that describes the data, which is the
  # citable, resolvable record the files can be traced back to; the download
  # URL is in scripts/fetch-dns-data.py (or, for the two datasets fetched by
  # hand, in the description), and the paper is in references.bib under the
  # key named in each description. If a dataset is ever minted its own DOI,
  # point the entry at that instead.

  # ---- imported ---------------------------------------------------------
  - path: data/jhtdb-transitional-bl/time-ave-profiles.h5
    title: JHTDB transitional boundary layer, time-averaged profiles
    description: >
      Time- and spanwise-averaged profiles for the JHTDB transition_bl
      dataset, from https://turbulence.pha.jhu.edu/datasets.aspx. The
      calibration case for every closure in this project. Cite Zaki2013.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2024-08-22
  - path: data/jhtdb-transitional-bl/spanwise-lines.h5
    title: JHTDB transitional boundary layer, spanwise lines through transition
    description: >
      Our sample of the JHTDB transition_bl DNS, not a file the JHTDB
      publishes: velocity and velocity gradient at every one of the 2048
      spanwise grid nodes, at six heights per station (the y nodes nearest
      0.05, 0.1, 0.2, 0.35, 0.5 and 0.75 delta_99), at 17 stations from x =
      100 to 900, and at eight snapshots from t = 150 to 1025, on the grid
      nodes with no interpolation and fourth-order finite-difference
      gradients. Drawn with scripts/standalone/fetch-jhtdb-lines.py, which
      needs a JHTDB token and is therefore not a pipeline stage; it records
      the query in the file. Cite Zaki2013 and JHTDBDescription.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2026-09-25
  - path: data/wu-bypass-transition
    title: Bypass transition DNS at five free-stream turbulence intensities
    description: >
      Wu, Gonzalez and Agrawal's DNS of bypass transition on a flat plate at
      inlet free-stream turbulence intensities of 0.75, 1.5, 2.25, 3 and 6
      percent, as the text files the Center for Turbulence Research
      publishes: C_f, intermittency, shape factor and free-stream decay
      against Re_x and Re_theta, wall-normal profiles of mean velocity and
      stresses at 16 stations, and dissipation and length scales for all but
      the 6 percent case, whose shared folder is empty. The heat-transfer
      statistics are not fetched. The only DNS in the suite
      that varies the free-stream intensity, which is what the questions on
      transition onset need. Fetched by the fetch-dns-data stage from the
      shared folders linked at
      https://ctr.stanford.edu/about-center-turbulence-research/research-data.
      Cite Wu2026.
    imported_from:
      doi: 10.1103/g72g-q82r
      date: 2026-09-25
    stage: fetch-dns-data
  - path: data/jhtdb-transitional-bl/gradient-profiles.h5
    title: JHTDB transitional boundary layer, velocity-gradient profiles
    description: >
      Our sample of the JHTDB transition_bl DNS: the velocity gradient at
      every DNS y node up to 1.2 delta_99, at every 8th spanwise node, at the
      same 17 stations and eight snapshots as the spanwise lines, for the
      true dissipation at every height. Drawn with
      scripts/standalone/fetch-jhtdb-profiles.py, which needs a JHTDB token
      and is therefore not a pipeline stage. Cite Zaki2013 and
      JHTDBDescription.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2026-09-25
  - path: data/jiminez
    title: Sillero/Jimenez ZPG turbulent boundary layer profiles
    description: >
      Six stations at Re_theta 4000-6500, in wall units, from
      https://torroja.dmt.upm.es/turbdata/blayers/. Used both for the a-priori
      term regression and as the jimenez-zpg-tbl benchmark case. Cite
      Sillero2013.
    imported_from:
      doi: 10.1063/1.4823831
      date: 2024-09-04
  - path: data/lee-moser-channel
    title: Lee & Moser turbulent channel profiles, Re_tau 180-5200
    description: >
      Mean and fluctuation profiles, and the budget of k, at five Reynolds
      numbers. Fetched by the
      fetch-dns-data stage, which pins each file by url, retrieval date and
      SHA-256. Cite LeeMoser2015.
    imported_from:
      doi: 10.1017/jfm.2015.268
      date: 2026-09-24
    stage: fetch-dns-data
  - path: data/crs-separation-bubble
    title: Coleman, Rumsey & Spalart DNS of 2-D turbulent separation bubbles
    description: >
      Flat-plate boundary layers driven to genuine separation and reattachment
      by top-wall transpiration, at Re_theta up to 10,700. True DNS, published
      through the NASA Turbulence Modeling Resource specifically for
      turbulence-model validation, and therefore the case a claim about
      separation should rest on rather than the wing-section LES below. The
      wall-normal profiles are 110 MB of ASCII per case upstream; the
      fetch-dns-data stage subsamples them in x and stores ~1 MB of npz. Cite
      Coleman2018.
    imported_from:
      doi: 10.1017/jfm.2018.257
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/kth-wing-sections
    title: KTH well-resolved LES of NACA 4412 and NACA 0012 wing sections
    description: >
      Fifty boundary-layer stations along each wing section at Re_c up to
      1,000,000, with c_f, the Clauser parameter and the Reynolds stresses.
      NOTE: well-resolved LES, not DNS -- the only non-DNS reference in the
      suite. A sub-grid model is itself a turbulence model, so this case
      compares a closure against a model rather than against the equations.
      The suction side reaches beta = 112 with c_f falling to 1.8e-4 without
      separating, which is the near-separation test the closures most need.
      Fetched by the fetch-dns-data stage. Cite Vinuesa2018.
    imported_from:
      doi: 10.1016/j.ijheatfluidflow.2018.04.017
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/jaxa-shear-layer-vortex
    title: >-
      Lusher et al. DNS of a temporally evolving shear layer rolling up into
      vortices
    description: >
      Time histories (t_hat = 0 to 6, 301 instants) of peak and integral
      quantities -- peak vorticity of both signs, minimum pressure, peak
      velocity, peak eddy viscosity, momentum and vorticity thickness, peak
      shear stress and TKE, integrated TKE, production and kinetic energy --
      from a 12.7-billion-point OpenSBLI DNS at dU Lx/nu = 250,000, ensemble
      averaged over five realizations. This is the only published form of the
      DNS: no profiles, no fields. The pre-roll-up phase (t_hat < 0.4) is the
      temporal-mixing-layer benchmark case, the suite's first flow without a
      wall; the vortex phase is the target for a Tier-2 unsteady 2-D case.
      Fetched by the fetch-dns-data stage. Cite Lusher2026 for the DNS and
      Sansica2026 for the RANS comparison; JAXA reserves rights to the data
      and asks that the source be quoted.
    imported_from:
      doi: 10.1007/s00162-026-00788-y
      date: 2026-08-29

    stage: fetch-dns-data
  - path: data/closure-challenge
    title: >-
      Closure Challenge DNS cases as OpenFOAM setups with the DNS on the RANS
      mesh
    description: >
      The DNS cases of the Closure Challenge benchmark, taken as the complete
      OpenFOAM case directories the challenge ships (mesh, boundary
      conditions, schemes) with the DNS mean velocity, kinetic energy and
      Reynolds stresses interpolated onto the RANS mesh: four parameterized
      periodic hills (the DNS of Xiao et al. 2020, cite Xiao2020) and four
      square/rectangular ducts (the DNS of Vinuesa et al. 2014, cite
      Vinuesa2014), all from the challenge's own test set so scores are
      comparable with its leaderboard. The challenge's LES and experimental
      cases are excluded because this suite scores against DNS only, and its
      k-omega SST solutions are excluded because nothing here is trained
      against a RANS solution. Fetched by the fetch-dns-data stage from a
      pinned commit of the challenge repository
      (github.com/rmcconke/closure-challenge-benchmark). Cite McConkey2026.
    imported_from:
      git_repo_url: https://github.com/rmcconke/closure-challenge-benchmark.git
      path: data
      git_rev: d572d40c87f6f56ebbaf9a10c463ee330aa32514
      date: '2026-08-30'
    stage: fetch-dns-data
  - path: data/jhtdb-transitional-bl/sampled-gradients.h5
    title: JHTDB exact gradients and Hessians at 100 sampled points
    description: >
      Velocity and pressure gradients and Hessians queried from the JHTDB web
      service at 100 points, including the spanwise derivatives that cannot be
      obtained from the 2-D time-averaged profiles at all. Kept as their own
      small file rather than merged into all-stats.h5, because fetching them
      requires a JHTDB access token and so must not sit on the pipeline's
      critical path; regenerate with
      scripts/standalone/fetch-jhtdb-gradients.py. The notebook's continuity
      check is the only consumer. Queried from
      https://turbulence.pha.jhu.edu/datasets.aspx.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2024-08-22

  # ---- exported ---------------------------------------------------------
  - path: data/jhtdb-transitional-bl/all-stats.h5
    title: DNS statistics table
    description: >
      The JHTDB profiles flattened onto an (x, y) index with finite-difference
      gradients, derived from the imported profiles above.
    tabular: true
    stage: make-dns-stats-table
  - path: results/benchmark.json
    title: RANS bench leaderboard
    description: >
      Every registered closure scored against every registered case, with
      in-sample and out-of-sample results separated by each closure's declared
      calibration case. The reusable product of the benchmarking harness.
    stage: run-benchmark

figures:
  - path: figures/streak-reservoir.pdf
    title: Streak reservoir against the DNS
    description: >
      Peak fluctuation energy, vorticity Reynolds number and eddy viscosity
      along the plate, DNS against the closure.
    stage: analyze-streak-reservoir
  - path: figures/bl-profile-dns.pdf
    title: The boundary layer profile from DNS data
    description: The mean boundary layer profile computed from the DNS data.
    stage: plot-bl-dns
    data:
      - data/jhtdb-transitional-bl/all-stats.h5
  - path: figures/rans-mesh-snapshot-isometric.png
    title: RANS simulation mesh snapshot
    description: A snapshot of the RANS simulation mesh.
    stage: save-mesh-snapshot-isometric
  - path: figures/openfoam-vs-dns.pdf
    title: OpenFOAM profiles against DNS
    description: >
      Velocity profiles from the elliptic OpenFOAM solution compared with the
      DNS across the laminar, transitional and turbulent regions.
    stage: compare-openfoam-dns
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
  - path: figures/closure-comparison.pdf
    title: Closure comparison against DNS
    description: >
      Skin friction and shape factor over the whole plate for the laminar,
      k-epsilon and clipping k-gamma closures, with the activation field.
    stage: plot-closure-comparison
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5

publications:
  - path: paper/main.pdf
    title: Deriving a new RANS model from DNS data
    description: The primary publication from this project.
    stage: build-paper
    kind: journal-article

environments:
  py-compute:
    kind: uv
    path: envs/compute/pyproject.toml
    description: >
      Numerics only, on Python 3.14. Every closure search, fit, ablation and
      benchmark run depends on this environment's lock, so a package added
      here invalidates results that are expensive to reproduce. Plotting
      packages belong in py-viz. pypkg is installed editable, so stages depend
      on the specific modules they use rather than on the whole package.
  py-sindy:
    kind: uv
    path: envs/sindy/pyproject.toml
    description: >
      Sparse regression of transport equations with PySINDy and scikit-learn,
      on Python 3.14. Kept apart from py-compute so that these packages do not
      invalidate the closure searches, fits and benchmarks on that lock.
  py-viz:
    kind: uv
    path: envs/viz/pyproject.toml
    description: >
      Figures and reporting, layered on the same numerics. Split from
      py-compute so that adding a plotting package does not invalidate a week
      of coefficient fitting. The dependency runs one way on purpose: bumping
      numpy correctly invalidates the figures drawn from it, but not the
      reverse.
  py-jhtdb:
    kind: uv
    path: envs/jhtdb/pyproject.toml
    description: >
      Querying the JHTDB with its current Python client, givernylocal. Used
      only by the token-gated scripts in scripts/standalone/, which are
      deliberately not pipeline stages: they need an access token, and what
      they fetch is committed as a dataset the pipeline reads. Because no
      stage uses this environment, no stage depends on its lock. It
      replaced pyjhtdb, whose legacy SOAP service stopped working in 2025.
  py-notebook:
    kind: uv
    path: envs/notebook/pyproject.toml
    description: >
      The exploratory notebook, which needs Jupyter and calkit itself. Kept
      separate so Jupyter's large and fast-moving dependency tree cannot
      invalidate a figure or a fit. Resolves GitHub issue #18.
  blsim:
    kind: docker
    path: sim/Dockerfile
    wdir: /sim
    description: >
      OpenFOAM v2412 toolchain with foamPy. The custom turbulence models are
      deliberately not built into this image: they are compiled into the
      working tree by the build-turbulence-lib stage so that editing a model
      invalidates only the stages that use it, rather than changing this
      environment lock and invalidating every result produced with it.
    registry: ghcr.io
  texlive:
    kind: docker
    image: texlive/texlive:latest-full

pipeline:
  stages:
    fetch-dns-data:
      kind: python-script
      environment: py-compute
      script_path: scripts/fetch-dns-data.py
      outputs:
        - path: data/lee-moser-channel
          storage: git
        - path: data/kth-wing-sections
          storage: git
        - path: data/crs-separation-bubble
          storage: git
        - path: data/jaxa-shear-layer-vortex
          storage: git
        - data/closure-challenge
        # About 2,000 files from a host that throttles a long run of
        # requests, so a rerun keeps what it already has rather than starting
        # over; the fetch skips files that are present
        - path: data/wu-bypass-transition
          delete_before_run: false
      description: >
        Fetch the external DNS/LES reference datasets the benchmark cases
        need, with the retrieving code under version control rather than
        trusting that someone once ran curl. Source URLs are in the script;
        the citation and retrieval date for each dataset are declared once
        under `datasets`. No checksum file: DVC and git already hash the
        content, and the commit that added the files records when they were
        fetched. Idempotent -- a file already present is not re-downloaded, so
        an ordinary run does no network I/O.
    make-dns-stats-table:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-dns-stats-table.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_stats.py
      outputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      description: >
        Flatten the time-averaged DNS profiles into the (x, y) statistics
        table. Replaces extract-jhtdb-stats, which called setup-dns.py and, if
        the file happened to be missing, downloaded a prebuilt copy from
        Google Drive -- an opaque fetch rather than a derivation, and it put
        pyJHTDB (token-gated, and unbuildable against numpy >= 1.24) on the
        critical path of a pipeline that never used it. This stage is a pure
        function of a tracked input and reproduces the old table bit-for-bit
        on all 23 columns that have a consumer. The 36 JHTDB web-service
        columns are dropped: they were populated at 100 of 743,680 rows and
        nothing read them. Fetching those now lives outside the pipeline, in
        scripts/standalone/fetch-jhtdb-gradients.py.
    mesh-independence:
      kind: shell-command
      environment: blsim
      command: bash sim/run-mesh-independence.sh {ny} {turbulence}
      iterate_over:
        - arg_name: ny
          values: [15, 20, 30, 40, 60]
        - arg_name: turbulence
          values: [k-epsilon]
      inputs:
        - sim/run-mesh-independence.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/{turbulence}-ny-{ny}/postProcessing
        # The mesh is a real product of this stage: blockMesh writes it, and
        # save-mesh-snapshot-isometric consumes it. Leaving it undeclared made
        # that stage depend on a file no stage produced, so it could not run
        # at all on a fresh clone.
        - sim/cases/{turbulence}-ny-{ny}/constant/polyMesh
    laminar-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-laminar.sh
      inputs:
        - sim/run-laminar.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/laminar-ny-40/postProcessing
    save-mesh-snapshot-isometric:
      kind: shell-command
      environment: _system
      command: bash scripts/save-mesh-snapshot.sh
      inputs:
        - sim/cases/k-epsilon-ny-40/constant/polyMesh
        - scripts/save-mesh-snapshot.sh
      outputs:
        - figures/rans-mesh-snapshot-isometric.png
    run-notebook:
      kind: jupyter-notebook
      environment: py-notebook
      notebook_path: notebooks/main.ipynb
      executed_ipynb_storage: dvc
      html_storage: dvc
      inputs:
        - sim/cases/k-epsilon-ny-15/postProcessing
        - sim/cases/k-epsilon-ny-20/postProcessing
        - sim/cases/k-epsilon-ny-30/postProcessing
        - sim/cases/k-epsilon-ny-40/postProcessing
        - sim/cases/k-epsilon-ny-60/postProcessing
        - sim/cases/laminar-ny-40/postProcessing
    plot-bl-dns:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot-bl-dns.py
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - figures/bl-profile-dns.pdf
    validate-bl-solver:
      kind: python-script
      environment: py-compute
      script_path: scripts/validate-bl-solver.py
      inputs:
        - pypkg/bl_solver.py
        - pypkg/closures.py
      outputs:
        - path: results/blasius-validation.json
          storage: git
      description: >
        Check the parabolic screening solver against the Blasius similarity
        solution, so its discretization error is known to be smaller than the
        model differences it is used to judge.
    discover-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/discover-closure.py
      args:
        - --n-random
        - "300"
        - --n-refine
        - "150"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/closure-search.json
          storage: git
        - path: results/closure-params.json
          storage: git
      description: >
        Search structural variants of the clipping closure and fit each one's
        coefficients against the DNS using the fast parabolic solver. This is
        the cheap screening fidelity; promising models are then run in
        OpenFOAM.
    evolve-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/evolve-closure.py
      args:
        - --generations
        - "6"
        - --population
        - "14"
        - --x-stride
        - "12"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/grammar.py
        - pypkg/evolve.py
      outputs:
        - path: results/closure-evolution.json
          storage: git
      description: >
        Evolve the structure of the activation source term, varying which
        operators and derived quantities appear rather than only the
        coefficients on a fixed set of terms. Reports a Pareto front of error
        against term count.
    fit-openfoam-coeffs:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-openfoam-coeffs.py
      args:
        - --n-random
        - "500"
        - --n-refine
        - "250"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/clip-k-gamma-coeffs.json
          storage: git
      description: >
        Fit the transported-omega form of the closure, which is what the
        OpenFOAM model implements. Coefficients fitted for the mixing-length
        form are not transferable to it.
    analyze-flow-structure:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-flow-structure.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/flow-structure.json
          storage: git
      description: >
        Structural diagnostics: coherence versus energy partition, total
        correlation in bits, component entropy, Lumley invariants, and the
        misalignment between the stress anisotropy and the mean strain. These
        measure how much structure the flow carries rather than how much
        energy, which is what distinguishes transition from mere loudness.
    analyze-exergy-budget:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-exergy-budget.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/exergy-budget.json
          storage: git
      description: >
        Thermodynamic budget of the transitional boundary layer: exergy input,
        immediate (direct viscous) entropy rejection, rejection buffered
        through the turbulent reservoir, and the storage that results when
        rejection cannot keep up with injection.
    analyze-streak-reservoir:
      kind: python-script
      environment: py-viz
      script_path: scripts/analyze-streak-reservoir.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - path: results/streak-reservoir.json
          storage: git
        - path: figures/streak-reservoir.pdf
      description: >
        Measure the pre-transitional streak reservoir a priori from the DNS --
        the fluctuation-energy budget, the implied eddy viscosity and
        structure parameter, and the vorticity Reynolds number the clip fires
        on -- and compare it with what the closure actually produces. The
        mean-field objective cannot see this, so a model can lose the
        reservoir the closure is built on and still score well on skin
        friction.
    analyze-energy-flux:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-energy-flux.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - pypkg/dns_case.py
      outputs:
        - path: results/energy-flux.json
          storage: git
      description: >
        Integral energy-flux budget. The integrated dissipation is measured
        from the exact steady k balance rather than modeled, since transport
        terms are internal and cancel. Reports the dissipation coefficient
        C_eps = eps*L/u'^3, which every equilibrium closure treats as a
        constant: it holds to 1.5 percent in the turbulent region and in an
        independent turbulent DNS, but varies roughly sevenfold through
        transition, so the cascade there is not in equilibrium.
    regress-pde-terms:
      kind: python-script
      environment: py-compute
      script_path: scripts/regress-pde-terms.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - pypkg/dns_case.py
      outputs:
        - path: results/pde-term-regression.json
          storage: git
      description: >
        A-priori least squares over a library of closure terms computed
        directly from the DNS, for both the Reynolds shear stress and the
        unclosed residual of the k budget. Reports in-sample fit against
        transfer across flow regions and across an independent DNS, plus a
        guard against the trivial solution where a library column is itself
        essentially the target. In-sample R^2 near 0.95 is easy and means
        nothing; only the transfer tests distinguish a constitutive law from a
        curve fit.
    build-transport-targets:
      kind: python-script
      environment: py-compute
      script_path: scripts/build-transport-targets.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jhtdb-transitional-bl/gradient-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/crs-separation-bubble
        - pypkg/dns_case.py
        - pypkg/cases/channel.py
        - pypkg/cases/jimenez_zpg.py
      outputs:
        - results/transport-targets.h5
        - path: results/transport-targets-summary.json
          storage: git
      description: >
        Fields of k and of two candidate omegas on every DNS case, for
        discovering their transport equations: eps/(beta* k) where the DNS
        has the dissipation, and k/nu_t with nu_t the Boussinesq projection of
        the DNS shear stress everywhere. Their ratio is C_mu,eff/0.09, so the
        summary says where one omega can serve both the dissipation and the
        stress, before any regression.
    fit-transport-equations:
      kind: python-script
      environment: py-sindy
      script_path: scripts/fit-transport-equations.py
      inputs:
        - results/transport-targets.h5
      outputs:
        - path: results/transport-equation-fit.json
          storage: git
      description: >
        Bagged sparse regression (PySINDy STLSQ) of an omega equation in the
        implicit form, destruction fixed, over a library of SST's terms plus
        candidates, for both omega targets. Reports how often each term is
        selected with each flow family held out and the held-out error against
        SST's terms refitted, SST's published coefficients, and the two columns
        that depend on the structure parameter alone, which guard against
        rediscovering that -uv/k is nearly constant.
    analyze-transition-mechanics:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-transition-mechanics.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/transition-mechanics.json
          storage: git
      description: >
        Integral balances and saturation through bypass transition on the
        plate, for the overdriven-amplifier questions: whether the peak
        vorticity Reynolds number clips at a ceiling, whether production per
        unit fluctuation energy falls as the streaks saturate, and where the
        integral dissipation coefficient leaves its laminar value relative to
        the Re_v threshold and the linear critical Reynolds number.
    analyze-spanwise-lines:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-spanwise-lines.py
      inputs:
        - data/jhtdb-transitional-bl/spanwise-lines.h5
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/energy-flux.json
        - results/transition-mechanics.json
        - pypkg/dns_case.py
      outputs:
        - path: results/spectral-entropy.json
          storage: git
      description: >
        Spanwise spectra through bypass transition from the JHTDB lines: the
        spectral entropy against the pre-set monotonicity and in-step tests,
        and exploratory measures whose tests were fixed before they were
        computed (entropy over delta-scaled wavelength bands, harmonics of the
        streak wavenumber, collapse on the turbulence Reynolds number), plus
        the true dissipation and the effective C_mu at each sampled point.
    analyze-bypass-onset:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-bypass-onset.py
      inputs:
        - data/wu-bypass-transition
      outputs:
        - path: results/bypass-onset.json
          storage: git
      description: >
        Transition onset against inlet free-stream intensity across Wu et
        al.'s five DNS: the exponent of Re_x,t against Tu, which a fixed
        disturbance headroom with lift-up gain puts near 2, and the peak
        vorticity Reynolds number at onset, which a threshold on the Reynolds
        number alone would hold constant.
    fit-threshold-law:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-threshold-law.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/transition-mechanics.json
        - results/bypass-onset.json
        - results/inlet-profiles.json
        - pypkg/dns_case.py
      outputs:
        - path: results/threshold-law.json
          storage: git
      description: >
        A transition threshold that falls with free-stream intensity, fitted
        as a power law on Wu et al.'s DNS and tested on the JHTDB plate, which
        it never saw: in the local intensity at onset as set in advance, and,
        exploratory, in the inlet intensity.
    measure-fit-noise:
      kind: python-script
      environment: py-compute
      script_path: scripts/measure-fit-noise.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/fit-noise.json
          storage: git
      description: >
        Fit each structural variant several times under an identical protocol,
        varying only the random seed, and compare the spread of the resulting
        scores with the gaps between structures. Ranking structures by their
        inner coefficient fit is only evidence if that fit is converged; this
        stage measures whether it is.
    ablate-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/ablate-closure.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - path: results/closure-ablation.json
          storage: git
      description: >
        Remove one ingredient at a time from the fitted closure and re-score,
        to establish which terms are load-bearing and which are decorative.
    fit-momentum-library:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-momentum-library.py
      args:
        - --fit-cases
        - jhtdb-transitional-bl
        - --n-init
        - "12"
        - --n-iter
        - "60"
        - --out
        - results/momentum-library.json
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/jaxa-shear-layer-vortex
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/momentum_library.py
        - pypkg/bayesopt.py
        - pypkg/dns_case.py
        - pypkg/cases
      outputs:
        - path: results/momentum-library.json
          storage: git
      description: >
        Fit the six momentum-library coefficients on the calibration plate
        alone by Bayesian optimization of the a-posteriori benchmark score,
        then score the result on every case. This is the single-case fit whose
        transfer penalty the multi-case fit below is compared with.
    fit-momentum-library-multi:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-momentum-library.py
      args:
        - --fit-cases
        - jhtdb-transitional-bl,jimenez-zpg-tbl,channel-retau-1000,temporal-mixing-layer
        - --n-init
        - "12"
        - --n-iter
        - "48"
        - --out
        - results/momentum-library-multi.json
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/jaxa-shear-layer-vortex
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/momentum_library.py
        - pypkg/bayesopt.py
        - pypkg/dns_case.py
        - pypkg/cases
      outputs:
        - path: results/momentum-library-multi.json
          storage: git
      description: >
        The same library fitted jointly on four cases in four geometries,
        which is the experiment the benchmark exists to make routine: one
        coefficient set, several flows, and the in-sample accuracy it costs
        reported next to the out-of-sample gain.
    run-benchmark:
      kind: python-script
      environment: py-compute
      script_path: scripts/run-benchmark.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/jaxa-shear-layer-vortex
        - results/closure-params.json
        - results/clip-k-gamma-coeffs.json
        - results/momentum-library.json
        - results/momentum-library-multi.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/momentum_library.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/benchmark.json
          storage: git
      description: >
        The benchmarking harness. Runs every registered closure against every
        registered case and writes a leaderboard that separates in-sample from
        out-of-sample scores, using each closure's declared calibration case.
        The separation is the point: this project's own finding is that
        in-sample agreement did not distinguish a constitutive law from a
        curve fit, so a single aggregate score would rebuild the trap. Adding
        a new closure or case means registering it, not editing this stage.
    measure-tier-discrepancy:
      kind: python-script
      environment: py-compute
      script_path: scripts/measure-tier-discrepancy.py
      inputs:
        - results/benchmark.json
        - results/dns-domain-vs-dns.json
        - results/openfoam-vs-dns.json
      outputs:
        - path: results/tier-discrepancy.json
          storage: git
      description: >
        Pair every closure that ran on the plate in both tiers and
        characterize the screening bias of the parabolic solver against the
        elliptic one, which is the ingredient a multi-fidelity coefficient
        optimization needs (ideas-log 7.4). A characterization, not a
        surrogate: the tiers report slightly different skin-friction
        metrics and only a few closures exist in both.
    run-benchmark-openfoam:
      kind: python-script
      environment: py-compute
      script_path: scripts/run-benchmark.py
      args:
        - --tier
        - openfoam
        - --out
        - results/benchmark-openfoam.json
        - --parallel
        - "8"
      inputs:
        - data/closure-challenge
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
        - pypkg/closures.py
        - pypkg/registry.py
        - pypkg/cases/openfoam.py
        - pypkg/cases/base.py
      outputs:
        - path: results/benchmark-openfoam.json
          storage: git
      description: >
        The Tier-2 benchmark: every closure with an OpenFOAM model run with
        simpleFoam on the Closure Challenge's DNS cases -- four parameterized
        periodic hills and four ducts -- and scored against the DNS at the
        challenge's evaluation points. Separate from the fast tier because a
        run is minutes rather than seconds, and because the published
        baselines (SST, gamma-Re_theta, kkL-omega) exist only here. The solver
        runs through calkit xenv in the blsim environment, so the Docker
        toolchain is the environment of record even though the stage itself is
        a Python script.
    plot-closure-comparison:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot-closure-comparison.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/closure-params.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - figures/closure-comparison.pdf
    build-turbulence-lib:
      kind: shell-command
      environment: blsim
      command: bash sim/build-model.sh
      inputs:
        - sim/build-model.sh
        - sim/newModel/src
        - sim/newModel/solver
      outputs:
        - sim/newModel/platforms
      description: >
        Compile the custom turbulence models into the working tree. Kept out
        of the Docker image on purpose: baking them in would make every model
        edit change the environment lock and invalidate unrelated results.
    make-inlet-profiles:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-inlet-profiles.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/inlet-profiles.json
          storage: git
      description: >
        Inlet U and k profiles taken from the DNS inlet station itself, plus
        the inlet omega fitted per model destruction coefficient and the
        Langtry-Menter ReThetat from its own correlation. Prescribing the DNS
        inlet is what makes the RANS solve the same problem the DNS solved.
    dns-domain-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-dns-domain.sh {model} 80 79
      iterate_over:
        - arg_name: model
          values:
            - clip-k-gamma
            - k-omega-sst-lm
            - kkl-omega
            - kkl-omega-seeded
            - k-omega-sst
            - laminar
      inputs:
        - sim/run-dns-domain.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict-dns.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
        - results/inlet-profiles.json
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
      outputs:
        - sim/cases/{model}-dns-domain/postProcessing
      description: >
        Every model on the domain matched to the DNS, with the measured inlet
        profile. This is the like-for-like comparison: the previous domain
        gave the free stream 127 units of decay the DNS never had, which
        forced a 20 percent inlet turbulence intensity and tripped the
        transition baselines at the leading edge.
    compare-dns-domain:
      kind: python-script
      environment: py-viz
      script_path: scripts/compare-openfoam-dns.py
      args:
        - --cases
        - sim/cases/clip-k-gamma-dns-domain
        - sim/cases/k-omega-sst-lm-dns-domain
        - sim/cases/kkl-omega-dns-domain
        - sim/cases/kkl-omega-seeded-dns-domain
        - sim/cases/k-omega-sst-dns-domain
        - sim/cases/laminar-dns-domain
        - --labels
        - clip-k-gamma
        - k-omega-sst-lm
        - kkl-omega
        - kkl-omega-seeded
        - k-omega-sst
        - laminar
        - --out-json
        - results/dns-domain-vs-dns.json
        - --out-fig
        - figures/dns-domain-vs-dns.pdf
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - scripts/compare-openfoam-dns.py
        - sim/cases/clip-k-gamma-dns-domain/postProcessing
        - sim/cases/k-omega-sst-lm-dns-domain/postProcessing
        - sim/cases/kkl-omega-dns-domain/postProcessing
        - sim/cases/kkl-omega-seeded-dns-domain/postProcessing
        - sim/cases/k-omega-sst-dns-domain/postProcessing
        - sim/cases/laminar-dns-domain/postProcessing
        - pypkg/dns_case.py
      outputs:
        - path: results/dns-domain-vs-dns.json
          storage: git
        - figures/dns-domain-vs-dns.pdf
      description: >
        Score every model against the DNS on the DNS-matched domain. This is
        the comparison that decides whether the closure is an improvement on
        the state of the art.
    plot:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot.py
      inputs:
        - results/energy-flux.json
        - results/pde-term-regression.json
        - results/fit-noise.json
        - results/dns-domain-vs-dns.json
      outputs:
        - figures/dissipation.pdf
        - figures/transfer.pdf
        - figures/collapse.pdf
        - figures/fit-noise.pdf
        - figures/model-comparison.pdf
      description: >
        Figures backing each claim in the paper, drawn from the same results
        files the text quotes so a figure cannot drift from the number beside
        it.
    fit-baseline-freestream:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-baseline-freestream.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/baseline-freestream-bcs.json
          storage: git
      description: >
        Fit inlet k and omega for each baseline model to the same measured DNS
        free-stream decay our own closure was fitted to. Bypass transition is
        driven by the free-stream turbulence, so leaving the baselines at
        arbitrary defaults while ours are tuned would decide the comparison
        before it started.
    baseline-transition-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-baseline-transition.sh {model} 80 500
      iterate_over:
        - arg_name: model
          values:
            - k-omega-sst
            - k-omega-sst-lm
            - kkl-omega
      inputs:
        - sim/run-baseline-transition.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
        - results/baseline-freestream-bcs.json
      outputs:
        - sim/cases/{model}-wall-resolved/postProcessing
      description: >
        State-of-the-art baselines on the same wall-resolved mesh: k-omega SST
        (the standard workhorse), the Langtry-Menter gamma-Re_theta transition
        model, and Walters-Cokljat kkLOmega, whose laminar kinetic energy is
        the closest published relative of our streak reservoir.
    baseline-wall-resolved-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-baseline-wall-resolved.sh {turbulence} 80 500
      iterate_over:
        - arg_name: turbulence
          values: [k-epsilon, laminar]
      inputs:
        - sim/run-baseline-wall-resolved.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
      outputs:
        - sim/cases/{turbulence}-wall-resolved/postProcessing
      description: >
        Baselines on the same wall-resolved mesh as the clipping closure, so
        the DNS comparison is like for like.
    clip-k-gamma-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-clip-k-gamma.sh 80 500
      inputs:
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
        - sim/run-clip-k-gamma.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
      outputs:
        - sim/cases/clip-k-gamma-ny-80/postProcessing
      description: >
        Run the discovered clipping closure in OpenFOAM on a wall-resolved
        mesh (first cell y+ < 1), which the default grading of 8 does not
        provide.
    compare-openfoam-dns:
      kind: python-script
      environment: py-viz
      script_path: scripts/compare-openfoam-dns.py
      args:
        - --cases
        - sim/cases/clip-k-gamma-ny-80
        - sim/cases/k-omega-sst-lm-wall-resolved
        - sim/cases/kkl-omega-wall-resolved
        - sim/cases/k-omega-sst-wall-resolved
        - sim/cases/k-epsilon-wall-resolved
        - sim/cases/laminar-wall-resolved
        - --labels
        - clip-k-gamma
        - k-omega-sst-lm
        - kkl-omega
        - k-omega-sst
        - k-epsilon
        - laminar
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - sim/cases/clip-k-gamma-ny-80/postProcessing
        - sim/cases/k-omega-sst-lm-wall-resolved/postProcessing
        - sim/cases/kkl-omega-wall-resolved/postProcessing
        - sim/cases/k-omega-sst-wall-resolved/postProcessing
        - sim/cases/k-epsilon-wall-resolved/postProcessing
        - sim/cases/laminar-wall-resolved/postProcessing
        - pypkg/dns_case.py
      outputs:
        - path: results/openfoam-vs-dns.json
          storage: git
        - figures/openfoam-vs-dns.pdf
      description: >
        Score the elliptic OpenFOAM solution against the DNS at every sampled
        station. This is the a-posteriori test that counts; the parabolic
        solver is only the screening fidelity.
    make-paper-numbers:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-paper-numbers.py
      inputs:
        - results/energy-flux.json
        - results/pde-term-regression.json
        - results/fit-noise.json
        - results/dns-domain-vs-dns.json
        - results/openfoam-vs-dns.json
        - results/inlet-profiles.json
      outputs:
        - path: results/paper-numbers.json
          storage: git
      description: >
        Select and flatten the leaf values the manuscript quotes out of the
        nested results files. Flattening is needed because json-to-latex
        resolves top-level keys only.
    paper-numbers-to-latex:
      kind: json-to-latex
      environment: _system
      command_name: result
      inputs:
        - results/paper-numbers.json
      outputs:
        - path: paper/generated-numbers.tex
          storage: git
      description: >
        Turn the flat results JSON into a single keyed LaTeX command, so the
        manuscript refers to values as \result[key] and re-running the
        pipeline updates every number in the text automatically.
    findings-to-latex:
      kind: json-to-latex
      environment: _system
      command_name: finding
      inputs:
        - results/findings.json
      outputs:
        - path: paper/generated-findings.tex
          storage: git
      format:
        misalignment_deg_pretransition: "{misalignment_deg_pretransition:.0f}"
        misalignment_deg_turbulent: "{misalignment_deg_turbulent:.0f}"
        coherence_ratio: "{coherence_ratio:.1f}"
        anisotropy_ratio: "{anisotropy_ratio:.1f}"
        total_correlation_ratio: "{total_correlation_ratio:.0f}"
        total_correlation_bits_laminar: "{total_correlation_bits_laminar:.3f}"
        total_correlation_bits_turbulent: "{total_correlation_bits_turbulent:.3f}"
        entropy_min: "{entropy_min:.2f}"
        entropy_min_x: "{entropy_min_x:.0f}"
        peak_turbulent_storage_pct: "{peak_turbulent_storage_fraction * 100:.0f}"
        peak_turbulent_storage_x: "{peak_turbulent_storage_x:.0f}"
        turbulent_rejection_fraction_low_Re: "{turbulent_rejection_fraction_low_Re:.3f}"
        turbulent_rejection_fraction_high_Re: "{turbulent_rejection_fraction_high_Re:.3f}"
        ablation_reference_cf_pct: "{ablation_reference_cf_rel_rms * 100:.1f}"
        ablation_no_clip_cf_pct: "{ablation_no_clip_cf_rel_rms * 100:.0f}"
        ablation_no_liftup_cf_pct: "{ablation_no_liftup_cf_rel_rms * 100:.0f}"
        ablation_classical_threshold_cf_pct: "{ablation_classical_threshold_cf_rel_rms
          * 100:.1f}"
        baseline_k_epsilon_cf_pct: "{baseline_k_epsilon_cf_rel_rms * 100:.0f}"
        fitted_threshold_Lambda_c: "{fitted_threshold_Lambda_c:.0f}"
        screening_solver_cf_error_pct: "{screening_solver_cf_error_max * 100:.1f}"
        mixing_layer_best_normalized: "{mixing_layer_best_normalized:.2f}"
        mixing_layer_launder_sharma_normalized: "{mixing_layer_launder_sharma_normalized:.2f}"
        mixing_layer_clip_k_omega_gamma_dtheta_pct: "{mixing_layer_clip_k_omega_gamma_dtheta_rel_rms
          * 100:.0f}"
        benchmark_launder_sharma_out_of_sample_mean: "{benchmark_launder_sharma_out_of_sample_mean:.2f}"
        benchmark_clip_k_gamma_in_sample_mean: "{benchmark_clip_k_gamma_in_sample_mean:.2f}"
        benchmark_clip_k_gamma_out_of_sample_mean: "{benchmark_clip_k_gamma_out_of_sample_mean:.2f}"
        benchmark_clip_k_gamma_transfer_penalty: "{benchmark_clip_k_gamma_transfer_penalty:.2f}"
        benchmark_clip_k_omega_gamma_in_sample_mean: "{benchmark_clip_k_omega_gamma_in_sample_mean:.2f}"
        benchmark_clip_k_omega_gamma_out_of_sample_mean: "{benchmark_clip_k_omega_gamma_out_of_sample_mean:.2f}"
        benchmark_clip_k_omega_gamma_transfer_penalty: "{benchmark_clip_k_omega_gamma_transfer_penalty:.2f}"
        momentum_library_single_best_objective: "{momentum_library_single_best_objective:.2f}"
        momentum_library_single_base_in_sample: "{baseline_ls_plate:.2f}"
        momentum_library_single_out_of_sample_mean: "{momentum_library_single_out_of_sample_mean:.2f}"
        momentum_library_single_base_out_of_sample_mean: "{momentum_library_single_base_out_of_sample_mean:.2f}"
        momentum_library_single_n_evaluations: "{momentum_library_single_n_evaluations}"
        momentum_library_multi_best_objective: "{momentum_library_multi_best_objective:.2f}"
        momentum_library_multi_n_evaluations: "{momentum_library_multi_n_evaluations}"
        momentum_library_multi_n_diverged: "{momentum_library_multi_n_diverged}"
        tier2_k_omega_sst_lm_out_of_sample_mean: '{tier2_k_omega_sst_lm_out_of_sample_mean:.2f}'
        tier2_k_omega_sst_out_of_sample_mean: '{tier2_k_omega_sst_out_of_sample_mean:.2f}'
        tier2_kkl_omega_out_of_sample_mean: '{tier2_kkl_omega_out_of_sample_mean:.2f}'
        tier2_clip_k_omega_gamma_out_of_sample_mean: '{tier2_clip_k_omega_gamma_out_of_sample_mean:.2f}'
        tier2_laminar_out_of_sample_mean: '{tier2_laminar_out_of_sample_mean:.2f}'
        tier2_launder_sharma_n_diverged: '{tier2_launder_sharma_n_diverged}'
        tier2_clip_k_omega_gamma_duct_mean: '{tier2_clip_k_omega_gamma_duct_mean:.1f}'
        tier2_clip_k_omega_gamma_hill_mean: '{tier2_clip_k_omega_gamma_hill_mean:.1f}'
        tier2_n_cases: '{tier2_n_cases}'
        tier2_laminar_duct_mean: '{tier2_laminar_duct_mean:.1f}'
        tier_cf_bias_geometric_mean: '{tier_cf_bias_geometric_mean:.1f}'
      description: >
        Every headline number from findings.json as a \finding[key] command
        for the paper, rounded here so the manuscript quotes the same
        precision everywhere. Complements paper-numbers-to-latex, which
        carries the numbers selected by make-paper-numbers.
    make-benchmark-tables:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-benchmark-tables.py
      inputs:
        - results/benchmark.json
        - results/benchmark-openfoam.json
        - pypkg/registry.py
        - pypkg/closures.py
        - pypkg/cases
      outputs:
        - path: paper/generated-tables.tex
          storage: git
      description: Write the paper's case, closure and score tables from the registries
        and the two benchmark files, so the manuscript covers every case and closure
        by construction and cannot fall behind the suite.
    build-paper:
      kind: latex
      environment: texlive
      target_path: paper/main.tex
      provenance: true
      inputs:
        - paper/generated-tables.tex
        - paper/generated-findings.tex
        - figures/dissipation.pdf
        - figures/transfer.pdf
        - figures/collapse.pdf
        - figures/fit-noise.pdf
        - figures/model-comparison.pdf
        - paper/generated-numbers.tex
        - paper/main.tex
        - figures/bl-profile-dns.pdf
        - references.bib
      outputs:
        - paper/main.pdf
      description: >
        Build the paper with provenance markers: every injected value, figure
        and question block is colored and linked to its source, and
        paper/main.provenance.json records where each one came from.
    summarize-findings:
      kind: python-script
      environment: py-compute
      script_path: scripts/summarize-findings.py
      inputs:
        - results/closure-search.json
        - results/flow-structure.json
        - results/closure-ablation.json
        - results/clip-k-gamma-coeffs.json
        - results/openfoam-vs-dns.json
        - results/exergy-budget.json
        - results/blasius-validation.json
        - results/closure-evolution.json
        - results/benchmark.json
        - results/momentum-library.json
        - results/momentum-library-multi.json
        - results/benchmark-openfoam.json
        - results/tier-discrepancy.json
      outputs:
        - path: results/findings.json
          storage: git
      description: >
        Aggregate the headline numbers from every other stage into one flat
        file, so the answers recorded against the project questions are backed
        by pipeline output rather than by hand-typed values.
    evolve-model:
      kind: shell-command
      environment: blsim
      command: bash sim/run-evolve-model.sh
      inputs:
        - sim/run-evolve-model.sh
        - data/jhtdb-transitional-bl/all-stats.h5
        - sim/evolve-model.py
        - sim/run.py
        - sim/constant/turbulenceProperties.template
        - sim/newModel/src/ransFromDns/ransFromDns.C
        - sim/newModel/src/ransFromDns/ransFromDns.H
      outputs:
        - path: results/model-evolution.json
          storage: git
        - path: results/model-params.json
          storage: git
    map-paths-paper:
      kind: map-paths
      paths:
        - kind: dir-to-dir-merge
          src: figures
          dest: paper/figures
references:
  - path: references.bib
    kind: bibtex
    files:
      - path: references/README-transition_bl.pdf
        key: JHTDBDescription
      - path: references/SLWCS_TCFD_Vortex_Part2_2026.pdf
        key: Sansica2026

software:
  - title: OpenFOAM RANS model
    path: sim/newModel
    description: >
      A new RANS model extracted from the DNS results, written in the

      OpenFOAM framework.
    repo_url: # TODO: Define this so it can be reused?

notebooks:
  - path: notebooks/main.ipynb
    stage: run-notebook
    title: Main
    description: >
      This is the main notebook used to explore the data, develop scripts,

      etc.
