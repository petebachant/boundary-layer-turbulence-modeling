# Answers are quoted from pipeline outputs; each `evidence` entry names the
# file and key that backs it, so nothing here can drift from what was
# actually computed. See docs/ideas-log.md for reasoning and dead ends, and
# docs/clipping-closure.md for the full investigation.
questions:
  - question:
      Can we add some new terms to the steady RANS equations to make the mean
      flow match DNS data?
    hypothesis:
      A closure with a threshold, rather than extra smooth terms, is needed,
      because no k-epsilon coefficient set makes the laminar state a fixed point of
      the model.
    answer:
      Yes. Adding a transported activation fraction with a rectified (clipping)
      source to k-omega reduces mean velocity error against DNS by 4.1x versus k-epsilon
      and 2.8x versus laminar, in the elliptic OpenFOAM solver on a wall-resolved
      mesh.
    evidence:
      - kind: result
        path: results/findings.json
        key: openfoam_improvement_over_k_epsilon
        explanation:
          Ratio of k-epsilon to clipping-closure mean velocity error, both
          run in OpenFOAM on the same mesh against the same DNS.
      - kind: result
        path: results/openfoam-vs-dns.json
        explanation: Per-station velocity and pressure errors for all three models.
      - kind: figure
        path: figures/openfoam-vs-dns.pdf
        explanation: Velocity profiles against DNS across all three flow regimes.
  - question:
      Can we model what happens at a finer scale (the Reynolds stress) as
      a function of what happens at a coarser scale (the mean flow)?
    hypothesis:
      A scalar eddy viscosity relating the Reynolds stress to the mean strain
      is sufficient.
    answer:
      Only partly, and we can now say where it fails. The eigenframes of the
      stress anisotropy and the mean strain are misaligned by 44 degrees before transition
      and still by 21-24 degrees in equilibrium turbulence, so an eddy viscosity is
      structurally wrong in the pre-transitional region and imperfect everywhere.
      This is a quantitative bound on any eddy-viscosity closure, ours included.
    evidence:
      - kind: result
        path: docs/ideas-log.md
        explanation:
          Section 3.1. NOT YET A PIPELINE STAGE - the measurement exists
          but must be promoted to a stage before it is cited in the paper.
  - question:
      Is the clipping analogy - that a flow holds more energy than smooth
      waves can carry, so it clips and redistributes into higher harmonics - load-bearing,
      or decorative?
    hypothesis: It is decorative, and the model works because of its other terms.
    answer:
      Load-bearing, and the hypothesis is refuted. Removing the rectifier takes
      skin-friction error from 4.2 to 62 percent, no better than k-epsilon at 56 percent,
      while removing any other term changes the score only in the third decimal. Two
      auxiliary terms can be deleted outright.
    evidence:
      - kind: result
        path: results/findings.json
        key: ablation_no_clip_cf_rel_rms
        explanation: Skin-friction error with the rectifier removed.
      - kind: result
        path: results/closure-ablation.json
        explanation: Full term-by-term ablation of the fitted closure.
  - question: Which local quantity should carry the transition threshold?
    answer:
      The vorticity Reynolds number Re_v = y^2*Omega/nu. All four Re_v variants
      beat every alternative driver tested, and the fitted threshold of 441, searched
      over the range 150 to 900, scores within 0.001 of the classical value of 440
      - so no bespoke constant is needed.
    evidence:
      - kind: result
        path: results/findings.json
        key: fitted_threshold_Lambda_c
        explanation: Fitted critical vorticity Reynolds number.
      - kind: result
        path: results/closure-search.json
        explanation: Ranked structural variants over four candidate drivers.
  - question:
      Does transition redistribute energy between velocity components, or
      create correlation between them?
    hypothesis:
      Transition is an energy redistribution from streamwise into wall-normal
      and spanwise components.
    answer:
      Correlation, not redistribution. Decomposing the structure parameter into
      coherence times energy partition, the u-v correlation coefficient rises 3.3x
      while the partition changes only 1.3x. Equivalently the information shared between
      velocity components rises 11.4x, from 0.013 to 0.153 bits, while the energy
      grows only 2.4x.
    evidence:
      - kind: result
        path: docs/ideas-log.md
        explanation:
          Sections 1.4 and 1.5. NOT YET A PIPELINE STAGE - promote before
          citing.
  - question: Can entropy alone serve as the closure variable?
    hypothesis:
      Transition can be modelled as entropy production in the fluctuation
      field, so a transported entropy would close the system.
    answer:
      No. The component entropy of the energy partition is non-monotone, falling
      from 1.074 to a minimum of 0.499 at x=233 before recovering, so the constitutive
      relation is hysteretic rather than single-valued. Implemented as a closure it
      scores 1.02 against the clipping model 0.44, because a smooth relaxation balance
      cannot hold the laminar state. Entropy is a good diagnostic and a poor substitute
      for the threshold.
    evidence:
      - kind: result
        path: docs/ideas-log.md
        explanation: Section 2.1, including the implemented EntropyKOmegaH model.
  - question:
      If entropy cannot be rejected as fast as the wall injects exergy, is
      the excess stored in the turbulence?
    hypothesis:
      Turbulence acts as a buffer between exergy injection and entropy rejection,
      and the buffering matters most where the two are most out of balance.
    answer:
      Yes, and it is a transient of transition rather than a standing inventory.
      Storage peaks at 24 percent of the energy routed into turbulence at x=246, against
      a transition onset of x=233, then collapses to 2-3 percent. Reservoir residence
      time falls from 79 to 4.2 flow times. The turbulent share of entropy rejection
      also rises with Reynolds number, from 0.520 to 0.559 over Re_theta 831 to 1391.
    evidence:
      - kind: result
        path: results/findings.json
        key: peak_turbulent_storage_fraction
        explanation: Peak stored fraction of the energy routed into turbulence.
      - kind: result
        path: results/exergy-budget.json
        explanation:
          Exergy input, direct versus turbulent rejection, storage rate,
          and Reynolds-number dependence.
  - question:
      Can a search discover the closure structure rather than have us impose
      it?
    answer:
      Partly. All eight top structures found by the evolutionary search use
      the rectifier, having been free to choose smooth alternatives, which is independent
      support for the clipping hypothesis. But the search stagnated after its initial
      random population, so this is a sanity check rather than a thorough exploration.
    evidence:
      - kind: result
        path: results/findings.json
        key: evolved_top8_using_rectifier
        explanation:
          How many of the top eight evolved structures use the hard rectifier,
          out of eight.
      - kind: result
        path: results/closure-evolution.json
        explanation: Full archive of evolved structures and the Pareto front.
  - question:
      Is the parabolic screening solver accurate enough to rank closures against
      each other?
    answer:
      Yes. It reproduces the Blasius similarity solution to within 1.3 percent
      in skin friction, well below the differences between the models it is used to
      rank, and the bias is systematic so comparisons stay fair.
    evidence:
      - kind: result
        path: results/findings.json
        key: screening_solver_cf_error_max
        explanation: Maximum skin-friction error against the Blasius solution.
  - question:
      Does the transition threshold depend on the free-stream turbulence level,
      as it physically must?
    hypothesis: Higher free-stream turbulence should lower the critical Reynolds number.
    answer:
      OPEN, and this is the most important gap. Everything here is calibrated
      on a single DNS at one turbulence level, so the dependence cannot be seen at
      all. The fitted omega destruction coefficient of 0.1, against a standard 0.072,
      is a single-case compensation that should not be trusted until a second flow
      tests it.
  - question:
      Can we write an evolution equation for a structure variable such as
      Q or lambda_2, rather than for an energy - discovered from an advection-diffusion
      skeleton plus coupling terms from the mean momentum and continuity equations?
    answer:
      OPEN. Needs fluctuating velocity gradients, which requires a new JHTDB
      pull. See docs/ideas-log.md section 3.
  - question:
      Do the Reynolds stress transport terms proposed in notebook.ipynb -
      a*laplacian(R) + b*U*grad(P) + c*grad(U) + d*U*grad(K) + e*grad(P)*grad(P) -
      outperform the activation approach?
    answer:
      OPEN. These were written down but never tested against a forward solve.
      Two of them, a*grad(K) and b*(grad(U) dot grad(P)), are currently hard-coded
      into sim/newModel/solver/UEqn.H with fixed coefficients, which silently modifies
      the momentum equation for any model run through that solver.

datasets:
  # This is an imported dataset, and currently it's virtual since it doesn't
  # actually exist in the system
  - path: data/jhtdb-transitional-bl/raw
    imported_from: jhtdb/transitional-boundary-layer-dns/data
  - path: data/jhtdb-transitional-bl/time-ave-profiles.h5
    title: Time-averaged data
    description: Time-averaged data downloaded from the JHTDB website.
  # This dataset is an output of a stage in the DVC pipeline
  # We will need to DVC pull it to read
  # Could we just detect this automatically, or is the point to register it in
  # the database so it is declared as a dataset, which could be reused?
  - path: data/jhtdb-transitional-bl/all-stats.h5
    title: All stats
    description: Stats computed at many points in the flow over all time.
    derived_from:
      - jhtdb/transitional-boundary-layer-dns/data
    tabular: true
    stage: extract-jhtdb-stats
  - path: data/jiminez
    imported_from: jiminez/boundary-layer-dns
  - path: sim/results/time-ave-profile.csv
    title: Boundary layer computed with RANS
    stage: run-rans-sim
  - path: results/coeffs.json
    title: Derived coefficients
    description: These coefficients are those for the new RANS terms.
    stage: compute-coeffs
  - path: results/model-evolution.json
    title: Turbulence model evolution history
    description: Iteration history while evolving RANS model coefficients.
    stage: evolve-model
  - path: results/model-params.json
    title: Best-fit turbulence model coefficients
    description: Best coefficients discovered for the ransFromDns model.
    stage: evolve-model
  - path: sim/postProcessing
    title: Mean profiles from RANS simulation
    stage: sample-rans-sim
  - path: results/blasius-validation.json
    title: Screening solver validation
    description: >
      Parabolic solver skin friction against the Blasius similarity solution.
    stage: validate-bl-solver
  - path: results/closure-search.json
    title: Closure structural search results
    description: >
      Ranked structural variants of the clipping closure with their best-fit
      coefficients and errors against the DNS, plus laminar and k-epsilon
      baselines for reference.
    stage: discover-closure
  - path: results/closure-params.json
    title: Best discovered closure
    description: The winning closure structure and its fitted coefficients.
    stage: discover-closure
  - path: results/openfoam-vs-dns.json
    title: OpenFOAM versus DNS errors
    description: Per-station velocity and pressure errors for each OpenFOAM case.
    stage: compare-openfoam-dns
  - path: results/clip-k-gamma-coeffs.json
    title: OpenFOAM closure coefficients
    description: >
      Coefficients for the transported-omega form of the closure, named as
      the OpenFOAM turbulenceProperties dictionary expects them.
    stage: fit-openfoam-coeffs
  - path: results/findings.json
    title: Headline findings
    description: >
      Flat key/value summary of the headline numbers, cited as evidence by the
      answers recorded against the project questions.
    stage: summarize-findings
  - path: results/exergy-budget.json
    title: Exergy and entropy budget
    description: >
      Exergy injection, direct versus turbulent entropy rejection, and
      turbulent energy storage through transition.
    stage: analyze-exergy-budget
  - path: results/closure-ablation.json
    title: Closure term ablation
    description: >
      Effect of removing each term from the fitted closure, establishing which
      ingredients actually matter.
    stage: ablate-closure
  - path: results/closure-evolution.json
    title: Evolved closure structures
    description: >
      Archive of every PDE structure tried by the evolutionary search, with a
      Pareto front of error against number of terms.
    stage: evolve-closure

figures:
  - path: figures/bl-profile-dns.pdf
    title: The boundary layer profile from DNS data
    description: The mean boundary layer profile computed from the DNS data.
    stage: plot-bl-dns
    data:
      - data/jhtdb-transitional-bl/all-stats.h5
  - path: figures/rans-mesh-snapshot-isometric.png
    title: RANS simulation mesh snapshot
    description: A snapshot of the RANS simulation mesh.
    stage: save-mesh-snapshot-isometric
  - path: figures/openfoam-vs-dns.pdf
    title: OpenFOAM profiles against DNS
    description: >
      Velocity profiles from the elliptic OpenFOAM solution compared with the
      DNS across the laminar, transitional and turbulent regions.
    stage: compare-openfoam-dns
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
  - path: figures/closure-comparison.pdf
    title: Closure comparison against DNS
    description: >
      Skin friction and shape factor over the whole plate for the laminar,
      k-epsilon and clipping k-gamma closures, with the activation field.
    stage: plot-closure-comparison
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
publications:
  - path: paper/paper.pdf
    title: Deriving a new RANS model from DNS data
    description: The primary publication from this project.
    stage: build-paper
    kind: journal-article

environments:
  main-python:
    kind: conda
    path: environment.yml
    stage: check-conda-env
  blsim:
    kind: docker
    path: sim/Dockerfile
    image: blsim
    wdir: /sim
    description: >
      OpenFOAM v2412 toolchain with foamPy. The custom turbulence models are
      deliberately not built into this image: they are compiled into the
      working tree by the build-turbulence-lib stage so that editing a model
      invalidates only the stages that use it, rather than changing this
      environment lock and invalidating every result produced with it.
  texlive:
    kind: docker
    image: texlive/texlive:latest-full

pipeline:
  stages:
    extract-jhtdb-stats:
      kind: shell-command
      environment: main-python
      command: python scripts/setup-dns.py
      inputs:
        - scripts/setup-dns.py
        - py_package/jhtdb.py
        - environment.yml
      outputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      description: >
        Download statistics at various points in the flowfield. Note that this
        has already been run with make_stats(), so we don't rerun it here to
        avoid this expensive step, which requires an access token for the JHTDB.
        The setup-dns.py script checks if data already exists before downloading.
    compute-coeffs:
      kind: shell-command
      environment: _system
      command: mkdir -p results && echo "{}" > results/coeffs.json
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - path: results/coeffs.json
          storage: git
    mesh-independence:
      kind: shell-command
      environment: blsim
      command: bash sim/run-mesh-independence.sh {ny} {turbulence}
      iterate_over:
        - arg_name: ny
          values: [15, 20, 30, 40, 60]
        - arg_name: turbulence
          values: [k-epsilon]
      inputs:
        - sim/run-mesh-independence.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/{turbulence}-ny-{ny}/postProcessing
    laminar-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-laminar.sh
      inputs:
        - sim/run-laminar.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/laminar-ny-40/postProcessing
    save-mesh-snapshot-isometric:
      kind: shell-command
      environment: _system
      command: bash scripts/save-mesh-snapshot.sh
      inputs:
        - sim/cases/k-epsilon-ny-40/constant/polyMesh
        - scripts/save-mesh-snapshot.sh
      outputs:
        - figures/rans-mesh-snapshot-isometric.png
    run-notebook:
      kind: jupyter-notebook
      environment: main-python
      notebook_path: notebook.ipynb
      executed_ipynb_storage: dvc
      html_storage: dvc
      inputs:
        - sim/cases/k-epsilon-ny-15/postProcessing
        - sim/cases/k-epsilon-ny-20/postProcessing
        - sim/cases/k-epsilon-ny-30/postProcessing
        - sim/cases/k-epsilon-ny-40/postProcessing
        - sim/cases/k-epsilon-ny-60/postProcessing
        - sim/cases/laminar-ny-40/postProcessing
    plot-bl-dns:
      kind: python-script
      environment: main-python
      script_path: scripts/plot-bl-dns.py
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - figures/bl-profile-dns.pdf
    build-paper:
      kind: latex
      environment: texlive
      target_path: paper/paper.tex
      inputs:
        - paper/paper.tex
        - figures/bl-profile-dns.pdf
        - references.bib
      outputs:
        - paper/paper.pdf
    validate-bl-solver:
      kind: python-script
      environment: main-python
      script_path: scripts/validate-bl-solver.py
      inputs:
        - py_package/bl_solver.py
        - py_package/closures.py
      outputs:
        - path: results/blasius-validation.json
          storage: git
      description: >
        Check the parabolic screening solver against the Blasius similarity
        solution, so its discretisation error is known to be smaller than the
        model differences it is used to judge.
    discover-closure:
      kind: python-script
      environment: main-python
      script_path: scripts/discover-closure.py
      args:
        - --n-random
        - "300"
        - --n-refine
        - "150"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
        - py_package/search.py
      outputs:
        - path: results/closure-search.json
          storage: git
        - path: results/closure-params.json
          storage: git
      description: >
        Search structural variants of the clipping closure and fit each one's
        coefficients against the DNS using the fast parabolic solver. This is
        the cheap screening fidelity; promising models are then run in
        OpenFOAM.
    evolve-closure:
      kind: python-script
      environment: main-python
      script_path: scripts/evolve-closure.py
      args:
        - --generations
        - "6"
        - --population
        - "14"
        - --x-stride
        - "12"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
        - py_package/grammar.py
        - py_package/evolve.py
      outputs:
        - path: results/closure-evolution.json
          storage: git
      description: >
        Evolve the structure of the activation source term, varying which
        operators and derived quantities appear rather than only the
        coefficients on a fixed set of terms. Reports a Pareto front of error
        against term count.
    fit-openfoam-coeffs:
      kind: python-script
      environment: main-python
      script_path: scripts/fit-openfoam-coeffs.py
      args:
        - --n-random
        - "500"
        - --n-refine
        - "250"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
        - py_package/search.py
      outputs:
        - path: results/clip-k-gamma-coeffs.json
          storage: git
      description: >
        Fit the transported-omega form of the closure, which is what the
        OpenFOAM model implements. Coefficients fitted for the mixing-length
        form are not transferable to it.
    summarize-findings:
      kind: python-script
      environment: main-python
      script_path: scripts/summarize-findings.py
      inputs:
        - results/closure-search.json
        - results/closure-ablation.json
        - results/clip-k-gamma-coeffs.json
        - results/openfoam-vs-dns.json
        - results/exergy-budget.json
        - results/blasius-validation.json
        - results/closure-evolution.json
      outputs:
        - path: results/findings.json
          storage: git
      description: >
        Aggregate the headline numbers from every other stage into one flat
        file, so the answers recorded against the project questions are backed
        by pipeline output rather than by hand-typed values.
    analyze-exergy-budget:
      kind: python-script
      environment: main-python
      script_path: scripts/analyze-exergy-budget.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - py_package/dns_case.py
      outputs:
        - path: results/exergy-budget.json
          storage: git
      description: >
        Thermodynamic budget of the transitional boundary layer: exergy input,
        immediate (direct viscous) entropy rejection, rejection buffered
        through the turbulent reservoir, and the storage that results when
        rejection cannot keep up with injection.
    ablate-closure:
      kind: python-script
      environment: main-python
      script_path: scripts/ablate-closure.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/clip-k-gamma-coeffs.json
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
      outputs:
        - path: results/closure-ablation.json
          storage: git
      description: >
        Remove one ingredient at a time from the fitted closure and re-score,
        to establish which terms are load-bearing and which are decorative.
    plot-closure-comparison:
      kind: python-script
      environment: main-python
      script_path: scripts/plot-closure-comparison.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/closure-params.json
        - py_package/bl_solver.py
        - py_package/dns_case.py
        - py_package/closures.py
      outputs:
        - figures/closure-comparison.pdf
    build-turbulence-lib:
      kind: shell-command
      environment: blsim
      command: bash sim/build-model.sh
      inputs:
        - sim/build-model.sh
        - sim/newModel/src
      outputs:
        - sim/newModel/platforms
      description: >
        Compile the custom turbulence models into the working tree. Kept out
        of the Docker image on purpose: baking them in would make every model
        edit change the environment lock and invalidate unrelated results.
    baseline-wall-resolved-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-baseline-wall-resolved.sh {turbulence} 80 500
      iterate_over:
        - arg_name: turbulence
          values: [k-epsilon, laminar]
      inputs:
        - sim/run-baseline-wall-resolved.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
      outputs:
        - sim/cases/{turbulence}-wall-resolved/postProcessing
      description: >
        Baselines on the same wall-resolved mesh as the clipping closure, so
        the DNS comparison is like for like.
    clip-k-gamma-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-clip-k-gamma.sh 80 500
      inputs:
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
        - sim/run-clip-k-gamma.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict.template
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/fields-low-re
      outputs:
        - sim/cases/clip-k-gamma-ny-80/postProcessing
      description: >
        Run the discovered clipping closure in OpenFOAM on a wall-resolved
        mesh (first cell y+ < 1), which the default grading of 8 does not
        provide.
    compare-openfoam-dns:
      kind: python-script
      environment: main-python
      script_path: scripts/compare-openfoam-dns.py
      args:
        - --cases
        - sim/cases/clip-k-gamma-ny-80
        - sim/cases/k-epsilon-wall-resolved
        - sim/cases/laminar-wall-resolved
        - --labels
        - clip-k-gamma
        - k-epsilon
        - laminar
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - sim/cases/clip-k-gamma-ny-80/postProcessing
        - sim/cases/k-epsilon-wall-resolved/postProcessing
        - sim/cases/laminar-wall-resolved/postProcessing
        - py_package/dns_case.py
      outputs:
        - path: results/openfoam-vs-dns.json
          storage: git
        - figures/openfoam-vs-dns.pdf
      description: >
        Score the elliptic OpenFOAM solution against the DNS at every sampled
        station. This is the a-posteriori test that counts; the parabolic
        solver is only the screening fidelity.
    evolve-model:
      kind: shell-command
      environment: blsim
      command: bash sim/run-evolve-model.sh
      inputs:
        - sim/run-evolve-model.sh
        - data/jhtdb-transitional-bl/all-stats.h5
        - sim/evolve-model.py
        - sim/run.py
        - sim/constant/turbulenceProperties.template
        - sim/newModel/src/ransFromDns/ransFromDns.C
        - sim/newModel/src/ransFromDns/ransFromDns.H
      outputs:
        - path: results/model-evolution.json
          storage: git
        - path: results/model-params.json
          storage: git

