  - question: >-
      Does the streak-scaled transition threshold survive being made
      pointwise, as a general CFD code needs?
    hypothesis: >-
      Yes. Scaling $Re_v$ by the streak amplitude at each point, rather than
      by its peak over the station, beats the fixed $Re_v$ threshold on the
      mean over Wu et al.'s five flows and on at least three of them.
    answer:
      if passes: >-
        Only on the letter of the test. Pointwise, it scores a mean of
        {ml:.2f} against {mr:.2f} for the fixed threshold, winning {wins} of
        five, but the station-peak version scores {mp:.2f}, and pointwise
        the plate falls to {pl:.2f} (station peak {pp:.2f}, calibrated
        {pr:.2f}) and the 0.75 percent flow to {l075:.1f} (fixed {r075:.1f}).
        The reference amplitude, taken where $Re_v$ peaks at onset, is only
        {aref:.3f}: $Re_v$ peaks toward the edge of the layer, where the
        streaks are weak and change quickly, so the pointwise ratio is
        dominated by where in the layer a cell sits rather than by how
        strongly the free stream has forced the streaks. What worked is a
        property of the whole wall-normal line. A general CFD code needs a
        local stand-in for it before the closure can be ported.
      else: >-
        No. Pointwise it scores a mean of {ml:.2f} against {mr:.2f} for the
        fixed threshold and {mp:.2f} for the station-peak version.
    notes: >-
      Re-read on 2026-10-01 against the rerun with the momentum and
