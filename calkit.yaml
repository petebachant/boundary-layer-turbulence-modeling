          kkl_diverged: results.naca4412-rec-400000-openfoam.kkl-omega.diverged
  - question: >-
      How much of the fluctuations' energy is exergy, energy a reversible
      process could still take out, before and after transition?
    hypothesis: >-
      Streaks, being nearly one-component, are almost pure exergy, and
      transition thermalizes them toward isotropy, which holds none.
    answer:
      if where_passes: >-
        Most of it before transition and little after. Taking the
        fluctuation exergy as k - 3/2 (det R)^(1/3), the energy above the
        isotropic state of the same entropy, the JHTDB layer's fluctuation
        energy is {pre:.0%} exergy before onset and {late:.0%} in the
        turbulent end of the plate, while the free stream holds {fs:.1%}.
      else: >-
        Not as hypothesized: the JHTDB layer's fluctuation energy is {pre:.0%}
        exergy before onset and {late:.0%} in the turbulent end, and the free
        stream holds {fs:.1%}.
    notes: >-
      The measure is k (1 - F^(1/3)), F being Lumley's flatness parameter;
      it is zero for isotropic turbulence and k in the one- and
      two-component limits, and mean-strain production feeds it with all of
      P_k. See docs/ideas-log.md section 7.10.
    evidence:
      - kind: result
        path: results/fluctuation-exergy.json
        values:
          where_passes: where_passes
          pre: plate.fraction_pre_onset
          late: plate.fraction_turbulent
          fs: plate.fs_fraction
  - question: >-
      Is bypass transition onset a limit on how much fluctuation exergy a
      laminar layer can hold?
    hypothesis: >-
      Loading a layer past its capacity to store exergy in ordered
      fluctuations pushes it into turbulence, so onset is where the layer's
      fluctuation exergy reaches a common value.
    answer:
      if limit_passes and capacity_passes: >-
        Yes. Onset where the layer's fluctuation exergy reaches the plate's
        value at onset predicts Wu et al.'s onsets with a log-rms of
        {err:.3f}, against {rule:.3f} for the inlet rule, and Bienner et
        al.'s held-out LES peak within tolerance of the common capacity.
      else: >-
        Not as a single value. Onset where the layer's fluctuation exergy
        reaches the plate's value at onset predicts Wu et al.'s onsets with
        a log-rms of {err:.3f}, against {rule:.3f} for the inlet rule
        Re_theta = C / Tu_in. In every flow the layer's exergy rises, peaks
        and falls with onset before the peak, which held on Bienner et al.'s
        held-out LES, but the peak is not a common capacity: their peaks are
        {small:.2f} and {large:.2f} times the plate's and Wu et al.'s, which
        is itself about flat up to 3 percent intensity and higher beyond.
    notes: >-
      The saturation reading came after the first test failed, so it was
      tested on Bienner et al.'s two incompressible runs, which had not been
      used (scripts/test-exergy-saturation.py). See docs/ideas-log.md
      section 7.10.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/fluctuation-exergy.json
        values:
          limit_passes: limit_passes
          err: log_rms
          rule: log_rms_inlet_rule
      - kind: result
        path: results/exergy-saturation.json
        values:
          capacity_passes: capacity_passes
          small: les.small.peak_over_capacity
          large: les.large.peak_over_capacity
  - question: >-
      Is the fluctuations' exergy destroyed by viscosity or by the pressure
      field?
    hypothesis: >-
      Pressure-strain, which is inviscid, does most of the destroying, by
      returning the stresses toward isotropy, and more so as the Reynolds
      number rises.
    answer:
      if passes: >-
        By the pressure field. In Lee & Moser's channels pressure-strain
        alone carries most of the destruction at every Reynolds number, and
        with pressure transport the inviscid share rises from {inv_lo:.0%}
        at Re_tau = 180 to {inv_hi:.0%} at 5200.
      else: >-
        Mostly by the pressure field, increasingly with Reynolds number: the
        velocity-pressure-gradient term carries {inv_lo:.0%} of the
        destruction at Re_tau = 180 and {inv_hi:.0%} at 5200, but
        pressure-strain alone does not carry most of it at every Reynolds
        number ({ps_lo:.0%} at 180, where pressure transport takes most).
        Production
        feeds the exergy with all of P_k, as it must, to within {ident:.0e} of the peak of P_k.
    notes: >-
      From the budgets of each Reynolds stress component; each term T_ij
      contributes tr(W T)/2 with W = I - (det R)^(1/3) R^-1. The split into
      pressure-strain and pressure transport is not unique, and near the
      wall, where W is singular, it matters, so their sum was added as the
      robust measure after the first run. Above y+ = 30 dissipation is a
      net exergy source. See docs/ideas-log.md section 7.10.
    evidence:
      - kind: result
        path: results/channel-exergy-budget.json
        values:
          passes: passes
          inv_lo: channels.re_tau_180.inviscid_share
          inv_hi: channels.re_tau_5200.inviscid_share
          ps_lo: channels.re_tau_180.pressure_strain_share
          ident: identity_error_max
  - question: >-
      Can a closure carrying the fluctuations' exergy close its destruction
      with the exergetic fraction and P_k / epsilon?
    hypothesis: >-
      The inviscid destruction per unit dissipation is a sparse function of
      X / k and P_k / epsilon that transfers across Reynolds numbers.
    answer:
      if passes: >-
        Across channels, yes, but not sparsely. Fitted on four of Lee &
        Moser's channels and predicting the fifth, the law gets the
        integrated destruction within {integ:.0%} and the profile with R^2
        of at least {r2:.2f}, but STLSQ keeps {kept} of the {n} library
        terms: a smooth fit rather than a law, tested only among channels.
      else: >-
        No: fitted on four of Lee & Moser's channels, the law misses the
        fifth's integrated destruction by up to {integ:.0%} or its profile
        with R^2 as low as {r2:.2f}, with {kept} of {n} library terms kept.
    notes: >-
      A priori only, and the channels are much alike, so the held-out test
      is weak. A test off the channel needs pressure-strain in a
      transitional layer, which none of the datasets stores. See
      docs/ideas-log.md section 7.10.
    evidence:
      - kind: result
        path: results/exergy-destruction-fit.json
        values:
          passes: passes
          integ: worst_integral_error
          r2: worst_r2
          kept: n_kept_pooled
          n: n_terms
  - question: >-
      Do the closures predict smooth-body separation on the Gaussian bump?
    hypothesis: >-
      The published turbulence models separate late and reattach early, as
      RANS models are known to on this bump, and the clipping closure,
      calibrated on attached plates, does no better.
    answer: >-
      Of the turbulence models only the SST-based ones separate, and their
      bubble is too short:
      Langtry-Menter scores {lm:.2f} with separation at {lm_sep:.3f} and
      reattachment at {lm_reat:.3f}, and SST {sst:.2f} with {sst_sep:.3f} and
      {sst_reat:.3f}, against the DNS's {dns_sep:.3f} and {dns_reat:.3f} (x / L).
      Neither clipping closure separates ({clip:.2f}, and {le:.2f} with the
      leading-edge term), and Launder-Sharma ({ls:.2f}) does not either
      where its run stopped. Laminar flow separates at the crest and scores
      {lam:.1f}.
    notes: >-
      The whole flow solved in OpenFOAM from the DNS's inflow profile
      (pypkg/bump_case.py), scored on C_f, separation and reattachment, C_p
      and velocity profiles against Uzun and Malik's DNS. Each run stops
      once every scored error moves by less than a twentieth of its target
      over 2,000 iterations, or at 40,000 (pypkg/foam_body.py). SST,
      Langtry-Menter and Launder-Sharma reach the cap; for SST the bubble
      matches the one runs from a uniform field and from potential flow
      were closing on, so the cap costs it little, but Launder-Sharma's
      state is not settled. kkL-omega diverges. A first version stopped at
      20,000 iterations with the pressure relaxed under SIMPLEC, which left
      SST's bubble depending on how the run was started.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/benchmark-openfoam-bump.json
        values:
          lm: results.gaussian-bump-rel-2000000-openfoam.k-omega-sst-lm.normalized
          lm_sep: results.gaussian-bump-rel-2000000-openfoam.k-omega-sst-lm.x_sep
          lm_reat: results.gaussian-bump-rel-2000000-openfoam.k-omega-sst-lm.x_reat
          sst: results.gaussian-bump-rel-2000000-openfoam.k-omega-sst.normalized
          sst_sep: results.gaussian-bump-rel-2000000-openfoam.k-omega-sst.x_sep
          sst_reat: results.gaussian-bump-rel-2000000-openfoam.k-omega-sst.x_reat
          clip: results.gaussian-bump-rel-2000000-openfoam.clip-k-omega-gamma.normalized
          le: results.gaussian-bump-rel-2000000-openfoam.clip-k-omega-gamma-le.normalized
          ls: results.gaussian-bump-rel-2000000-openfoam.launder-sharma.normalized
          lam: results.gaussian-bump-rel-2000000-openfoam.laminar.normalized
          dns_sep: cases.gaussian-bump-rel-2000000-openfoam.x_sep_dns
          dns_reat: cases.gaussian-bump-rel-2000000-openfoam.x_reat_dns
  - question: >-
      Does the leading-edge clipping closure keep its plate calibration when
      the plate's own leading edge is in the domain?
    hypothesis: >-
      Yes: reading the intensity carried from where the layer started, it
      transitions the plate with its nose as it does from x = 30, its C_f
      error within a quarter of that run's.
    answer:
      if passes: >-
        Yes: with the nose in the domain its C_f error is {ratio:.2f} times
        its error from x = 30.
      else: >-
        No: with the nose in the domain its C_f error is {ratio:.1f} times its
        error from x = 30, and onset comes at {on_n:.2f} of the DNS's
        against {on_i:.2f}. It does what it was built to: the layer carries
        {tule:.2f} percent from the nose, against the {ref:.2f} percent at x = 30
        it was calibrated to, and its threshold scales inversely with that.
        The calibration took the intensity at x = 30, where the database
        starts, for the leading edge's. The standard clipping closure, which
        does not read the leading edge, transfers ({c_n:.3f} nosed against
        {c_i:.3f}), and Langtry-Menter's error grows from {lm_i:.3f} to {lm_n:.3f}.
    notes: >-
      The JHTDB plate's super-elliptic nose meshed upstream of x = 30, with
      the free stream at the inlet set so each model's own decay matches
      the DNS's from an inflow intensity of 3.5 percent
      (scripts/run-nosed-plate.py). Every nosed run reaches the residual
      targets the x = 30 runs reach. Recalibrating with the nose-carried
      intensity as the plate's reference would move C in Re_theta = C /
      Tu_LE and fit Wu et al.'s onsets about as well; that is a choice
      left open here.
    evidence:
      - kind: result
        path: results/nosed-plate.json
        values:
          passes: passes
          ratio: le_err_ratio
          ref: tu_ref
          tule: models.clip-le.tule_wall_at_30
          on_n: models.clip-le.onset_ratio_nosed
          on_i: models.clip-le.onset_ratio_inlet
          c_n: models.clip.cf_err_nosed
          c_i: models.clip.cf_err_inlet
          lm_n: models.lm.cf_err_nosed
          lm_i: models.lm.cf_err_inlet
datasets:
  # This section declares what this project IMPORTS from elsewhere and what it
  # EXPORTS for others to reuse. It is not a listing of every file the pipeline
  # writes -- those are already declared as stage outputs, which is where a
  # reader should look for them.
  #
  # None of the imports below is published under a data DOI: JHTDB, the
  # Sillero/Jimenez server, the UT Austin channel database, the KTH/FAU
  # wing-section database, the NASA TMR and the JAXA DNS database all
  # distribute their data as plain files. Each `imported_from.doi` is
  # therefore the DOI of the paper that describes the data, which is the
  # citable, resolvable record the files can be traced back to; the download
  # URL is in scripts/fetch-dns-data.py (or, for the two datasets fetched by
  # hand, in the description), and the paper is in references.bib under the
  # key named in each description. If a dataset is ever minted its own DOI,
  # point the entry at that instead.

  # ---- imported ---------------------------------------------------------
  - path: data/jhtdb-transitional-bl/time-ave-profiles.h5
    title: JHTDB transitional boundary layer, time-averaged profiles
    description: >
      Time- and spanwise-averaged profiles for the JHTDB transition_bl
      dataset, from https://turbulence.pha.jhu.edu/datasets.aspx. The
      calibration case for every closure in this project. Cite Zaki2013.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2024-08-22
  - path: data/jhtdb-transitional-bl/spanwise-lines.h5
    title: JHTDB transitional boundary layer, spanwise lines through transition
    description: >
      Our sample of the JHTDB transition_bl DNS, not a file the JHTDB
      publishes: velocity and velocity gradient at every one of the 2048
      spanwise grid nodes, at six heights per station (the y nodes nearest
      0.05, 0.1, 0.2, 0.35, 0.5 and 0.75 delta_99), at 17 stations from x =
      100 to 900, and at eight snapshots from t = 150 to 1025, on the grid
      nodes with no interpolation and fourth-order finite-difference
      gradients. Drawn with scripts/standalone/fetch-jhtdb-lines.py, which
      needs a JHTDB token and is therefore not a pipeline stage; it records
      the query in the file. Cite Zaki2013 and JHTDBDescription.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2026-09-25
  - path: data/bienner-bypass-les
    title: Bypass transition LES at two free-stream integral length scales
    description: >
      Bienner, Gloerfelt and Cinnella's LES of bypass transition on a flat
      plate under free-stream turbulence with two integral length scales a
      factor of seven apart, at intensities of 2.5, 4 and 6.6 percent, in air
      at Mach 0.1 and 0.9 and in the organic vapour Novec649: streamwise
      evolution of C_f, Re_theta, H, the free-stream intensity and the peak
      u_rms in the layer, wall-normal profiles of mean velocity and stresses,
      and spectra. Implicit LES (MUSICAA, tenth-order), admitted by exception
      to the DNS-first rule because it is the only open dataset that varies
      the free-stream length scale at fixed intensity; at Re_theta about 830
      its turbulent profiles match the JHTDB DNS to a few percent in U+ and
      -uv+. Only the Mach 0.1 air cases are used as incompressible flows.
      Fetched by the fetch-bienner-les stage. Cite Bienner2024.
    imported_from:
      doi: 10.5281/zenodo.12915280
      date: 2026-09-29
  - path: data/gaussian-bump-dns
    title: DNS of turbulent flow past the Boeing Gaussian bump
    description: >
      Uzun and Malik's DNS of a spanwise-periodic slice of the Boeing
      smooth-body separation bump, y = 0.085 L exp(-(x / 0.195 L)^2), at
      Re_L = 1, 2 and 4 million and Mach 0.2: wall C_f and C_p at all three,
      and the field statistics (rho, U, V, p and the Reynolds stresses) at 2
      million. A turbulent boundary layer from a recycled inflow at x/L =
      -0.8 accelerates over the bump and separates from its smooth lee, at
      2 million from about x/L = 0.10 to 0.42. The surface data come from the
      NASA Turbulence Modeling Resource (CC0), the statistics from NASA's
      site; each is checked against the SHA-256 it had when first fetched,
      since neither publishes a checksum. Fetched by the fetch-gaussian-bump
      stage. Cite Uzun2022.
    imported_from:
      doi: 10.2514/1.J060760
      date: 2026-10-03
  - path: data/wu-bypass-transition
    title: Bypass transition DNS at five free-stream turbulence intensities
    description: >
      Wu, Gonzalez and Agrawal's DNS of bypass transition on a flat plate at
      inlet free-stream turbulence intensities of 0.75, 1.5, 2.25, 3 and 6
      percent, as the text files the Center for Turbulence Research
      publishes: C_f, intermittency, shape factor and free-stream decay
      against Re_x and Re_theta, wall-normal profiles of mean velocity and
      stresses at 16 stations, and dissipation and length scales for all but
      the 6 percent case, whose shared folder is empty. The heat-transfer
      statistics are not fetched. The only DNS in the suite
      that varies the free-stream intensity, which is what the questions on
      transition onset need. Fetched by the fetch-dns-data stage from the
      shared folders linked at
      https://ctr.stanford.edu/about-center-turbulence-research/research-data.
      Cite Wu2026.
    imported_from:
      doi: 10.1103/g72g-q82r
      date: 2026-09-25
    stage: fetch-dns-data
  - path: data/jhtdb-transitional-bl/gradient-profiles.h5
    title: JHTDB transitional boundary layer, velocity-gradient profiles
    description: >
      Our sample of the JHTDB transition_bl DNS: the velocity gradient at
      every DNS y node up to 1.2 delta_99, at every 8th spanwise node, at the
      same 17 stations and eight snapshots as the spanwise lines, for the
      true dissipation at every height. Drawn with
      scripts/standalone/fetch-jhtdb-profiles.py, which needs a JHTDB token
      and is therefore not a pipeline stage. Cite Zaki2013 and
      JHTDBDescription.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2026-09-25
  - path: data/jiminez
    title: Sillero/Jimenez ZPG turbulent boundary layer profiles
    description: >
      Six stations at Re_theta 4000-6500, in wall units, from
      https://torroja.dmt.upm.es/turbdata/blayers/. Used both for the a-priori
      term regression and as the jimenez-zpg-tbl benchmark case. Cite
      Sillero2013.
    imported_from:
      doi: 10.1063/1.4823831
      date: 2024-09-04
  - path: data/lee-moser-budgets
    title: Lee & Moser turbulent channel Reynolds stress budgets
    description: >
      The budgets of uu, vv, ww and uv (production, turbulent, viscous and
      pressure transport, pressure-strain and dissipation) at Re_tau = 180,
      550, 1000, 2000 and 5200. Fetched by the fetch-lee-moser-budgets
      stage. Cite LeeMoser2015.
    imported_from:
      doi: 10.1017/jfm.2015.268
      date: 2026-10-05
    stage: fetch-lee-moser-budgets
  - path: data/lee-moser-channel
    title: Lee & Moser turbulent channel profiles, Re_tau 180-5200
    description: >
      Mean and fluctuation profiles, and the budget of k, at five Reynolds
      numbers. Fetched by the
      fetch-dns-data stage, which pins each file by url, retrieval date and
      SHA-256. Cite LeeMoser2015.
    imported_from:
      doi: 10.1017/jfm.2015.268
      date: 2026-09-24
    stage: fetch-dns-data
  - path: data/crs-separation-bubble
    title: Coleman, Rumsey & Spalart DNS of 2-D turbulent separation bubbles
    description: >
      Flat-plate boundary layers driven to genuine separation and reattachment
      by top-wall transpiration, at Re_theta up to 10,700. True DNS, published
      through the NASA Turbulence Modeling Resource specifically for
      turbulence-model validation, and therefore the case a claim about
      separation should rest on rather than the wing-section LES below. The
      wall-normal profiles are 110 MB of ASCII per case upstream; the
      fetch-dns-data stage subsamples them in x and stores ~1 MB of npz. Cite
      Coleman2018.
    imported_from:
      doi: 10.1017/jfm.2018.257
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/kth-wing-sections
    title: KTH well-resolved LES of NACA 4412 and NACA 0012 wing sections
    description: >
      Fifty boundary-layer stations along each wing section at Re_c up to
      1,000,000, with c_f, the Clauser parameter and the Reynolds stresses.
      NOTE: well-resolved LES, not DNS -- the only non-DNS reference in the
      suite. A sub-grid model is itself a turbulence model, so this case
      compares a closure against a model rather than against the equations.
      The suction side reaches beta = 112 with c_f falling to 1.8e-4 without
      separating, which is the near-separation test the closures most need.
      Fetched by the fetch-dns-data stage. Cite Vinuesa2018.
    imported_from:
      doi: 10.1016/j.ijheatfluidflow.2018.04.017
      date: 2026-08-28
    stage: fetch-dns-data
  - path: data/jaxa-shear-layer-vortex
    title: >-
      Lusher et al. DNS of a temporally evolving shear layer rolling up into
      vortices
    description: >
      Time histories (t_hat = 0 to 6, 301 instants) of peak and integral
      quantities -- peak vorticity of both signs, minimum pressure, peak
      velocity, peak eddy viscosity, momentum and vorticity thickness, peak
      shear stress and TKE, integrated TKE, production and kinetic energy --
      from a 12.7-billion-point OpenSBLI DNS at dU Lx/nu = 250,000, ensemble
      averaged over five realizations. This is the only published form of the
      DNS: no profiles, no fields. The pre-roll-up phase (t_hat < 0.4) is the
      temporal-mixing-layer benchmark case, the suite's first flow without a
      wall; the vortex phase is the target for a Tier-2 unsteady 2-D case.
      Fetched by the fetch-dns-data stage. Cite Lusher2026 for the DNS and
      Sansica2026 for the RANS comparison; JAXA reserves rights to the data
      and asks that the source be quoted.
    imported_from:
      doi: 10.1007/s00162-026-00788-y
      date: 2026-08-29

    stage: fetch-dns-data
  - path: data/closure-challenge
    title: >-
      Closure Challenge DNS cases as OpenFOAM setups with the DNS on the RANS
      mesh
    description: >
      The DNS cases of the Closure Challenge benchmark, taken as the complete
      OpenFOAM case directories the challenge ships (mesh, boundary
      conditions, schemes) with the DNS mean velocity, kinetic energy and
      Reynolds stresses interpolated onto the RANS mesh: four parameterized
      periodic hills (the DNS of Xiao et al. 2020, cite Xiao2020) and four
      square/rectangular ducts (the DNS of Vinuesa et al. 2014, cite
      Vinuesa2014), all from the challenge's own test set so scores are
      comparable with its leaderboard. The challenge's LES and experimental
      cases are excluded because this suite scores against DNS only, and its
      k-omega SST solutions are excluded because nothing here is trained
      against a RANS solution. Fetched by the fetch-dns-data stage from a
      pinned commit of the challenge repository
      (github.com/rmcconke/closure-challenge-benchmark). Cite McConkey2026.
    imported_from:
      git_repo_url: https://github.com/rmcconke/closure-challenge-benchmark.git
      path: data
      git_rev: d572d40c87f6f56ebbaf9a10c463ee330aa32514
      date: '2026-08-30'
    stage: fetch-dns-data
  - path: data/jhtdb-transitional-bl/sampled-gradients.h5
    title: JHTDB exact gradients and Hessians at 100 sampled points
    description: >
      Velocity and pressure gradients and Hessians queried from the JHTDB web
      service at 100 points, including the spanwise derivatives that cannot be
      obtained from the 2-D time-averaged profiles at all. Kept as their own
      small file rather than merged into all-stats.h5, because fetching them
      requires a JHTDB access token and so must not sit on the pipeline's
      critical path; regenerate with
      scripts/standalone/fetch-jhtdb-gradients.py. The notebook's continuity
      check is the only consumer. Queried from
      https://turbulence.pha.jhu.edu/datasets.aspx.
    imported_from:
      doi: 10.1007/s10494-013-9502-8
      date: 2024-08-22

  # ---- exported ---------------------------------------------------------
  - path: data/jhtdb-transitional-bl/all-stats.h5
    title: DNS statistics table
    description: >
      The JHTDB profiles flattened onto an (x, y) index with finite-difference
      gradients, derived from the imported profiles above.
    tabular: true
    stage: make-dns-stats-table
  - path: results/benchmark.json
    title: RANS bench leaderboard
    description: >
      Every registered closure scored against every registered case, with
      in-sample and out-of-sample results separated by each closure's declared
      calibration case. The reusable product of the benchmarking harness.
    stage: run-benchmark

figures:
  - path: figures/streak-reservoir.pdf
    title: Streak reservoir against the DNS
    description: >
      Peak fluctuation energy, vorticity Reynolds number and eddy viscosity
      along the plate, DNS against the closure.
    stage: analyze-streak-reservoir
  - path: figures/bl-profile-dns.pdf
    title: The boundary layer profile from DNS data
    description: The mean boundary layer profile computed from the DNS data.
    stage: plot-bl-dns
    data:
      - data/jhtdb-transitional-bl/all-stats.h5
  - path: figures/rans-mesh-snapshot-isometric.png
    title: RANS simulation mesh snapshot
    description: A snapshot of the RANS simulation mesh.
    stage: save-mesh-snapshot-isometric
  - path: figures/openfoam-vs-dns.pdf
    title: OpenFOAM profiles against DNS
    description: >
      Velocity profiles from the elliptic OpenFOAM solution compared with the
      DNS across the laminar, transitional and turbulent regions.
    stage: compare-openfoam-dns
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5
  - path: figures/closure-comparison.pdf
    title: Closure comparison against DNS
    description: >
      Skin friction and shape factor over the whole plate for the laminar,
      k-epsilon and clipping k-gamma closures, with the activation field.
    stage: plot-closure-comparison
    data:
      - data/jhtdb-transitional-bl/time-ave-profiles.h5

publications:
  - path: paper/main.pdf
    title: Deriving a new RANS model from DNS data
    description: The primary publication from this project.
    stage: build-paper
    kind: journal-article

environments:
  py-compute:
    kind: uv
    path: envs/compute/pyproject.toml
    description: >
      Numerics only, on Python 3.14. Every closure search, fit, ablation and
      benchmark run depends on this environment's lock, so a package added
      here invalidates results that are expensive to reproduce. Plotting
      packages belong in py-viz. pypkg is installed editable, so stages depend
      on the specific modules they use rather than on the whole package.
  py-sindy:
    kind: uv
    path: envs/sindy/pyproject.toml
    description: >
      Sparse regression of transport equations with PySINDy and scikit-learn,
      on Python 3.14. Kept apart from py-compute so that these packages do not
      invalidate the closure searches, fits and benchmarks on that lock.
  py-viz:
    kind: uv
    path: envs/viz/pyproject.toml
    description: >
      Figures and reporting, layered on the same numerics. Split from
      py-compute so that adding a plotting package does not invalidate a week
      of coefficient fitting. The dependency runs one way on purpose: bumping
      numpy correctly invalidates the figures drawn from it, but not the
      reverse.
  py-jhtdb:
    kind: uv
    path: envs/jhtdb/pyproject.toml
    description: >
      Querying the JHTDB with its current Python client, givernylocal. Used
      only by the token-gated scripts in scripts/standalone/, which are
      deliberately not pipeline stages: they need an access token, and what
      they fetch is committed as a dataset the pipeline reads. Because no
      stage uses this environment, no stage depends on its lock. It
      replaced pyjhtdb, whose legacy SOAP service stopped working in 2025.
  py-notebook:
    kind: uv
    path: envs/notebook/pyproject.toml
    description: >
      The exploratory notebook, which needs Jupyter and calkit itself. Kept
      separate so Jupyter's large and fast-moving dependency tree cannot
      invalidate a figure or a fit. Resolves GitHub issue #18.
  blsim:
    kind: docker
    path: sim/Dockerfile
    wdir: /sim
    description: >
      OpenFOAM v2412 toolchain with foamPy. The custom turbulence models are
      deliberately not built into this image: they are compiled into the
      working tree by the build-turbulence-lib stage so that editing a model
      invalidates only the stages that use it, rather than changing this
      environment lock and invalidating every result produced with it.
    registry: ghcr.io
  texlive:
    kind: docker
    # Calkit's LaTeX image, far smaller than texlive:latest-full, pinned to a
    # version rather than a moving tag
    image: ghcr.io/calkit/latex:0.1.5

pipeline:
  stages:
    fetch-dns-data:
      kind: python-script
      environment: py-compute
      script_path: scripts/fetch-dns-data.py
      outputs:
        - path: data/lee-moser-channel
          storage: git
        - path: data/kth-wing-sections
          storage: git
        - path: data/crs-separation-bubble
          storage: git
        - path: data/jaxa-shear-layer-vortex
          storage: git
        - data/closure-challenge
        # About 2,000 files from a host that throttles a long run of
        # requests, so a rerun keeps what it already has rather than starting
        # over; the fetch skips files that are present
        - path: data/wu-bypass-transition
          delete_before_run: false
      description: >
        Fetch the external DNS/LES reference datasets the benchmark cases
        need, with the retrieving code under version control rather than
        trusting that someone once ran curl. Source URLs are in the script;
        the citation and retrieval date for each dataset are declared once
        under `datasets`. No checksum file: DVC and git already hash the
        content, and the commit that added the files records when they were
        fetched. Idempotent -- a file already present is not re-downloaded, so
        an ordinary run does no network I/O.
    fetch-bienner-les:
      kind: python-script
      environment: py-compute
      script_path: scripts/fetch-bienner-les.py
      outputs:
        - data/bienner-bypass-les
      description: >
        Fetch Bienner et al.'s LES of bypass transition at two free-stream
        integral length scales from Zenodo, checked against its published
        MD5.
    fetch-gaussian-bump:
      kind: python-script
      environment: py-compute
      script_path: scripts/fetch-gaussian-bump.py
      outputs:
        - data/gaussian-bump-dns
      description: >
        Fetch Uzun and Malik's Gaussian bump DNS, its wall C_f and C_p at
        three Reynolds numbers and its field statistics at 2 million, each
        checked against its SHA-256.
    make-dns-stats-table:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-dns-stats-table.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_stats.py
      outputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      description: >
        Flatten the time-averaged DNS profiles into the (x, y) statistics
        table. Replaces extract-jhtdb-stats, which called setup-dns.py and, if
        the file happened to be missing, downloaded a prebuilt copy from
        Google Drive -- an opaque fetch rather than a derivation, and it put
        pyJHTDB (token-gated, and unbuildable against numpy >= 1.24) on the
        critical path of a pipeline that never used it. This stage is a pure
        function of a tracked input and reproduces the old table bit-for-bit
        on all 23 columns that have a consumer. The 36 JHTDB web-service
        columns are dropped: they were populated at 100 of 743,680 rows and
        nothing read them. Fetching those now lives outside the pipeline, in
        scripts/standalone/fetch-jhtdb-gradients.py.
    mesh-independence:
      kind: shell-command
      environment: blsim
      command: bash sim/run-mesh-independence.sh {ny} {turbulence}
      iterate_over:
        - arg_name: ny
          values: [15, 20, 30, 40, 60]
        - arg_name: turbulence
          values: [k-epsilon]
      inputs:
        - sim/run-mesh-independence.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/{turbulence}-ny-{ny}/postProcessing
        # The mesh is a real product of this stage: blockMesh writes it, and
        # save-mesh-snapshot-isometric consumes it. Leaving it undeclared made
        # that stage depend on a file no stage produced, so it could not run
        # at all on a fresh clone.
        - sim/cases/{turbulence}-ny-{ny}/constant/polyMesh
    laminar-sim:
      kind: shell-command
      environment: blsim
      command: bash sim/run-laminar.sh
      inputs:
        - sim/run-laminar.sh
        - sim/system/blockMeshDict.template
        - sim/run.py
        - sim/system/sample
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
      outputs:
        - sim/cases/laminar-ny-40/postProcessing
    save-mesh-snapshot-isometric:
      kind: shell-command
      environment: _system
      command: bash scripts/save-mesh-snapshot.sh
      inputs:
        - sim/cases/k-epsilon-ny-40/constant/polyMesh
        - scripts/save-mesh-snapshot.sh
      outputs:
        - figures/rans-mesh-snapshot-isometric.png
    run-notebook:
      kind: jupyter-notebook
      environment: py-notebook
      notebook_path: notebooks/main.ipynb
      executed_ipynb_storage: dvc
      html_storage: dvc
      inputs:
        - sim/cases/k-epsilon-ny-15/postProcessing
        - sim/cases/k-epsilon-ny-20/postProcessing
        - sim/cases/k-epsilon-ny-30/postProcessing
        - sim/cases/k-epsilon-ny-40/postProcessing
        - sim/cases/k-epsilon-ny-60/postProcessing
        - sim/cases/laminar-ny-40/postProcessing
    plot-bl-dns:
      kind: python-script
      environment: py-viz
      script_path: scripts/plot-bl-dns.py
      inputs:
        - data/jhtdb-transitional-bl/all-stats.h5
      outputs:
        - figures/bl-profile-dns.pdf
    validate-bl-solver:
      kind: python-script
      environment: py-compute
      script_path: scripts/validate-bl-solver.py
      inputs:
        - pypkg/bl_solver.py
        - pypkg/closures.py
      outputs:
        - path: results/blasius-validation.json
          storage: git
      description: >
        Check the parabolic screening solver against the Blasius similarity
        solution, so its discretization error is known to be smaller than the
        model differences it is used to judge.
    discover-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/discover-closure.py
      args:
        - --n-random
        - "300"
        - --n-refine
        - "150"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/closure-search.json
          storage: git
        - path: results/closure-params.json
          storage: git
      description: >
        Search structural variants of the clipping closure and fit each one's
        coefficients against the DNS using the fast parabolic solver. This is
        the cheap screening fidelity; promising models are then run in
        OpenFOAM.
    evolve-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/evolve-closure.py
      args:
        - --generations
        - "6"
        - --population
        - "14"
        - --x-stride
        - "12"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/grammar.py
        - pypkg/evolve.py
      outputs:
        - path: results/closure-evolution.json
          storage: git
      description: >
        Evolve the structure of the activation source term, varying which
        operators and derived quantities appear rather than only the
        coefficients on a fixed set of terms. Reports a Pareto front of error
        against term count.
    fit-openfoam-coeffs:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-openfoam-coeffs.py
      args:
        - --n-random
        - "500"
        - --n-refine
        - "250"
        - --x-stride
        - "8"
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
        - pypkg/search.py
      outputs:
        - path: results/clip-k-gamma-coeffs.json
          storage: git
      description: >
        Fit the transported-omega form of the closure, which is what the
        OpenFOAM model implements. Coefficients fitted for the mixing-length
        form are not transferable to it.
    analyze-flow-structure:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-flow-structure.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/flow-structure.json
          storage: git
      description: >
        Structural diagnostics: coherence versus energy partition, total
        correlation in bits, component entropy, Lumley invariants, and the
        misalignment between the stress anisotropy and the mean strain. These
        measure how much structure the flow carries rather than how much
        energy, which is what distinguishes transition from mere loudness.
    analyze-exergy-budget:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-exergy-budget.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/exergy-budget.json
          storage: git
      description: >
        Thermodynamic budget of the transitional boundary layer: exergy input,
        immediate (direct viscous) entropy rejection, rejection buffered
        through the turbulent reservoir, and the storage that results when
        rejection cannot keep up with injection.
    analyze-streak-reservoir:
      kind: python-script
      environment: py-viz
      script_path: scripts/analyze-streak-reservoir.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/dns_case.py
        - pypkg/closures.py
      outputs:
        - path: results/streak-reservoir.json
          storage: git
        - path: figures/streak-reservoir.pdf
      description: >
        Measure the pre-transitional streak reservoir a priori from the DNS --
        the fluctuation-energy budget, the implied eddy viscosity and
        structure parameter, and the vorticity Reynolds number the clip fires
        on -- and compare it with what the closure actually produces. The
        mean-field objective cannot see this, so a model can lose the
        reservoir the closure is built on and still score well on skin
        friction.
    analyze-energy-flux:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-energy-flux.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - pypkg/dns_case.py
      outputs:
        - path: results/energy-flux.json
          storage: git
      description: >
        Integral energy-flux budget. The integrated dissipation is measured
        from the exact steady k balance rather than modeled, since transport
        terms are internal and cancel. Reports the dissipation coefficient
        C_eps = eps*L/u'^3, which every equilibrium closure treats as a
        constant: it holds to 1.5 percent in the turbulent region and in an
        independent turbulent DNS, but varies roughly sevenfold through
        transition, so the cascade there is not in equilibrium.
    regress-pde-terms:
      kind: python-script
      environment: py-compute
      script_path: scripts/regress-pde-terms.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jiminez
        - pypkg/dns_case.py
      outputs:
        - path: results/pde-term-regression.json
          storage: git
      description: >
        A-priori least squares over a library of closure terms computed
        directly from the DNS, for both the Reynolds shear stress and the
        unclosed residual of the k budget. Reports in-sample fit against
        transfer across flow regions and across an independent DNS, plus a
        guard against the trivial solution where a library column is itself
        essentially the target. In-sample $R^2$ near 0.95 is easy and means
        nothing; only the transfer tests distinguish a constitutive law from a
        curve fit.
    build-transport-targets:
      kind: python-script
      environment: py-compute
      script_path: scripts/build-transport-targets.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/jhtdb-transitional-bl/gradient-profiles.h5
        - data/jiminez
        - data/lee-moser-channel
        - data/kth-wing-sections
        - data/crs-separation-bubble
        - pypkg/dns_case.py
        - pypkg/cases/channel.py
        - pypkg/cases/jimenez_zpg.py
      outputs:
        - results/transport-targets.h5
        - path: results/transport-targets-summary.json
          storage: git
      description: >
        Fields of k and of two candidate omegas on every DNS case, for
        discovering their transport equations: eps/(beta* k) where the DNS
        has the dissipation, and k/nu_t with nu_t the Boussinesq projection of
        the DNS shear stress everywhere. Their ratio is C_mu,eff/0.09, so the
        summary says where one omega can serve both the dissipation and the
        stress, before any regression.
    fit-transport-equations:
      kind: python-script
      environment: py-sindy
      script_path: scripts/fit-transport-equations.py
      inputs:
        - results/transport-targets.h5
      outputs:
        - path: results/transport-equation-fit.json
          storage: git
      description: >
        Bagged sparse regression (PySINDy STLSQ) of an omega equation in the
        implicit form, destruction fixed, over a library of SST's terms plus
        candidates, for both omega targets. Reports how often each term is
        selected with each flow family held out and the held-out error against
        SST's terms refitted, SST's published coefficients, and the two columns
        that depend on the structure parameter alone, which guard against
        rediscovering that -uv/k is nearly constant.
    analyze-transition-mechanics:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-transition-mechanics.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - pypkg/dns_case.py
      outputs:
        - path: results/transition-mechanics.json
          storage: git
      description: >
        Integral balances and saturation through bypass transition on the
        plate, for the overdriven-amplifier questions: whether the peak
        vorticity Reynolds number clips at a ceiling, whether production per
        unit fluctuation energy falls as the streaks saturate, and where the
        integral dissipation coefficient leaves its laminar value relative to
        the Re_v threshold and the linear critical Reynolds number.
    analyze-spanwise-lines:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-spanwise-lines.py
      inputs:
        - data/jhtdb-transitional-bl/spanwise-lines.h5
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/energy-flux.json
        - results/transition-mechanics.json
        - pypkg/dns_case.py
      outputs:
        - path: results/spectral-entropy.json
          storage: git
      description: >
        Spanwise spectra through bypass transition from the JHTDB lines: the
        spectral entropy against the pre-set monotonicity and in-step tests,
        and exploratory measures whose tests were fixed before they were
        computed (entropy over delta-scaled wavelength bands, harmonics of the
        streak wavenumber, collapse on the turbulence Reynolds number), plus
        the true dissipation and the effective C_mu at each sampled point.
    analyze-bypass-onset:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-bypass-onset.py
      inputs:
        - data/wu-bypass-transition
      outputs:
        - path: results/bypass-onset.json
          storage: git
      description: >
        Transition onset against inlet free-stream intensity across Wu et
        al.'s five DNS: the exponent of Re_x,t against Tu, which a fixed
        disturbance headroom with lift-up gain puts near 2, and the peak
        vorticity Reynolds number at onset, which a threshold on the Reynolds
        number alone would hold constant.
    fit-threshold-law:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-threshold-law.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/transition-mechanics.json
        - results/bypass-onset.json
        - results/plate-leading-edge-intensity.json
        - pypkg/dns_case.py
      outputs:
        - path: results/threshold-law.json
          storage: git
      description: >
        A transition threshold that falls with free-stream intensity, fitted
        as a power law on Wu et al.'s DNS and tested on the JHTDB plate, which
        it never saw: in the local intensity at onset as set in advance, and,
        exploratory, in the inlet intensity.
    test-threshold-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-threshold-closure.py
      inputs:
        - data/wu-bypass-transition
        - results/bypass-onset.json
        - results/plate-leading-edge-intensity.json
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/threshold-closure.json
          storage: git
      description: >
        The clipping closure on Wu et al.'s five bypass-transition flows with
        its JHTDB-calibrated threshold, fixed, against the same threshold
        scaled by a power of the inlet free-stream intensity whose exponent is
        fitted leaving each flow out in turn: whether one extra number makes
        the closure transfer across free-stream intensity.
    test-onset-rule-closure:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-onset-rule-closure.py
      inputs:
        - data/wu-bypass-transition
        - results/plate-leading-edge-intensity.json
        - results/threshold-closure.json
        - results/onset-history.json
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/onset-rule-closure.json
          storage: git
      description: >
        The clipping closure on Wu et al.'s five flows with its transition
        threshold inversely proportional to the inlet intensity, as the
        streak onset rule says, with nothing fitted on those flows.
    analyze-streak-headroom:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-streak-headroom.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - pypkg/dns_case.py
      outputs:
        - path: results/streak-headroom.json
          storage: git
      description: >
        The peak streamwise fluctuation in the layer at transition onset,
        across Wu et al.'s free-stream intensities and on the JHTDB plate:
        whether bypass transition begins at a fixed streak amplitude, a
        threshold a closure could apply to its own fluctuation energy.
    test-amplitude-threshold:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-amplitude-threshold.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/amplitude-threshold.json
          storage: git
      description: >
        The clipping closure switched on at a fixed value of its own streak
        amplitude instead of the vorticity Reynolds number, calibrated on the
        JHTDB plate and scored on Wu et al.'s flows, with a diagnostic of how
        the closure's streak amplitude grows against the DNS's.
    fit-streak-growth:
      kind: python-script
      environment: py-compute
      script_path: scripts/fit-streak-growth.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/streak-growth.json
          storage: git
      description: >
        Exploratory: lift-up driven by the free stream alone, with its
        coefficient and the shear suppression of dissipation chosen on the
        JHTDB plate's pre-transitional streak growth, run on Wu et al.'s
        flows to see whether the closure's streaks then grow with distance
        and free-stream intensity as the DNS's do.
    analyze-freestream-length-scale:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-freestream-length-scale.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - pypkg/dns_case.py
      outputs:
        - path: results/freestream-length-scale.json
          storage: git
      description: >
        The free-stream dissipation length scale k^(3/2)/eps of every
        bypass-transition flow, with eps from the decay of the free stream.
    test-two-component-streaks:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-two-component-streaks.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/two-component-streaks.json
          storage: git
      description: >
        Streak growth before transition with lift-up forced by a transported
        roll energy (two components) against lift-up forced by the local
        free-stream k (one), each fitted leaving one flow out of the JHTDB
        plate and Wu et al.'s 0.75 and 1.5 percent flows.
    test-streak-threshold:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-streak-threshold.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - results/threshold-closure.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/streak-threshold.json
          storage: git
      description: >
        The two-component streak closure with transition switched on at a
        fixed streak amplitude, calibrated on the plate, scored on Wu et
        al.'s five flows against the clipping closure's Re_v threshold.
    diagnose-streak-dissipation:
      kind: python-script
      environment: py-compute
      script_path: scripts/diagnose-streak-dissipation.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/streak-threshold.json
        - results/clip-k-gamma-coeffs.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/streak-dissipation.json
          storage: git
      description: >
        The JHTDB plate with the Re_v threshold, stepping from the
        calibrated clipping closure to the streak closure's coefficients one
        change at a time, to find what spoils the turbulent layer.
    test-split-streaks:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-split-streaks.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - results/threshold-closure.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/split-streaks.json
          storage: git
      description: >
        The calibrated clipping closure with the forcing and the streaks
        carried as two more energies beside the turbulence, transition
        switched on at a fixed streak amplitude calibrated on the plate,
        scored on Wu et al.'s five flows against the Re_v threshold.
    test-streak-scaled-threshold:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-streak-scaled-threshold.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - results/split-streaks.json
        - results/threshold-closure.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/streak-scaled-threshold.json
          storage: git
      description: >
        The calibrated Re_v threshold scaled by the closure's own streak
        amplitude in place of the inlet intensity, with the exponent fitted
        leaving each of Wu et al.'s flows out, scored on the five flows.
    test-streak-norm-threshold:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-streak-norm-threshold.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - results/split-streaks.json
        - results/streak-scaled-threshold.json
        - results/threshold-closure.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/streak-norm-threshold.json
          storage: git
      description: >
        The Re_v threshold scaled by the closure's streak amplitude divided
        by Re_v,max, an intensity with the distance travelled taken out,
        scored on the plate and Wu et al.'s five flows.
    make-wu-openfoam-inlets:
      kind: python-script
      environment: py-compute
      script_path: scripts/make-wu-openfoam-inlets.py
      inputs:
        - data/wu-bypass-transition
        - scripts/make-inlet-profiles.py
        - results/clip-k-gamma-coeffs.json
        - pypkg/cases/wu_bypass.py
      outputs:
        - path: results/wu-openfoam-inlets.json
          storage: git
      description: >
        Inlets, domains and per-model free streams for running Wu et al.'s
        bypass-transition flows in OpenFOAM, in the form of the JHTDB
        plate's inlet-profiles.json.
    wu-sims:
      kind: shell-command
      environment: blsim
      command: bash sim/run-wu.sh {tag} {model}
      iterate_over:
        - arg_name: tag
          values: [WM075, WM150, WM225, WM300, WM600]
        - arg_name: model
          values: [k-omega-sst, k-omega-sst-lm, kkl-omega, clip-k-gamma]
      inputs:
        - sim/run-wu.sh
        - sim/foam-env.sh
        - sim/run.py
        - sim/system/blockMeshDict-graded.template
        - sim/system/controlDict
        - sim/system/fvSolution
        - sim/system/fvSchemes
        - sim/constant/turbulenceProperties.template
        - sim/constant/transportProperties
        - sim/fields-low-re
        - results/wu-openfoam-inlets.json
        - results/clip-k-gamma-coeffs.json
        - sim/newModel/platforms
      outputs:
        - sim/cases/wu-{tag}-{model}/postProcessing
      description: >
        Wu et al.'s five bypass-transition flows in OpenFOAM with k-omega
        SST, Langtry-Menter, Walters-Cokljat kkLOmega and the clipping
        closure, each handed the measured free stream.
    score-wu-openfoam:
      kind: python-script
      environment: py-compute
      script_path: scripts/score-wu-openfoam.py
      inputs:
        - from_stage_outputs: wu-sims
        - data/wu-bypass-transition
        - pypkg/cases
        - pypkg/registry.py
      outputs:
        - path: results/wu-openfoam.json
          storage: git
      description: >
        The OpenFOAM runs of Wu et al.'s flows scored exactly as the Python
        tier scores them, on the case's own grid.
    test-streak-local-threshold:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-streak-local-threshold.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/clip-k-gamma-coeffs.json
        - results/split-streaks.json
        - results/streak-scaled-threshold.json
        - results/threshold-closure.json
        - pypkg/bl_solver.py
        - pypkg/closures.py
        - pypkg/dns_case.py
        - pypkg/registry.py
        - pypkg/cases
      outputs:
        - path: results/streak-local-threshold.json
          storage: git
      description: >
        The streak-scaled Re_v threshold made pointwise, as a general CFD code
        needs, scored on the plate and Wu et al.'s five flows.
    test-lm-onset-transfer:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-lm-onset-transfer.py
      inputs:
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/wu-bypass-transition
        - sim/cases/k-omega-sst-lm-dns-domain/postProcessing
        - from_stage_outputs: wu-sims
        - scripts/score-wu-openfoam.py
        - pypkg/dns_case.py
        - pypkg/cases
      outputs:
        - path: results/lm-onset-transfer.json
          storage: git
      description: >
        Whether Langtry-Menter's onset is early on the JHTDB plate by the
        factor it is early on Wu et al.'s flows, the condition for a
        plate-calibrated correction to transfer.
    compare-onset-laws:
      kind: python-script
      environment: py-compute
      script_path: scripts/compare-onset-laws.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/plate-leading-edge-intensity.json
        - pypkg/dns_case.py
      outputs:
        - path: results/onset-laws.json
          storage: git
      description: >
        Onset predicted from the DNS's own boundary layer and free stream by
        Langtry-Menter's correlation, by the streak rule calibrated on the
        JHTDB plate, and by Mayle's correlation, against Wu et al.'s onsets.
    test-onset-history:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-onset-history.py
      inputs:
        - results/plate-leading-edge-intensity.json
        - scripts/compare-onset-laws.py
        - scripts/analyze-length-scale-onset.py
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - data/bienner-bypass-les
        - results/onset-laws.json
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/length-scale-onset.json
        - pypkg/dns_case.py
      outputs:
        - path: results/onset-history.json
          storage: git
      description: >
        The streak onset rule in a transportable form, onset where the
        free-stream forcing accumulated from the leading edge reaches a
        level set on the JHTDB plate, against Wu et al.'s onsets.
    test-fluctuation-exergy:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-fluctuation-exergy.py
      inputs:
        - data/wu-bypass-transition
        - data/jhtdb-transitional-bl/time-ave-profiles.h5
        - results/bypass-onset.json
        - results/transition-mechanics.json
        - results/onset-history.json
        - pypkg/dns_case.py
      outputs:
        - path: results/fluctuation-exergy.json
          storage: git
      description: >
        The fluctuations' exergy, k - 3/2 (det R)^(1/3), on the JHTDB plate
        and Wu et al.'s flows: where it sits, and whether onset is where
        the layer's fluctuation exergy reaches a level set on the plate.
    fetch-lee-moser-budgets:
      kind: python-script
      environment: py-compute
      script_path: scripts/fetch-lee-moser-budgets.py
      outputs:
        - path: data/lee-moser-budgets
          storage: git
      description: >
        Fetch Lee & Moser's channel budgets of each Reynolds stress
        component at the five Reynolds numbers.
    analyze-channel-exergy-budget:
      kind: python-script
      environment: py-compute
      script_path: scripts/analyze-channel-exergy-budget.py
      inputs:
        - data/lee-moser-channel
        - from_stage_outputs: fetch-lee-moser-budgets
      outputs:
        - path: results/channel-exergy-budget.json
          storage: git
      description: >
        The budget of the fluctuations' exergy in Lee & Moser's channels,
        from their budgets of each Reynolds stress component: production
        as its reversible source, pressure-strain and dissipation as its
        inviscid and viscous sinks.
    fit-exergy-destruction:
      kind: python-script
      environment: py-sindy
      script_path: scripts/fit-exergy-destruction.py
      inputs:
        - from_stage_outputs: analyze-channel-exergy-budget
      outputs:
        - path: results/exergy-destruction-fit.json
          storage: git
      description: >
        Whether the inviscid destruction of the fluctuations' exergy can be
        closed with the exergetic fraction and P_k / epsilon, by bagged
        STLSQ leaving each of Lee & Moser's channels out.
    test-exergy-saturation:
      kind: python-script
      environment: py-compute
      script_path: scripts/test-exergy-saturation.py
      inputs:
        - data/bienner-bypass-les
        - results/fluctuation-exergy.json
        - results/length-scale-onset.json
        - results/bypass-onset.json
      outputs:
        - path: results/exergy-saturation.json
          storage: git
      description: >
        Whether a transitional layer fills with fluctuation exergy to a
        common capacity with onset before it is full, tested on Bienner et
        al.'s two incompressible LES runs.
    build-lm-streak:
      kind: shell-command
