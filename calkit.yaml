  - question: >-
      Where do the transition models put onset across free-stream intensity,
      and is that where Langtry-Menter's remaining error comes from?
    hypothesis: >-
      A model with an intensity-dependent onset moves its onset with the
      intensity as the DNS does; one with a fixed $Re_v$ threshold puts onset
      at about one $Re_\theta$ whatever the intensity. Langtry-Menter's error
      on Wu et al.'s flows is mostly onset in the wrong place.
    answer: >-
      Langtry-Menter moves its onset with the intensity as the DNS does, but
      early: at the four intensities where both transition, its onset
      $Re_\theta$ is {lm_lo:.2f} to {lm_hi:.2f} of the DNS's under this
      definition; with onset taken from the rise of $C_f$, the plate sits
      inside the band of Wu et al.'s flows, and most of the error is at the
      lowest intensity (see the next question). The clipping closure puts onset between $Re_\theta$
      {c_lo:.0f} and {c_hi:.0f} at every intensity, from {c_rlo:.2f} to
      {c_rhi:.2f} of the DNS's: its threshold on $Re_v$ cannot see the free
      stream, while the DNS's onset runs from $Re_\theta$ {d_hi:.0f} at 1.5
      percent to {d_lo:.0f} at 6. kkL-omega transitions at {k_lo:.2f} to {k_hi:.2f}
      of the DNS's $Re_\theta$, and fully turbulent SST from the start.
    notes: >-
      Onset is the first station where the shape factor falls below 2.2,
      for the DNS and every model alike (scripts/score-wu-openfoam.py). At
      0.75 percent neither the DNS nor Langtry-Menter falls below it inside
      the domain; the clipping closure does, at $Re_\theta$ about 275.
    evidence:
      - kind: result
        path: results/wu-openfoam.json
        values:
          lm_lo: onset_ratio_to_dns.k-omega-sst-lm.min
          lm_hi: onset_ratio_to_dns.k-omega-sst-lm.max
          c_lo: onset_re_theta_min.clip-k-gamma
          c_hi: onset_re_theta_max.clip-k-gamma
          c_rlo: onset_ratio_to_dns.clip-k-gamma.min
          c_rhi: onset_ratio_to_dns.clip-k-gamma.max
          k_lo: onset_ratio_to_dns.kkl-omega.min
          k_hi: onset_ratio_to_dns.kkl-omega.max
          d_hi: dns_onset.wu-bypass-tu150.re_theta_onset
          d_lo: dns_onset.wu-bypass-tu600.re_theta_onset
  - question: >-
      Could one constant, calibrated on the JHTDB plate, correct
      Langtry-Menter's transition onset on Wu et al.'s flows?
    hypothesis: >-
      Yes, if Langtry-Menter is early on the plate by the factor it is early
      on Wu et al.'s flows: the plate's onset ratio lies within the band of
      the Wu ratios, widened by 5 percent either side.
    answer:
      if in_band: >-
        Possibly. With onset taken from the rise of $C_f$ out of its laminar
        minimum on every flow, Langtry-Menter's onset $Re_\theta$ is
        {plate:.2f} of the DNS's on the plate and {wlo:.2f} to {whi:.2f} on
        the Wu et al. flows that transition inside the domain, so the plate
        sits within their band. The correction the plate calls for would
        move {nworse} of those {nwu} flows further from the DNS, but at 1.5
        percent, the farthest off, it takes onset only from {r150:.2f} to
        {c150:.2f}: most of the error is at the lowest intensity, which one
        constant cannot remove.
      else: >-
        No. Its onset ratio is {plate:.2f} on the plate and {wlo:.2f} to
        {whi:.2f} on Wu et al.'s flows.
    notes: >-
      Onset is the first station past the laminar minimum of $C_f$ at which
      $C_f$ has risen a quarter of the way to its peak downstream, where
      that peak is at least one and a half times the minimum
      (scripts/test-lm-onset-transfer.py); Wu et al.'s 0.75 and 6 percent
      flows have no such rise inside the domain. An earlier definition, the
      shape factor falling from its own laminar maximum, anchored each run
      to its own laminar value and, with $\theta$ then integrated past the
      edge, made the plate look late. The corrected ratios were added after
      the gate was run.
    evidence:
      - kind: result
        path: results/lm-onset-transfer.json
        values:
          in_band: in_band
          plate: plate_ratio
          wlo: wu_ratio_min
          whi: wu_ratio_max
          r150: wu.wu-bypass-tu150.ratio
          nworse: n_corrected_worse
          nwu: n_wu
          c150: corrected_ratio.wu-bypass-tu150
  - question: >-
      Does the streak physics predict how bypass onset depends on the
      free-stream intensity better than Langtry-Menter's correlation?
    hypothesis: >-
      Yes. Streaks grow like $Tu\, Re_x^{{1/2}}$ and break down at a fixed
      amplitude, so onset is at $Re_x = K^2 / Tu_\mathrm{{in}}^2$. With K from the JHTDB
      plate alone, applied to each flow's own DNS, this predicts Wu et al.'s
      onset $Re_\theta$ with a lower log-rms error than Langtry-Menter's
      correlation applied to the same DNS.
    answer:
      if streak_beats_lm: >-
        Yes. With one constant from the plate, the streak rule predicts Wu et
        al.'s onset $Re_\theta$ to a log-rms error of {e_s:.3f}, against
        {e_lm:.3f} for Langtry-Menter's correlation and {e_m:.3f} for
        Mayle's; fitted to Wu et al.'s flows leaving each out, it is hardly
        better ({e_loo:.3f}), so the plate's constant transfers. At 2.25
        percent it is almost exact ({s225:.0f} against {d225:.0f}). Both
        rules are early at 6 percent ({s600:.0f} and {lm600:.0f} against
        {d600:.0f}): the streak rule assumes $Re_x$ at onset falls as $Tu^{{-2}}$,
        and the DNS shows $Tu^{{-{n:.2f}}}$. On the plate, Langtry-Menter's
        correlation gives {lmp:.2f} of the DNS's onset $Re_\theta$. An
        onset set by streak amplitude, the mechanism, carries between these
        flows better than the empirical correlation does, with one number.
      else: >-
        No. The streak rule's log-rms error is {e_s:.3f}, against {e_lm:.3f}
        for Langtry-Menter's correlation.
    notes: >-
      The rules are applied to each flow's own DNS boundary layer and free
      stream, so they are tested without a closure's errors. At 0.75 percent
      neither the streak rule nor Langtry-Menter's correlation puts onset
      inside the domain; the DNS's is near its end. Wu et al.'s onset is
      intermittency 0.1; the plate's, which sets K, is its $C_f$ minimum, as
      the plate has no intermittency. $Re_x$ on the plate is from its leading
      edge.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds.
    evidence:
      - kind: result
        path: results/onset-laws.json
        values:
          streak_beats_lm: streak_beats_lm
          e_s: errors.streak.log_rms
          e_lm: errors.langtry_menter.log_rms
          e_m: errors.mayle.log_rms
          e_loo: errors.streak_loo.log_rms
          s225: cases.WM225.streak
          d225: cases.WM225.dns
          s600: cases.WM600.streak
          lm600: cases.WM600.langtry_menter
          d600: cases.WM600.dns
          n: dns_onset_exponent
          lmp: plate_langtry_menter_ratio
  - question: >-
      Does the streak rule survive being put in local form, as a correlation
      a closure like Langtry-Menter's could carry?
    hypothesis: >-
      Yes. In a laminar layer $Re_\theta = 0.664\, Re_x^{{1/2}}$, so the streak rule
      becomes $Re_{{\theta,\mathrm{{onset}}}} = C / Tu$. With C set on the JHTDB plate and the
      rule applied at the local free-stream intensity, as Langtry-Menter's
      correlation is, it predicts Wu et al.'s onsets with a lower log-rms
      error than that correlation.
    answer:
      if local_beats_lm: >-
        Yes, with some loss. As $Re_{{\theta,\mathrm{{onset}}}} = {c:.0f} / Tu$ at the local
        intensity it predicts Wu et al.'s onsets to {e_loc:.3f}, against
        {e_lm:.3f} for Langtry-Menter's correlation, though not to the
        {e_s:.3f} of the form in the inlet intensity: the local intensity has
        decayed by the time the layer reaches onset, and the inlet one
        carries the history the streaks integrated. It is early at 6 percent
        ({l600:.0f} against {d600:.0f}), as every rule here is. So a closure
        whose transported onset Reynolds number is set by $C / Tu$ rather than
        Langtry-Menter's correlation, which falls only as about $Tu^{{-0.67}}$,
        should place onset better across intensity.
      else: >-
        No. Calibrated on the plate, $C = {c:.0f}$, the local form predicts
        Wu et al.'s onsets to {e_loc:.3f} against {e_lm:.3f} for
        Langtry-Menter's correlation, where the form in the inlet intensity
        reaches {e_s:.3f}. The local intensity has decayed by onset, while
        the inlet one carries the history the streaks integrated, so the rule
        does not survive the move to local quantities.
    notes: >-
      Added after the inlet-intensity form had passed, with this test set
      before it was run. C is set by matching the plate's onset with the
      rule applied at the plate's local free-stream intensity.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/onset-laws.json
        values:
          local_beats_lm: local_beats_lm
          c: c_local
          e_loc: errors.streak_local.log_rms
          e_lm: errors.langtry_menter.log_rms
          e_s: errors.streak.log_rms
          l600: cases.WM600.streak_local
          d600: cases.WM600.dns
  - question: >-
      Does Langtry-Menter place transition better across free-stream
      intensity with the streak onset correlation in place of its own?
    hypothesis: >-
      Yes. With $Re_{{\theta t}} = C / Tu$ and C calibrated by running the model on
      the JHTDB plate, it beats standard Langtry-Menter's mean score on Wu et
      al.'s five flows.
    answer:
      if passes: >-
        Only marginally. Calibrated on the plate at $C = {c:.0f}$, it scores
        a mean of {ms:.2f} on Wu et al.'s flows against {ml:.2f} for the
        standard model, winning {wins} of five, with a plate $C_f$ error of
        {pe:.3f} against {pl:.3f}.
      else: >-
        No. The plate is fitted better than by Langtry-Menter's own
        correlation, a $C_f$ error of {pe:.3f} against {pl:.3f} at $C = {c:.0f}$,
        but on Wu et al.'s flows it scores a mean of {ms:.2f} against {ml:.2f}
        and wins {wins} of five. At 1.5 percent it transitions earlier still
        than the standard model ($Re_\theta$ {s150:.0f}, against {l150:.0f} and
        the DNS's {d150:.0f}), and at 6 percent it is unchanged. The constant
        set by applying the rule to the DNS, {cd:.0f}, puts the plate's onset
        late (a $C_f$ error of {pe628:.3f}), because the full model already
        transitions late there; the constant the model needs on the plate
        makes the low intensities early. This is the third time the plate
        and Wu et al.'s flows have pulled a calibration in opposite
        directions, after the streak growth and Langtry-Menter's onset
        factor: something that differs between them, which the free-stream
        intensity does not carry, moves onset.
    notes: >-
      kOmegaSSTLMStreak (sim/lmStreak) is OpenFOAM's kOmegaSSTLM with only
      its free-stream onset correlation replaced, run through a wrapper
      around sim/run.py so the cases are set up exactly as the standard
      model's. A first test, with the DNS-level constant and a limit of 10
      percent on the plate's $C_f$ error, failed on the plate alone, so its Wu
      runs were not made; C was then calibrated on the model over the grid
      in results/lm-streak-calibration.json.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds. This variant's inlet
      $Re_{{\theta t}}$ was left at Langtry-Menter's own correlation, and on
      Wu et al.'s flows Langtry-Menter's onset is started by its
      eddy-viscosity route before the correlation can act
      (results/lm-onset-gate.json), so the result says little about the
      streak correlation itself; see the later questions.
    evidence:
      - kind: result
        path: results/lm-streak.json
        values:
          passes: passes
          c: c_streak
          ms: mean_streak
          ml: mean_lm
          wins: n_wins
          pe: plate_cf_err_streak
          pl: plate_cf_err_lm
          s150: cases.wu-bypass-tu150.streak_re_theta_onset
          l150: cases.wu-bypass-tu150.lm_re_theta_onset
          d150: cases.wu-bypass-tu150.dns_re_theta_onset
      - kind: result
        path: results/lm-streak-calibration.json
        values:
          cd: c_dns_level
          pe628: plate_cf_err_at_628
      - kind: result
        path: results/lm-onset-gate.json
  - question: >-
      Is the plate's streaky inlet what puts Langtry-Menter's onset late on
      the plate where it is early on Wu et al.'s flows?
    hypothesis: >-
      It could be. The plate's layer arrives carrying fluctuation energy and
      Wu et al.'s arrives quiet; removing the plate's excess moves
      Langtry-Menter's plate onset ratio into the band of its ratios on Wu
      et al.'s 1.5 to 3 percent flows, widened by 5 percent either side.
    answer:
      if in_band: >-
        Its premise does not hold. With onset taken from the rise of $C_f$,
        Langtry-Menter's plate onset ratio is {st:.2f} from the DNS inlet and
        {q:.2f} from the quiet one, both inside the band of Wu et al.'s 1.5
        to 3 percent flows ({lo:.2f} to {hi:.2f}). The earlier finding that
        the plate was out of line came from how onset was measured, with
        $\theta$ integrated past the edge and the shape factor anchored to
        each run's own laminar value.
      else: >-
        No. With the layer's excess fluctuation energy removed and the
        velocity unchanged, Langtry-Menter's plate onset $Re_\theta$ is {rq:.0f}
        against {rs:.0f} from the DNS inlet and the DNS's {rd:.0f}: a ratio of
        {q:.2f} against {st:.2f}, still outside the Wu band of {lo:.2f} to
        {hi:.2f}. The inlet's streak energy is not what separates the plate
        from Wu et al.'s flows for this model. Of the three candidates, that
        leaves the free stream: its length scale and its decay.
    notes: >-
      The plate's DNS inlet is already Blasius-like in its mean velocity
      inside the layer (H about 2.6), so only k was changed
      (results/plate-quiet-inlet.json). No public DNS varies the free-stream
      length scale at fixed intensity; the closest design, two DNS at nearly
      the same intensity with integral scales about 2.5 times apart
      (Durovic et al. 2024, Physics of Fluids 36, 074105), has no public
      data found, and the one open factorial dataset is LES.
    evidence:
      - kind: result
        path: results/plate-quiet-inlet-test.json
        values:
          in_band: in_band
          q: ratio_quiet
          st: ratio_streaky
          lo: band_min
          hi: band_max
          rq: re_theta_onset_quiet
          rs: re_theta_onset_streaky
          rd: re_theta_onset_dns
  - question: >-
      At fixed free-stream intensity, how much does the free-stream length
      scale move bypass onset, and is it the length scale or the decay?
    hypothesis: >-
      A larger length scale brings onset forward (Brandt et al.), and since a
      smaller-scale free stream decays faster, the shift is the decay: at
      each run's local intensity, Langtry-Menter's correlation reproduces the
      ratio of onset $Re_\theta$ between the two within 20 percent.
    answer:
      if larger_scale_earlier and decay_explains: >-
        Onset moves little, and the decay accounts for it. In Bienner et
        al.'s two Mach 0.1 air runs, both at an inlet intensity near 4 percent
        with free-stream length scales {ls:.0f} and {ll:.0f} inlet momentum
        thicknesses ({lr:.0f} times apart), onset is at $Re_\theta$ {os:.0f} and
        {ol:.0f}, a ratio of {les:.2f}: the larger scale brings it forward, by
        about a tenth for a tenfold change. Langtry-Menter's correlation at
        each run's local intensity gives {lm:.2f}, within the tolerance
        though it overstates the shift, since the smaller-scale
        free stream has decayed to {tus:.1f} percent by onset where the larger
        is still at {tul:.1f}. The peak $u_\mathrm{{rms}}$ at onset is {us:.3f} and {ul:.3f}
        of the free-stream speed, around the 0.12 of Wu et al.'s DNS and the
        plate, so the onset amplitude holds across length scale too. The
        plate's free-stream scale, {lp:.0f}, is four to six times below Wu et
        al.'s ({lwlo:.0f} to {lwhi:.0f}); at this sensitivity that moves
        onset by well under a tenth, so the length scale is not a large
        difference between them.
      elif larger_scale_earlier: >-
        The larger scale brings onset forward (a ratio of {les:.2f}), but the
        decay alone predicts {lm:.2f}, outside the tolerance.
      else: >-
        No. The larger scale does not bring onset forward here: a ratio of
        {les:.2f}.
    notes: >-
      Bienner et al.'s runs are LES (Bienner2024), admitted by exception to
      the DNS-first rule because no public DNS varies the length scale at
      fixed intensity; at $Re_\theta$ about 830 their turbulent profiles match
      the JHTDB DNS to a few percent in U+ and -uv+. Onset is the $C_f$
      minimum past the first tenth of each run; length scales are
      dissipation lengths from each free stream's decay, which put the two
      further apart than the factor of seven between the paper's integral
      scales.
    evidence:
      - kind: result
        path: results/length-scale-onset.json
        values:
          larger_scale_earlier: larger_scale_earlier
          decay_explains: decay_explains
          ls: runs.small.L_over_theta_inlet
          ll: runs.large.L_over_theta_inlet
          lr: length_ratio
          os: runs.small.re_theta_onset
          ol: runs.large.re_theta_onset
          les: les_onset_ratio
          lm: lm_onset_ratio
          tus: runs.small.tu_onset_percent
          tul: runs.large.tu_onset_percent
          us: runs.small.urms_peak_onset
          ul: runs.large.urms_peak_onset
          lp: plate_L_over_theta_inlet
          lwlo: wu_L_over_theta_inlet_min
          lwhi: wu_L_over_theta_inlet_max
  - question: >-
      Is the free stream's decay what separates Langtry-Menter's onset on
      the plate from its onset on Wu et al.'s flows?
    hypothesis: >-
      It could be. The baseline inlets fit the free-stream decay over a
      stretch running well past onset; with each inlet $\omega$ refitted so
      the free stream follows the measured decay up to onset, constants as
      published, the plate's onset ratio falls inside the band of the ratios
      on Wu et al.'s 1.5 to 3 percent flows, widened by 5 percent either side.
    answer:
      if in_band: >-
        Its premise does not hold. With onset taken from the rise of $C_f$,
        the plate's onset ratio is {pr:.2f} with the decay matched to onset
        and {base:.2f} without, both within 5 percent of the band of Wu et
        al.'s ratios ({lo:.2f} to {hi:.2f}). Matching the decay brings the free-stream intensity at
        onset to the DNS's ({tm:.2f} percent against {td:.2f}) but barely
        moves onset.
      else: >-
        No. The refit does what it should: at the DNS onset the plate's
        free-stream intensity is now {tm:.2f} percent against the DNS's
        {td:.2f} (the baseline had {tb:.2f}), and at 6 percent {t6m:.2f}
        against {t6d:.2f} (baseline {t6b:.2f}). But the plate's onset ratio
        only moves to {pr:.2f}, still outside the band of {lo:.2f} to
        {hi:.2f}, and the mean score on Wu et al.'s flows goes from {wb:.2f}
        to {wm:.2f}. With the inlet's streak energy and the free stream's
        length scale already ruled out, its decay is ruled out too.
    notes: >-
      The runs are standard Langtry-Menter with only the inlet $\omega$
      changed (results/matched-decay.json, sim/run_matched_decay.py), set up
      otherwise exactly as the baselines. The plate's pressure gradient,
      the other difference the old onset measure seemed to point at, is the
      next question.
    evidence:
      - kind: result
        path: results/matched-decay-test.json
        values:
          in_band: in_band
          pr: plate_ratio
          lo: band_min
          hi: band_max
          wm: wu_mean
          wb: wu_mean_baseline
          tm: plate.tu_onset_model
          td: plate.tu_onset_dns
          tb: plate.tu_onset_baseline
          t6m: wu.wu-bypass-tu600.tu_onset_model
          t6d: wu.wu-bypass-tu600.tu_onset_dns
          t6b: wu.wu-bypass-tu600.tu_onset_baseline
      - kind: result
        path: results/lm-onset-transfer.json
        values:
          base: plate_ratio
  - question: >-
      Does imposing the DNS's pressure gradient on the plate change where and
      how Langtry-Menter transitions there?
    hypothesis: >-
      It could bring the plate into line. The plate runs' zero-gradient top
      lets the displaced layer accelerate the free stream, where the DNS's
      decelerates, so the model sees a mildly favorable gradient ahead of
      onset where the DNS sees an adverse one. With the DNS's top velocity
      imposed, the plate's onset ratio falls inside the band of
      Langtry-Menter's ratios on Wu et al.'s 1.5 to 3 percent flows, widened
      by 5 percent either side.
    answer:
      if in_band: >-
        It improves how the plate transitions more than where. With the
        DNS's velocity imposed along the top, the model's edge velocity
        changes by {pg_e:.1%} from inlet to onset, as the DNS's does
        ({d_e:.1%}), where the zero-gradient top let it change by
        {zg_e:.1%}, and the plate's mean $C_f$ error falls from {zg_cf:.3f}
        to {pg_cf:.3f}. Onset moves only from {zg_r:.2f} to {pg_r:.2f} of the
        DNS's $Re_\theta$, both within 5 percent of the band of Wu et al.'s
        1.5 to 3 percent flows ({lo:.2f} to {hi:.2f}).
      else: >-
        No. With the DNS's pressure gradient the plate's onset ratio is
        {pg_r:.2f}, outside the band of {lo:.2f} to {hi:.2f}, though its mean
        $C_f$ error falls from {zg_cf:.3f} to {pg_cf:.3f}.
    notes: >-
      Every plate run now imposes the DNS's top velocity
      (results/plate-top-velocity.json, run.py --top-velocity); one
      Langtry-Menter run keeps the old zero-gradient top for this
      comparison. Onset as in results/lm-onset-transfer.json, from the rise
      of $C_f$. A trial run's $C_f$ history was seen before this stage and
      before the corrected onset measure existed.
    evidence:
      - kind: result
        path: results/plate-pressure-gradient.json
        values:
          in_band: in_band
          pg_e: pg.edge_change_to_onset
          zg_e: zg.edge_change_to_onset
          d_e: dns_edge_change_to_onset
          pg_cf: pg.cf_err
          zg_cf: zg.cf_err
          pg_r: pg.ratio
          zg_r: zg.ratio
          lo: band_min
          hi: band_max
  - question: >-
      Can the streak onset rule be carried by accumulating the free stream's
      forcing from the leading edge, instead of reading the inlet intensity?
    hypothesis: >-
      Yes. Lift-up makes the streaks' energy grow with the forcing they have
      received, so onset is where $\int_0^{{Re_x}} Tu^2\, dRe_x$ reaches a
      level set on the plate. At a constant intensity that is the inlet rule
      exactly, and a closure can transport it. It passes if it predicts Wu et
      al.'s onsets with a lower log-rms error than Langtry-Menter's
      correlation.
    answer:
      if passes: >-
        Yes. With its level set on the plate it predicts Wu et al.'s onset
        $Re_\theta$ to {hist:.3f}, against {lm:.3f} for Langtry-Menter's
        correlation and {inlet:.3f} for the inlet rule.
      else: >-
        No. With its level set on the plate it predicts Wu et al.'s onset
        $Re_\theta$ to a log-rms error of {hist:.3f}, against {lm:.3f} for
        Langtry-Menter's correlation and {inlet:.3f} for the inlet rule,
        early on every flow. The plate's free stream decays hard, so by
        onset it has received only {pdec:.2f} of the forcing its inlet
        intensity implies, so the level set on it is low. In
        Wu et al.'s flows the forcing accumulated by onset is not constant
        either, rising from {f150:.2g} at 1.5 percent to {f600:.2g} at 6.
        Onset follows the intensity near the leading edge, not the forcing
        received since, consistent with streaks seeded there that then grow
        on their own.
    notes: >-
      Applied to each flow's own DNS free stream and boundary layer, as in
      results/onset-laws.json. Upstream of each dataset's first station the
      intensity is taken as the first station's.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/onset-history.json
        values:
          passes: passes
          hist: errors.history.log_rms
          lm: errors.langtry_menter.log_rms
          inlet: errors.streak.log_rms
          pdec: plate_forcing_over_inlet_at_onset
          f150: cases.WM150.forcing_at_dns_onset
          f600: cases.WM600.forcing_at_dns_onset
  - question: >-
      Was the local form of the streak onset rule failing because it used
      the local intensity or because it used $Re_\theta$?
    hypothesis: >-
      The local intensity. Applied at each flow's inlet intensity,
      $Re_{{\theta,\mathrm{{onset}}}} = C / Tu_\mathrm{{in}}$ with $C$ set on the
      plate predicts Wu et al.'s onsets with a lower log-rms error than
      Langtry-Menter's correlation, so a closure needs only the leading-edge
      intensity carried into the layer.
    answer:
      if theta_inlet_passes: >-
        The local intensity. With $C = {c:.0f}$ from the plate,
        $Re_{{\theta,\mathrm{{onset}}}} = C / Tu_\mathrm{{in}}$ predicts Wu et al.'s
        onsets to a log-rms error of {th:.3f}, against {lm:.3f} for
        Langtry-Menter's correlation and {inlet:.3f} for the inlet rule in
        $Re_x$. Unfitted, it also places Bienner et al.'s two LES onsets, at
        $Re_\theta$ {bs:.0f} and {bl:.0f} against {bsl:.0f} and {bll:.0f}.
        One constant from the plate carries across three independent
        datasets. A closure needs the intensity at the leading edge carried
        into the layer; $Re_\theta$ it already has locally.
      else: >-
        Not the local intensity alone. At the inlet intensity,
        $Re_{{\theta,\mathrm{{onset}}}} = C / Tu_\mathrm{{in}}$ predicts Wu et al.'s
        onsets to {th:.3f}, against {lm:.3f} for Langtry-Menter's
        correlation.
    notes: >-
      Added after the accumulated-forcing form failed, with this test set
      before it was run; the Bienner comparison was added after, unfitted.
      $Tu_\mathrm{{in}}$ is the free-stream intensity at each dataset's
      first station. Bienner et al.'s runs are LES, admitted by exception.
      At 0.75 percent neither the DNS's onset nor the rule's falls inside
      the domain's range of $Re_\theta$.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/onset-history.json
        values:
          theta_inlet_passes: theta_inlet_passes
          c: c_inlet
          th: errors.theta_inlet.log_rms
          lm: errors.langtry_menter.log_rms
          inlet: errors.streak.log_rms
          bs: bienner.small.theta_inlet
          bl: bienner.large.theta_inlet
          bsl: bienner.small.les
          bll: bienner.large.les
  - question: >-
      Does Langtry-Menter place transition better across free-stream
      intensity when its layer keeps the intensity at which its fluid
      entered it?
    hypothesis: >-
      Yes. With the streak correlation, $Re_{{\theta t}} = C / Tu$, and no
      diffusion of $Re_{{\theta t}}$, each streamline in the layer keeps
      the value it entered with, starting from $C / Tu_\mathrm{{in}}$ at the
      inlet, which is what the rule applied to the DNS needs. Calibrated on
      the plate by running the model, it beats standard Langtry-Menter's
      mean normalized score on Wu et al.'s flows.
    answer:
      if passes: >-
        On its pre-set measure, narrowly, but not by moving onset. At $C =
        {c:.0f}$ from the plate it scores a mean of {le:.2f} on Wu et al.'s
        flows against {lm:.2f}, winning {wins} of five, with a plate $C_f$
        error of {cfle:.3f} against {cflm:.3f}. The layer does hold the new
        value, at 1.5 percent {rle:.0f} against the standard model's
        {rlm:.0f}, but where all three transition, the standard model and
        both variants put onset within {spread:.0%} of each other, and the
        onset errors against the DNS are {ele:.3f} for this variant,
        {elm:.3f} for the standard model and {est:.3f} with diffusion. On
        these flows Langtry-Menter's onset barely answers to
        $Re_{{\theta t}}$, so a correlation carried through it does not
        deliver what the rule does when applied to the DNS.
      else: >-
        No. At $C = {c:.0f}$ from the plate it scores a mean of {le:.2f} on
        Wu et al.'s flows against {lm:.2f}. The layer holds the new value,
        at 1.5 percent {rle:.0f} against the standard model's {rlm:.0f}, but
        the three Langtry-Menter runs put onset within {spread:.0%} of each
        other wherever all three transition.
    notes: >-
      sim/run_lm_leading_edge.py, with sigmaThetat = 0. A first calibration
      scan left $Re_{{\theta t}}$ at the inlet at Langtry-Menter's
      correlation and showed $C$ barely moving the plate, since without
      diffusion the layer keeps the inlet's value; the runs now start from
      $C / Tu_\mathrm{{in}}$, and the grid was moved down after a trial at
      the DNS-level value put the plate's onset late. The plate's $C_f$
      error is sharply sensitive to $C$, so on the plate the correlation
      does set onset. The layer's $Re_{{\theta t}}$ is from the fields saved
      by results/lm-onset-gate.json's runs, the median at the wall along
      the plate, added after the runs.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/lm-leading-edge.json
        values:
          passes: passes
          c: c_streak
          le: mean_le
          lm: mean_lm
          wins: n_wins
          cfle: plate_cf_err_le
          cflm: plate_cf_err_lm
          spread: max_onset_spread
          ele: onset_errors.le.log_rms
          elm: onset_errors.lm.log_rms
          est: onset_errors.streak.log_rms
      - kind: result
        path: results/lm-onset-gate.json
        values:
          rle: runs.le.layer_re_theta_t
          rlm: runs.lm.layer_re_theta_t
      - kind: result
        path: results/lm-le-calibration.json
  - question: >-
      What starts Langtry-Menter's transition on Wu et al.'s flows, if not
      its onset correlation?
    hypothesis: >-
      Its second route to onset. Intermittency is produced where $F_\mathrm{{onset2}}
      - F_\mathrm{{onset3}} > 0$, and $F_\mathrm{{onset3}} = \max(1 - (R_T/2.5)^3, 0)$
      vanishes once the eddy-viscosity ratio $R_T$ reaches 2.5, letting
      production run before $Re_v$ reaches the correlation's critical value.
      On the 1.5 percent flow, in both standard Langtry-Menter and the
      leading-edge variant, $R_T$ reaches 2.5 in the layer upstream of where
      $F_\mathrm{{onset1}}$ reaches 1, at $Re_\theta$ within 5 percent of each
      other, while their $Re_{{\theta c}}$ differ by more than 10 percent.
    answer:
      if rt_gates_onset: >-
        The modeled free-stream turbulence reaching into the layer. On the
        1.5 percent flow $R_T$ reaches 2.5 in the layer at $Re_\theta$
        {g_lm:.0f} in standard Langtry-Menter and {g_le:.0f} in the
        leading-edge variant, upstream of where $Re_v$ reaches the
        correlation's critical value ({c_lm:.0f} and {c_le:.0f}), though
        their $Re_{{\theta c}}$ differ by {rc:.0%}. From there intermittency
        is produced whatever the correlation says, which only sets how fast
        it grows; both models transition at about {o_lm:.0f}, against the
        DNS's {dns:.0f}. On this flow onset is set by the modeled free
        stream's turbulence reaching the layer, not by the transition
        correlation, which is why changing the correlation barely moves it
        on Wu et al.'s flows.
      else: >-
        Not $R_T$ alone. On the 1.5 percent flow $R_T$ reaches 2.5 in the
        layer at $Re_\theta$ {g_lm:.0f} and {g_le:.0f}, against the
        correlation's critical $Re_v$ at {c_lm:.0f} and {c_le:.0f}, with
        $Re_{{\theta c}}$ differing by {rc:.0%}.
    notes: >-
      Wu et al.'s 1.5 percent flow rerun with both models exactly as in
      wu-sims and lm-le-sims, keeping the final fields
      (sim/run_with_fields.py). Quantities are the largest in the layer,
      where $U$ is below 0.99 of its maximum, past the first tenth of the
      plate. The test was written after an exploratory look at the same
      cases' fields. The leading-edge rerun stopped on its residuals at the
      same iteration as in lm-le-sims.
    evidence:
      - kind: result
        path: results/lm-onset-gate.json
        values:
          rt_gates_onset: rt_gates_onset
          g_lm: runs.lm.re_theta_gate_open
          g_le: runs.le.re_theta_gate_open
          c_lm: runs.lm.re_theta_f1_reaches_1
          c_le: runs.le.re_theta_f1_reaches_1
          rc: re_theta_c_diff
          o_lm: runs.lm.re_theta_onset
          dns: dns_re_theta_onset
  - question: >-
      Can Langtry-Menter transition the JHTDB plate when only its onset
      correlation can start transition?
    hypothesis: >-
      Yes. With its eddy-viscosity route closed ($F_\mathrm{{onset3}}$ held at
      1), the leading-edge variant's correlation alone starts intermittency
      production, and a constant calibrated on the plate brings its $C_f$
      error near standard Langtry-Menter's, so the correlation can then be
      tested on Wu et al.'s flows.
    answer:
      if proceed: >-
        Yes. At $C = {c:.0f}$ its plate $C_f$ error is {err:.3f}, against
        {lm:.3f} for standard Langtry-Menter.
      else: >-
        No. Over $C$ from {clo:.0f} to {chi:.0f} its best plate $C_f$ error is
        {err:.3f}, {ratio:.1f} times standard Langtry-Menter's {lm:.3f}, and
        the failure is in the shape of transition rather than its place: at
        the lowest $C$ the layer starts early, with $C_f$ up to {early:.2f}
        times the DNS's, yet stays at {short:.2f} of the DNS's turbulent level
        downstream. Once only the correlation can start it, the layer does
        not become fully turbulent. With the route open the same variant
        reaches {le:.3f}, so Langtry-Menter depends on its eddy-viscosity
        route on the plate too. Wu et al.'s flows were not run.
    notes: >-
      kOmegaSSTLMGate (sim/lmGate) is kOmegaSSTLMStreak with a switch,
      rtOnset, that holds $F_\mathrm{{onset3}}$ at 1; run through
      sim/run_lm_gate.py on top of the leading-edge variant. Trial runs at
      the same four values of $C$ were made before the stage, and the rule
      of running Wu et al.'s flows only if the plate error came within 1.5
      times standard Langtry-Menter's was set after them.
    evidence:
      - kind: result
        path: results/lm-gate-calibration.json
        values:
          proceed: proceed
          c: c_streak
          err: plate_cf_err
          lm: plate_cf_err_lm
          ratio: error_over_lm
          clo: grid.0
          chi: grid.3
          early: scan.0.cf_ratio_max
          short: scan.0.cf_ratio_min_downstream
          le: plate_cf_err_le
  - question: >-
      Does the clipping closure transfer across free-stream intensity with
      its transition threshold set by the streak onset rule, with nothing
      fitted on the flows it is tested on?
    hypothesis: >-
      Yes. The rule puts onset at $Re_\theta = C / Tu_\mathrm{{in}}$, and the
      closure's threshold is on $Re_v$, whose laminar peak is $2.193
      Re_\theta$, so its threshold should fall as $1/Tu_\mathrm{{in}}$. Scaling
      the plate-calibrated threshold that way beats the fixed threshold on
      the mean normalized score over Wu et al.'s five flows and on at least
      three of them.
    answer:
      if passes and a < fit: >-
        Yes, and better than fitting the exponent. With the plate's
        threshold scaled as $1/Tu_\mathrm{{in}}$, the closure scores a mean of
        {a:.2f} on Wu et al.'s flows against {fixed:.2f} with the fixed
        threshold, winning {wins} of five, and against {fit:.2f} with the
        exponent fitted on the other flows' onsets (results/threshold-closure.json),
        beating that on {wfit} of five. The largest gains are at the lowest
        intensities: {a075:.1f} against {f075:.1f} at 0.75 percent. Taking
        the constant from the DNS instead of the plate's calibration scores
        {b:.2f}: the exponent carries, the constant has to be set on the
        closure. In the marching solver the inlet intensity is the leading
        edge's, so on these flows it stands in for a closure carrying the
        leading-edge intensity as an advected scalar; for scale,
        Langtry-Menter in OpenFOAM scores {lm:.2f}.
      elif passes: >-
        Yes, though not better than fitting the exponent. With the plate's
        threshold scaled as $1/Tu_\mathrm{{in}}$, the closure scores a mean of
        {a:.2f} on Wu et al.'s flows against {fixed:.2f} with the fixed
        threshold, winning {wins} of five, and against {fit:.2f} with the
        exponent fitted on the other flows' onsets (results/threshold-closure.json),
        beating that on {wfit} of five. The largest gains are at the lowest
        intensities: {a075:.1f} against {f075:.1f} at 0.75 percent. Taking
        the constant from the DNS instead of the plate's calibration scores
        {b:.2f}: the exponent carries, the constant has to be set on the
        closure. In the marching solver the inlet intensity is the leading
        edge's, so on these flows it stands in for a closure carrying the
        leading-edge intensity as an advected scalar; for scale,
        Langtry-Menter in OpenFOAM scores {lm:.2f}.
      else: >-
        No. With the plate's threshold scaled as $1/Tu_\mathrm{{in}}$, the
        closure scores a mean of {a:.2f} on Wu et al.'s flows against
        {fixed:.2f} with the fixed threshold, winning {wins} of five.
    notes: >-
      Fast tier, clip-k-omega-gamma with every other coefficient as
      calibrated on the JHTDB plate; only $\Lambda_c$ changes with the
      flow. The exponent 1 comes from the streak rule applied to the DNS
      (results/onset-history.json), which was tested on Wu et al.'s onsets
      before this, so the flows are not unseen by the rule, only by the
      closure. Like the fitted-exponent closure, this one needs the inlet
      intensity, which in a general code means transporting it.
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/onset-rule-closure.json
        values:
          passes: passes
          a: mean_a
          b: mean_b
          fixed: mean_fixed
          fit: mean_fitted
          wins: n_wins
          wfit: n_wins_a_vs_fitted
          a075: cases.wu-bypass-tu075.a_normalized
          f075: cases.wu-bypass-tu075.fixed_normalized
      - kind: result
        path: results/wu-openfoam.json
        values:
          lm: mean.k-omega-sst-lm
  - question: >-
      Can the clipping closure carry the leading-edge intensity itself, as a
      transported scalar, and still transition the JHTDB plate?
    hypothesis: >-
      Yes. A scalar $Tu_\mathrm{{LE}}$ advected without diffusion, relaxed to the
      local intensity only where the mean vorticity is small against
      $|U|/y$, keeps inside the layer the intensity at which its fluid
      entered, and scaling the threshold as $Tu_\mathrm{{ref}}/Tu_\mathrm{{LE}}$ with
      $Tu_\mathrm{{ref}}$ calibrated on the plate brings its $C_f$ error near the
      standard closure's, so it can be run on Wu et al.'s flows.
    answer: >-
      Not in this form. Over $Tu_\mathrm{{ref}}$ from {lo:.1f} to {hi:.1f} percent
      its best plate $C_f$ error, at {tu:.1f}, is {err:.3f}, {ratio:.1f} times
      the standard closure's {clip:.3f}, and the transition has two stages:
      $C_f$ rises to {cmax:.2f} times the DNS's at $x = {xmax:.0f}$, falls back
      to {cmin:.2f}, and only then becomes turbulent. The trial runs' fields
      point to why: on the plate the free stream decays as the layer grows,
      so the outer layer, where $Re_v$ is
      largest and the threshold acts, is filled with fluid that entered
      late, at a lower intensity: the scalar carries the intensity where
      each streamline entered, not the leading edge's, which is partly the
      local form the rule already failed in. Wu et al.'s flows were stopped
      after the first had begun.
    notes: >-
      clipKGammaLE (sim/clipLE, sim/run_clip_le.py). That the threshold sits
      at its rail across the outer layer over a long stretch, with the
      activation fraction near 0.3 and the inner layer's $Tu_\mathrm{{LE}}$ at the
      inlet's value, is from reading the last fields of the trial runs, not
      a pipeline output. A first trial at $Tu_\mathrm{{ref}}$ equal to the inlet's
      intensity transitioned late, which is why it is calibrated.
    evidence:
      - kind: result
        path: results/clip-le-calibration.json
        values:
          lo: grid.0
          hi: grid.4
          tu: tu_ref
          err: plate_cf_err
          ratio: error_over_clip
          clip: plate_cf_err_clip
          cmax: best.cf_ratio_max
          xmax: best.x_cf_ratio_max
          cmin: best.cf_ratio_min_after
  - question: >-
      Does the clipping closure transfer across free-stream intensity in
      OpenFOAM when its threshold reads the leading-edge intensity from the
      wall?
    hypothesis: >-
      Yes. The fluid next to the wall came from where the layer started, so
      reading the transported intensity there, and carrying it across the
      layer by the mesh wave that computes wall distance, gives every cell
      the leading-edge intensity. With the threshold scaled as
      $Tu_\mathrm{{ref}}/Tu_\mathrm{{LE}}$ and $Tu_\mathrm{{ref}}$ the plate's inlet
      intensity, the plate keeps its calibrated threshold, so its $C_f$ error
      stays within 10 percent of the standard closure's, and on Wu et al.'s
      five flows it beats the standard closure's mean normalized score and
      wins on at least three.
    answer:
      if passes and wall < lm: >-
        Yes, and better than Langtry-Menter, the best of the published
        models in OpenFOAM here (results/wu-openfoam.json). The plate is unchanged
        ($C_f$ error {pw:.4f} against {pc:.4f}), and on Wu et al.'s flows it
        scores a mean of {wall:.2f} against {clip:.2f} for the standard
        closure, winning {wins} of five, and against {lm:.2f} for
        Langtry-Menter, winning {wlm} of five. Where the DNS's onset falls
        inside the domain, its onset $Re_\theta$ is within a log-rms
        {ew:.3f} of the DNS's, against {elm:.3f} for Langtry-Menter and
        {ec:.3f} for the standard closure; at 1.5 percent it is {o150:.0f}
        against the DNS's {d150:.0f}, where Langtry-Menter gives {l150:.0f}.
        It matches the marching solver's closure that was handed the inlet
        intensity ({fast:.2f}), with no constant fitted beyond the plate's:
        the exponent comes from the streak rule, the reference from the
        plate's inlet.
      elif passes: >-
        Yes. The plate is unchanged ($C_f$ error {pw:.4f} against {pc:.4f}),
        and on Wu et al.'s flows it scores a mean of {wall:.2f} against
        {clip:.2f} for the standard closure, winning {wins} of five, though
        not better than Langtry-Menter's {lm:.2f}.
      else: >-
        No. Its plate $C_f$ error is {pw:.4f} against {pc:.4f}, and on Wu et
        al.'s flows it scores a mean of {wall:.2f} against {clip:.2f} for the
        standard closure, winning {wins} of five.
    notes: >-
      clipKGammaLE with wallTu on (sim/clipLE, sim/run-clip-wall.sh). The
      lookup is non-local, by the same mesh wave codes already run for wall
      distance; on general geometry it reads the intensity of the fluid
      nearest each wall, which near a stagnation point is the approaching
      free stream's. Onset errors are over the three flows where the DNS's
      onset, from the rise of $C_f$, falls inside the domain. The streak
      rule's exponent was tested on Wu et al.'s onsets before
      (results/onset-history.json), so the flows are unseen by the closure
      but not by the rule.
    evidence:
      - kind: result
        path: results/clip-wall.json
        values:
          passes: passes
          pw: plate_cf_err_wall
          pc: plate_cf_err_clip
          wall: mean_wall
          clip: mean_clip
          lm: mean_lm
          fast: mean_fast
          wins: n_wins
          wlm: n_wins_vs_lm
          ew: onset_errors.wall.log_rms
          elm: onset_errors.lm.log_rms
          ec: onset_errors.clip.log_rms
          o150: cases.wu-bypass-tu150.wall_re_theta_onset
          d150: cases.wu-bypass-tu150.dns_re_theta_onset
          l150: cases.wu-bypass-tu150.lm_re_theta_onset
  - question: >-
      Does reading the leading-edge intensity from the wall change the
      clipping closure on the Closure Challenge's separated and secondary
      flows?
    hypothesis: >-
      It should do no harm. These flows are periodic, so no fluid enters
      with an intensity; with the leading-edge intensity started at the
      reference, the threshold is the calibrated one except where cells are
      free-stream-like.
    answer: >-
      Not on the ducts: it scores exactly as the standard closure does
      ({le_d:.3f} against {c_d:.3f} on the aspect-ratio-14 duct), since
      neither closure's activation source fires there. On the hills it is
      slightly worse ({le_h:.2f} against {c_h:.2f} on the alpha = 1.5,
      Re = 13,929 hill): with no inlet, the intensity it carries settles
      where the periodic flow puts it, not at the reference. Neither family
      tests what the term is for; a free stream with a leading edge does.
    notes: >-
      Registered as clip-k-omega-gamma-le through the benchmark's plugin
      hook (pypkg/le_closures.py), which also sets up the OpenFOAM cases for
      it, so pypkg/closures.py and pypkg/cases are unchanged. The leading-edge
      intensity starts at the plate's inlet value on these cases, since none
      has an inlet. Every other model's scores reproduced exactly when the
      benchmark was rerun to add it. Rewritten on 2026-10-05: the earlier
      answer's exact agreement on every case came from the closure's
      coefficients never reaching OpenFOAM, which left TuRef at zero and the
      leading-edge term off, not from the flows. With the coefficients
      read, the activation fields agree bit for bit in the ducts, where it
      never fires, and the carried intensity settles well away from the
      reference on the hills (checked on the final fields).
    evidence:
      - kind: result
        path: results/benchmark-openfoam.json
        values:
          le_h: results.phll-alpha-15-13929-2024.clip-k-omega-gamma-le.normalized
          c_h: results.phll-alpha-15-13929-2024.clip-k-omega-gamma.normalized
          le_d: results.duct-ar-14-retau-180.clip-k-omega-gamma-le.normalized
          c_d: results.duct-ar-14-retau-180.clip-k-omega-gamma.normalized
  - question: >-
      How do the closures do on an airfoil near separation when the whole
      flow is solved, not just the suction-side boundary layer?
    hypothesis: >-
      As in the fast tier's NACA 4412 case, where the LES's edge velocity is
      handed to the march: the published turbulence models get the turbulent,
      strongly decelerated suction-side layer roughly right, and the
      transition models pay for their laminar run-up against an LES that is
      tripped.
    answer: >-
      SST does best, at {sst:.2f}, with the leading-edge clipping closure
      next at {le:.2f}, the standard clipping closure at {clip:.2f} and
      Langtry-Menter at {lm:.2f}. Launder-Sharma ({ls:.1f}) and laminar flow
      ({lam:.1f}) wreck the suction side, missing its edge velocity by
      {ue_ls:.0%} and {ue_lam:.0%}, and kkL-omega diverges. The attached models get
      the pressure distribution: SST's edge velocity is within {ue_sst:.1%}
      of the LES's. What separates them is the boundary layer: SST's forward
      $C_f$ is off by {cf_sst:.0%} RMS, the leading-edge closure's by
      {cf_le:.0%}, the clipping closure's by {cf_clip:.0%} and
      Langtry-Menter's by {cf_lm:.0%}, consistent with no model being
      tripped at x/c = 0.1 as the LES is.
    notes: >-
      NACA 4412 at 5 degrees and Re_c = 400,000 on a wall-resolved C-mesh
      with a far field at 20 chords and the NASA Turbulence Modeling
      Resource's quiet free stream (pypkg/airfoil_case.py,
      scripts/make-naca4412-case.py), scored on the suction side from x/c =
      0.2 against the KTH well-resolved LES with the fast tier's metrics plus
      the edge velocity. The edge velocity replaced the wall C_p after a trial
      SST run matched the LES's edge velocity to within one percent while its
      C_p sat 0.13 to 0.16 apart, which points to a different pressure
      reference. Each run stops once its scored errors settle or at 40,000
      iterations (pypkg/foam_body.py); SST and both clipping closures
      settle, the rest reach the cap. The model's shape factor is bounded at
      twice the LES's, since a profile reversed up to its sampled edge has
      none. Rewritten on 2026-10-06: the first answer was written before the
      clipping closure's coefficients reached OpenFOAM, and with them the
      leading-edge term acts here. The LES is a reference by exception
      (fidelity: les).
      Re-read on 2026-10-08 against the rerun with the plate's leading-edge
      intensity taken as its inlet's times the ratio the JHTDB documentation
      gives (results/plate-leading-edge-intensity.json): the claim holds.
    evidence:
      - kind: result
        path: results/benchmark-openfoam-airfoil.json
        values:
          sst: results.naca4412-rec-400000-openfoam.k-omega-sst.normalized
          clip: results.naca4412-rec-400000-openfoam.clip-k-omega-gamma.normalized
          le: results.naca4412-rec-400000-openfoam.clip-k-omega-gamma-le.normalized
          lm: results.naca4412-rec-400000-openfoam.k-omega-sst-lm.normalized
          lam: results.naca4412-rec-400000-openfoam.laminar.normalized
          ue_sst: results.naca4412-rec-400000-openfoam.k-omega-sst.ue_rel_rms
          cf_sst: results.naca4412-rec-400000-openfoam.k-omega-sst.cf_rel_rms
          cf_clip: results.naca4412-rec-400000-openfoam.clip-k-omega-gamma.cf_rel_rms
          cf_lm: results.naca4412-rec-400000-openfoam.k-omega-sst-lm.cf_rel_rms
          cf_le: results.naca4412-rec-400000-openfoam.clip-k-omega-gamma-le.cf_rel_rms
          ls: results.naca4412-rec-400000-openfoam.launder-sharma.normalized
          ue_ls: results.naca4412-rec-400000-openfoam.launder-sharma.ue_rel_rms
