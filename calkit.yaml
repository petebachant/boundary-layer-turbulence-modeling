  - question: >-
      Can the closure's own streak amplitude stand in for the inlet
      intensity that the inlet-scaled transition threshold has to be told?
    hypothesis: >-
      Yes. Scaling the calibrated $Re_v$ threshold by the station's peak
      streak amplitude, $\Lambda = Re_v (A / A_\mathrm{{ref}})^m / \Lambda_c$, with $m$
      fitted leaving each flow out as in the inlet-scaled test, beats the
      fixed $Re_v$ threshold on the mean score over Wu et al.'s five flows and
      on at least three of them, without being told the inlet.
    answer:
      if passes: >-
        Largely. It scores a mean of {ms:.2f} on Wu et al.'s flows against
        {mr:.2f} for the fixed threshold, winning {wins} of five, and
        {us:.2f} against {ur:.2f} on the three flows whose streaks it never
        saw, winning {uw}. The inlet-scaled threshold, which is told each
        inlet, does better still, a mean of {mi:.2f}; the streak-scaled one
        beats it on {wi} of five, and trails it most at 0.75 percent
        ({s075:.1f} against {i075:.1f}). The plate pays for it,
        {ps:.2f} against {pr:.2f}, because the streak amplitude grows along
        the plate where an inlet intensity is fixed. So the division of
        labor holds: $Re_v$ places transition, the closure's streaks carry the
        free stream's history, and together they recover most of what
        knowing the inlet was worth, from local quantities.
      else: >-
        No. It scores a mean of {ms:.2f} against {mr:.2f} for the fixed
        threshold, winning {wins} of five.
    notes: >-
      SplitStreakKOmegaGamma with trigger "rev_streak", the streak
      coefficients of results/split-streaks.json, and A_ref the plate's peak
      streak amplitude at the DNS onset. With $m = 0$ it reproduces the
      calibrated closure on the plate exactly, which was checked before any
      of Wu et al.'s flows was solved. $k_\infty$ still enters through the roll
      energy's free-stream boundary value, as the free-stream values enter
      any two-equation model; no inlet quantity does.
      Re-read on 2026-10-01 against the rerun with the momentum and
      displacement thicknesses integrated only to the edge and the DNS's top
      velocity on the plate runs: the claim holds, though only just: the share
